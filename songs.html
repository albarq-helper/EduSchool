<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Songs &amp; texts · Helper Academy</title><link rel="icon" href="assets/icons/brilliant.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@600&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
.unitbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pack{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.pack>header{padding:16px 18px 0;display:flex;flex-direction:column;gap:10px}
.pack h2{margin:0;font:800 1.35rem var(--f-display);display:flex;gap:10px;align-items:center}
.tabsx{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:0 18px}
.tabsx button{border:0;background:none;font:700 .92rem var(--f-body);color:var(--muted);padding:10px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabsx button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.modebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font:700 .88rem var(--f-body);color:var(--muted);padding:8px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent);border-radius:11px}
/* text */
.script{display:flex;flex-direction:column;gap:6px;font-size:1.06rem;line-height:1.55;max-width:760px}
.script h3{font:800 1.08rem var(--f-display);margin:14px 0 2px;color:var(--accent);display:flex;gap:8px;align-items:center}
.script .who{margin-top:8px;font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.script .who .nm{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.84rem}
.script .who i{font-weight:400;color:var(--muted);font-size:.9rem}
.script .ln{padding-left:14px;border-left:3px solid var(--rule)}
.cast{display:flex;gap:8px;flex-wrap:wrap}
.cast span{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:.88rem}
.r0{background:var(--sky-soft);color:var(--accent)}.r1{background:var(--coral-soft);color:var(--coral)}.r2{background:var(--teal-soft);color:var(--teal)}.r3{background:var(--sun-soft);color:#8A6100}
/* words */
mark.vw{background:var(--sun-soft);color:inherit;border-radius:6px;padding:0 3px;font-weight:700;cursor:pointer;border-bottom:2px solid var(--sun)}
mark.vw:hover,mark.vw:focus{outline:2px solid var(--accent);outline-offset:1px}
.letters{display:inline-flex;gap:2px;vertical-align:middle;flex-wrap:wrap}
.letters b{display:inline-grid;place-items:center;min-width:1.35em;height:1.5em;padding:0 2px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font:800 .86em var(--f-display)}
.letters.hide b{background:var(--paper);color:transparent;border:1px dashed var(--rule)}
input.gap{font:700 1em var(--f-body);padding:1px 6px;border:none;border-bottom:2.5px solid var(--accent);border-radius:6px 6px 0 0;background:var(--accent-soft);color:var(--ink);text-align:center;min-width:3.5em}
input.gap.ok{border-color:var(--good);background:var(--good-soft)}input.gap.no{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:.82em;color:var(--bad);font-weight:700;margin-left:2px}
/* song */
.player{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:18px;align-items:start}
@media (max-width:820px){.player{grid-template-columns:1fr}}
.vid{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px}
.vid video,.vid audio{width:100%;border-radius:16px;background:#000}
.vid audio{background:none}
.lyrics{display:flex;flex-direction:column;gap:2px;max-height:68vh;overflow:auto;padding:4px 4px 40vh;scroll-behavior:smooth;border-radius:12px}
.ly{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;font-size:1.06rem;line-height:1.45;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.ly .tm{font:600 .74rem var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);min-width:2.6rem}
.ly:hover{background:var(--paper)}
.ly.past{color:var(--ink)}
.ly.now{background:var(--accent-soft);color:var(--ink);font-weight:700;transform:scale(1.01)}
.ly.now .tm{color:var(--accent)}
.ly.stage{font-style:italic}.ly.intro{font-weight:700;color:var(--accent)}.ly.intro svg{vertical-align:-2px}
.nolines{color:var(--muted)}
.res{font-weight:700}.res.ok{color:var(--good)}.res.no{color:var(--bad)}
/* word pop-up */
#pop{position:fixed;z-index:50;max-width:300px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px;display:none;flex-direction:column;gap:8px}
#pop.on{display:flex}
#pop img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--rule)}
#pop .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font:800 1.2rem var(--f-display)}
#pop .tr{font-family:var(--f-ar);font-size:1.1rem}
.script .para{margin:0 0 6px;color:var(--ink);max-width:70ch}
table.guide{width:100%;font-size:.95rem}table.guide td{vertical-align:top}
table.guide td:nth-child(3){text-align:center;font-weight:800;color:var(--accent)}
mark.vw.chunks{background:var(--sun-soft)}
.psyl{font:800 1.35rem/1.2 var(--f-head);display:flex;align-items:baseline;flex-wrap:wrap;gap:2px;margin-top:-4px}.psyl .pdot{color:var(--ink);opacity:.55;margin:0 2px}.psyl .pcount{font:700 .8rem var(--f-body);color:var(--muted);margin-left:10px}.c0{color:var(--s1,#2347C5)}.c1{color:var(--s2,#C2410C)}.c2{color:var(--s3,#0F766E)}.c3{color:var(--s4,#7C3AED)}
.dot{color:var(--muted);font-weight:400;margin:0 1px}
:root{--s1:#2347C5;--s2:#C2410C;--s3:#0F766E;--s4:#7C3AED}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#8FA8FF;--s2:#FF9F6B;--s3:#4FD1C0;--s4:#C4A5FF}}
:root[data-theme="dark"]{--s1:#8FA8FF;--s2:#FF9F6B;--s3:#4FD1C0;--s4:#C4A5FF}
.empty-s{padding:40px 20px;text-align:center}
.cov{margin:0 0 18px}.cov>summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:800 1.05rem var(--f-head)}.cov>summary::-webkit-details-marker{display:none}
.cov .bar{flex:1 1 160px;max-width:260px;height:10px;border-radius:99px;background:var(--bad-soft,#FDE2E1);overflow:hidden}.cov .bar i{display:block;height:100%;background:var(--good,#1E7F4F)}
.cov .opts{display:flex;gap:12px;align-items:center;margin:10px 0 4px;font-size:.9rem;color:var(--muted)}
.cov .urow{margin-top:12px}.cov .urow h3{margin:0 0 6px;font:800 .95rem var(--f-head)}.cov .urow h3 span{font:600 .85rem var(--f-body);color:var(--muted);margin-left:6px}
.cov .chips{display:flex;flex-wrap:wrap;gap:6px}
.wc{font:700 .9rem var(--f-body);padding:5px 10px;border-radius:999px;border:1.5px solid;display:inline-flex;gap:5px;align-items:center;background:none;cursor:default}
.wc.on{border-color:var(--good,#1E7F4F);color:var(--good,#1E7F4F);background:var(--good-soft,#E3F4EA);cursor:pointer}.wc.on:hover{filter:brightness(.95)}
.wc.off{border-color:#E8A3A0;color:var(--bad,#B8322A);border-style:dashed}
.wc small{font-weight:600;opacity:.8}
.player.wide{grid-template-columns:minmax(300px,1.4fr) 1fr}@media (max-width:820px){.player.wide{grid-template-columns:1fr}}
.spk{flex:none;font:800 .72rem var(--f-body);padding:2px 8px;border-radius:999px;color:#fff;align-self:center}.spk.sp1{background:#E11D48}.spk.sp2{background:#0284C7}
.ulab{font:700 .8rem var(--f-body);color:var(--muted);margin-left:8px;letter-spacing:.02em}
.lqb{background:#f0f9ff;border:1.5px solid #bae6fd;border-radius:12px;padding:8px 10px;margin-top:6px}
</style>
<script src="js/vendor/supabase.js"></script><script src="js/config.js?v=20261126b"></script><script src="js/icons.js?v=20261126b"></script><script src="js/app.js?v=20261126b"></script><script src="js/sets.js?v=20261126b"></script>
</head><body>
<div class="wrap" style="max-width:1180px">
  <div class="head2">
    <div><span class="eyebrow" id="setEyebrow">&nbsp;</span><h1>Songs, texts &amp; dialogs</h1>
      <p class="muted" style="margin:4px 0 0">Listen, sing along, read the text, then fill in the words yourself.</p></div>
    <div class="unitbar"><label class="muted" for="unit" style="font-weight:700">Unit</label><select id="unit"></select><label class="muted" for="kind" style="font-weight:700;margin-left:6px">Show</label><select id="kind"><option value="all">Everything</option><option value="song">Songs &amp; texts</option><option value="dialog">Dialogs</option></select></div>
  </div>
  <details class="card cov" id="cov" hidden open></details>
  <div id="out"></div>
</div>
<div id="pop" role="dialog" aria-label="Word"></div>
<script type="text/x-app">
const $=id=>document.getElementById(id), esc=App.esc, D=window.WORDS, SET=window.CURRENT_SET, C=App.client;
let TEXTS=[], SONGS=[], STATE={};
const unitsOf=x=>[x.unit,...(x.also_units||[])];
const inU=(x,u)=>u==="all"||unitsOf(x).includes(+u);
const isDlg=s=>s.kind==="dialog";
const named=new Map((SET.units||[]).map(u=>[Number(u.u),u.name||""]));
const uname=u=>u?(named.get(u)?`Unit ${u} · ${named.get(u)}`:`Unit ${u}`):(named.get(0)||"General");
const fmt=s=>s==null?"":`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

// ---------- vocabulary in a line ----------
function vocabFor(unit){const us=[].concat(unit);
  const L=D.map((v,i)=>({v,i})).filter(x=>us.includes(x.v.u)||(x.v.also||[]).some(u=>us.includes(u)));
  return (L.length?L:D.map((v,i)=>({v,i}))).filter(x=>/^[\p{L}' -]{3,}$/u.test(x.v.w)).sort((a,b)=>b.v.w.length-a.v.w.length);}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function vocabRegex(unit){const V=vocabFor(unit);if(!V.length)return null;
  return {re:new RegExp(`(?<![\\p{L}])(${V.map(x=>reEsc(x.v.w)).join("|")})(?![\\p{L}])`,"giu"),find:w=>V.find(x=>x.v.w.toLowerCase()===w.toLowerCase())};}
// Spelled-out letters: "R-U-S-T-L-E-D", "O-B", or "R U S T L E D"
const SPELL=/(?<![\p{L}])([A-Z](?:-[A-Z])+|[A-Z](?: [A-Z]){2,})(?![\p{L}])/gu;
// Syllable chunks: "Rus-tled", "Pre • car • i • ous"
const CHUNK=/(?<![\p{L}])(\p{L}+(?:(?:-| ?• ?)\p{L}+)+)(?![\p{L}])/gu;
const inline=h=>h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g,"$1<i>$2</i>");
// Turn one line into HTML. fill = replace vocabulary with typing gaps.
function lineHTML(text,unit,fill,key,gapCounter){
  const VR=vocabRegex(unit);let out="",last=0;const src=String(text);const tokens=[];
  const free=(off,len)=>!tokens.some(t=>off<t.off+t.len&&t.off<off+len);
  if(VR){src.replace(CHUNK,(m,g,off)=>{const parts=m.split(/-| ?• ?/);if(parts.every(s=>s.length===1))return m;const f=VR.find(parts.join(""));if(f)tokens.push({off,len:m.length,kind:"c",m,parts,word:f.v.w,idx:f.i});return m;});
    src.replace(VR.re,(m,w,off)=>{if(free(off,m.length))tokens.push({off,len:m.length,kind:"w",m,word:m,idx:VR.find(m)?.i});return m;});}
  src.replace(SPELL,(m,g,off)=>{if(free(off,m.length))tokens.push({off,len:m.length,kind:"s",m});return m;});
  tokens.sort((a,b)=>a.off-b.off);
  for(const t of tokens){out+=esc(src.slice(last,t.off));
    if(t.kind==="w"||t.kind==="c"){
      if(fill){const g=gapCounter.n++;const st=(STATE[key]||{})[g]||{};
        out+=`<input class="gap ${st.ok===true?"ok":st.ok===false?"no":""}" data-key="${key}" data-g="${g}" data-ans="${esc(t.word)}" value="${esc(st.v||"")}" size="${Math.max(4,t.word.length)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Missing word, ${t.word.length} letters">${st.ok===false?`<span class="fix">${esc(t.word)}</span>`:""}`;}
      else if(t.kind==="c")out+=`<mark class="vw chunks" tabindex="0" data-w="${t.idx}" aria-label="${esc(t.word)}, ${t.parts.length} syllables">${t.parts.map((s,k)=>`<span class="c${k%4}">${esc(s)}</span>`).join('<span class="dot">·</span>')}</mark>`;
      else out+=`<mark class="vw" tabindex="0" data-w="${t.idx}">${esc(t.m)}</mark>`;}
    else{const ls=t.m.split(/[- ]/);out+=`<span class="letters${fill?" hide":""}" aria-label="${fill?ls.length+" hidden letters":"spelled "+ls.join(" ")}">${ls.map(c=>`<b>${esc(c)}</b>`).join("")}</span>`;}
    last=t.off+t.len;}
  return inline(out+esc(src.slice(last)));}

// ---------- text (script, poem, reading) ----------
function textHTML(t,fill){const lines=t.body.split(/\r?\n/), roles=[];let html="",gc={n:0},inCast=false,script=false,table=null;
  const role=n=>{const k=n.replace(/\s*\(.*$/,"").trim();let i=roles.indexOf(k);if(i<0){roles.push(k);i=roles.length-1;}return i%4;};
  const L=s=>lineHTML(s,t.unit,fill,"t"+t.id,gc);
  const flushTable=()=>{if(!table)return;const [h,...rows]=table;
    html+=`<div class="tablewrap"><table class="guide"><thead><tr>${h.map(c=>`<th>${inline(esc(c))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${L(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;table=null;};
  for(let raw of lines){let l=raw.trim();
    if(l.startsWith("|")){const cells=l.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());if(cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;(table=table||[]).push(cells);continue;}
    flushTable();
    if(!l){if(inCast){html+="</div>";inCast=false;}continue;}
    if(/^-{3,}$/.test(l)||/^title\s*:/i.test(l)||/^#\s*title\s*:/i.test(l))continue;
    const plain=l.replace(/^#+\s*/,"").replace(/^\*\*(.*)\*\*$/,"$1").trim();
    if(/^(characters|singers|cast)\b.*:\s*$/i.test(plain)){inCast=true;script=true;html+=`<div class="muted" style="font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em">${esc(plain.replace(/:$/,""))}</div><div class="cast">`;continue;}
    if(inCast&&/^[*•-]\s+/.test(l)){const n=l.replace(/^[*•-]\s+/,"").replace(/\*\*/g,"");html+=`<span class="r${role(n)}">${icon("user",14)}${esc(n)}</span>`;continue;}
    if(inCast){html+="</div>";inCast=false;}
    let m;
    if((m=plain.match(/^part\s*(\d+)\s*[:.-]\s*(.*)$/i))){script=true;html+=`<h3>${icon("music",18)}Part ${esc(m[1])}${m[2]?" · "+esc(m[2]):""}</h3>`;continue;}
    if(/^#{2,}\s/.test(l)){html+=`<h3>${icon(script?"music":"lightbulb",18)}${inline(esc(plain))}</h3>`;continue;}
    if((m=plain.match(/^\((.+?)\)\s*:?\s*$/))&&/[:)]\s*$/.test(plain)&&/^\(/.test(plain)&&(plain.endsWith(":")||/ - |kid|chorus|everyone|singer/i.test(m[1]))){script=true;const [who,...act]=m[1].split(/\s+[-–—]\s+/);html+=`<div class="who"><span class="nm r${role(who)}">${esc(who)}</span>${act.length?`<i>${esc(act.join(" – "))}</i>`:""}</div>`;continue;}
    if((m=plain.match(/^\(([^)]+)\)$/))){html+=`<div class="ln"><i class="muted">${esc(m[1])}</i></div>`;continue;}
    html+=script?`<div class="ln">${L(l)}</div>`:`<p class="para">${L(l)}</p>`;}
  flushTable();if(inCast)html+="</div>";
  return `<div class="script">${html}</div>`;}

// ---------- song ----------
function songHTML(s,fill){LQ_SRC[s.id]=s;const L=Array.isArray(s.lines)?s.lines:[],gc={n:0};
  const isVideo=/\.(mp4|webm|mov)(\?|$)/i.test(s.media_url)||/video/.test(s.media_url);
  const media=s.media_url?(isVideo?`<video id="m_${s.id}" src="${esc(s.media_url)}" controls playsinline preload="metadata"></video>`:`<audio id="m_${s.id}" src="${esc(s.media_url)}" controls preload="metadata"></audio>`):`<p class="muted">No recording yet.</p>`;
  // An "Intro" line at 0:00 so the song can always be started from the very beginning (and the intro music lights up too)
  const intro=L.length&&L[0].t!=null&&+L[0].t>1?`<div class="ly intro" data-k="-1" data-t="0"><span class="tm">${fmt(0)}</span><span>${icon("music",15)} Intro</span></div>`:"";
  const lyr=L.length?intro+L.map((x,k)=>`<div class="ly${/^\(.*\)$/.test(x.l)?" stage":""}" data-k="${k}" ${x.t!=null?`data-t="${x.t}"`:""}><span class="tm">${fmt(x.t)}</span>${x.sp?`<span class="spk sp${x.sp}">Host ${x.sp}</span>`:""}<span>${lineHTML(x.l,unitsOf(s),fill,"s"+s.id,gc)}</span></div>`).join(""):`<p class="nolines">No ${isDlg(s)?"transcript":"lyrics"} added yet.</p>`;
  return `<div class="player${isDlg(s)&&isVideo?" wide":""}"><div class="vid">${media}
      <div class="row" style="gap:6px"><button class="btn small" type="button" data-start="${s.id}">${icon("rotate-ccw",14)}From the start</button><button class="btn small" type="button" data-rate="${s.id}" data-r="0.75">${icon("clock",14)}Slower</button><button class="btn small" type="button" data-rate="${s.id}" data-r="1">Normal speed</button></div>
      <p class="muted" style="margin:0;font-size:.86rem">Tap any line to jump to it. Highlighted words show their picture and meaning.</p>
      ${L.some(x=>x.t!=null&&x.e!=null)&&s.media_url?`<div class="row" style="gap:6px"><button class="btn small" type="button" data-listen="${s.id}">🎧 Listening check</button></div><div id="lq_${s.id}" class="lq"></div>`:""}</div>
    <div class="lyrics" id="ly_${s.id}" aria-label="${isDlg(s)?"Transcript":"Lyrics"}">${lyr}</div></div>`;}

// ---------- 🎧 Listening check: hear one line, pick the word you heard (5 questions, free) ----------
const LQ={};
function lqBuild(sid){const s=(window.SONGS||[]).find(x=>String(x.id)===String(sid))||LQ_SRC[sid];if(!s)return null;const VR=vocabRegex(unitsOf(s));if(!VR)return null;
  const cand=[];(s.lines||[]).forEach(x=>{if(x.t==null||x.e==null)return;const ms=[];String(x.l).replace(VR.re,(m,w)=>{const f=VR.find(m);if(f)ms.push(f);return m;});if(ms.length)cand.push({x,f:ms[Math.floor(Math.random()*ms.length)]});});
  if(!cand.length)return null;const pool=[...new Set(D.filter(v=>v&&v.w).map(v=>v.w))];
  const qs=cand.sort(()=>Math.random()-.5).slice(0,5).map(c=>{const right=c.f.v.w,others=pool.filter(w=>w!==right).sort(()=>Math.random()-.5).slice(0,3);return {t:+c.x.t,e:+c.x.e,line:c.x.l,right,opts:[right,...others].sort(()=>Math.random()-.5)};});
  return {sid,qs,n:0,ok:0,fb:null};}
const LQ_SRC={};
function lqDraw(sid){const st=LQ[sid],box=$("lq_"+sid);if(!box||!st)return;
  if(st.n>=st.qs.length){box.innerHTML=`<div class="lqb"><b>${st.ok===st.qs.length?"🌟":"👍"} ${st.ok} / ${st.qs.length} right!</b> <button class="btn small" type="button" data-listen="${sid}">🔁 Again</button></div>`;return;}
  const q=st.qs[st.n];box.innerHTML=`<div class="lqb"><b>🎧 ${st.n+1}/${st.qs.length}: Which word did you hear?</b> <button class="btn small" type="button" data-lplay="${sid}">▶ Play the line</button>
    <div class="row" style="gap:6px;margin-top:6px">${st.fb?"":q.opts.map(o=>`<button class="btn small ghost" type="button" data-lans="${sid}|${esc(o)}">${esc(String(o).replace(/\s*\(.*\)$/,""))}</button>`).join("")}</div>
    ${st.fb?`<p style="margin:6px 0">${st.fb.ok?"✅ Yes!":"❌ It was <b>"+esc(q.right)+"</b>."} <i>“${esc(q.line)}”</i></p><button class="btn small" type="button" data-lnext="${sid}">Next ▶</button>`:""}</div>`;}
function lqPlay(sid){const st=LQ[sid],q=st&&st.qs[st.n],m=$("m_"+sid);if(!q||!m)return;m.currentTime=Math.max(0,q.t-0.2);m.play().catch(()=>{});
  const stop=()=>{if(m.currentTime>=q.e+0.2){m.pause();m.removeEventListener("timeupdate",stop);}};m.addEventListener("timeupdate",stop);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-listen],[data-lplay],[data-lans],[data-lnext]");if(!b)return;
  if(b.dataset.listen){const st=lqBuild(b.dataset.listen);if(!st){App.status("This one has no unit words to listen for.",false);return;}LQ[b.dataset.listen]=st;lqDraw(st.sid);lqPlay(st.sid);return;}
  if(b.dataset.lplay){lqPlay(b.dataset.lplay);return;}
  if(b.dataset.lans){const [sid,a]=b.dataset.lans.split("|"),st=LQ[sid],q=st.qs[st.n],ok=a===q.right;st.fb={ok};if(ok)st.ok++;lqDraw(sid);return;}
  if(b.dataset.lnext){const st=LQ[b.dataset.lnext];st.n++;st.fb=null;lqDraw(st.sid);if(st.n<st.qs.length)lqPlay(st.sid);}});

// ---------- page ----------
function packHTML(group){const t=group.text, songs=group.songs, id=group.id, sel=group.sel||(songs[0]?"s"+songs[0].id:"t"+t?.id), mode=group.mode||"read";
  const tabs=[...(t?[["t"+t.id,"file-text",t.title.length>34?"Text":"Read the text"]]:[]),...songs.map(s=>["s"+s.id,isDlg(s)?"users":"music",s.title])];
  const cur=sel.startsWith("t")?t:songs.find(s=>"s"+s.id===sel);
  const st=STATE[sel+"_score"];
  return `<section class="pack" data-pack="${id}"><header><h2>${icon(t?"book-open":group.dialog?"users":"music",22)}${esc(t?t.title:group.dialog?"Dialogs":"Songs")}${group.ulabel?`<span class="ulab">${esc(group.ulabel)}</span>`:""}</h2></header>
    <div class="tabsx" role="tablist">${tabs.map(([k,ic,lab])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${k===sel}">${icon(ic,15)}${esc(lab)}</button>`).join("")}</div>
    <div class="pane"><div class="modebar"><div class="seg" role="group" aria-label="Mode">
        <button type="button" data-mode="read" aria-pressed="${mode==="read"}">${icon("eye",15)}${group.dialog?"Read &amp; listen":"Read &amp; sing"}</button>
        <button type="button" data-mode="fill" aria-pressed="${mode==="fill"}">${icon("pencil",15)}Fill in the words</button></div>
      ${mode==="fill"?`<button class="btn small primary" type="button" data-checkall="${sel}">${icon("check",14)}Check my words</button><button class="btn small" type="button" data-clear="${sel}">${icon("rotate-ccw",14)}Start again</button>${st?`<span class="res ${st.r===st.n?"ok":"no"}">${st.r} of ${st.n} correct</span>`:""}`
        :`<span class="muted" style="font-size:.88rem">${cur&&sel.startsWith("s")?"Press play and follow the glowing line.":"Tap a highlighted word to see and hear it."}</span>`}</div>
      ${cur?(sel.startsWith("t")?textHTML(cur,mode==="fill"):songHTML(cur,mode==="fill")):""}</div></section>`;}
let GROUPS=[];
let UNITS=[], COV=null, COV_MISS=false;
// ---------- word check: which words of the unit appear in its songs/dialogs, and which are missing ----------
function covHas(c,K){return (c.sources||[]).some(x=>K==="all"||x.kind===K);}
function drawCov(){const box=$("cov");if(!COV){box.hidden=true;return;}
  const uv=$("unit").value,K=$("kind").value,U=uv==="all"?[...new Set(COV.flatMap(c=>[c.unit,...(c.also_units||[])]))].sort((x,y)=>(x===0)-(y===0)||x-y):[+uv];
  const what=K==="dialog"?"dialogs":K==="song"?"songs":"songs & dialogs";
  let tot=0,on=0;
  const rows=U.map(u=>{const W=COV.filter(c=>[c.unit,...(c.also_units||[])].includes(u)).sort((a,b)=>a.position-b.position);if(!W.length)return "";
    const k=W.filter(c=>covHas(c,K)).length;tot+=W.length;on+=k;
    const chips=W.filter(c=>!COV_MISS||!covHas(c,K)).map(c=>{const src=(c.sources||[]).filter(x=>K==="all"||x.kind===K);
      return src.length?`<button type="button" class="wc on" data-song="${src[0].song_id}" data-t="${src[0].t??0}" title="${esc(src.map(x=>(x.kind==="dialog"?"Dialog: ":"Song: ")+x.title+" ("+x.mentions+"×)").join("\n"))}">✓ ${esc(c.term)} <small>${src.some(x=>x.kind==="song")?"🎵":""}${src.some(x=>x.kind==="dialog")?"💬":""}</small></button>`
        :`<span class="wc off" title="Not in any ${what} yet">✗ ${esc(c.term)}</span>`;}).join("");
    return `<div class="urow"><h3>${esc(uname(u))}<span>${k} of ${W.length} showing · ${W.length-k} missing</span></h3><div class="chips">${chips||'<span class="muted">Nothing missing 🎉</span>'}</div></div>`;}).join("");
  box.hidden=false;
  box.innerHTML=`<summary>${icon("list-checks",18)} Word check: ${on} of ${tot} words appear in ${what}<span class="bar"><i style="width:${tot?Math.round(on/tot*100):0}%"></i></span></summary>
    <div class="opts"><label><input type="checkbox" id="covMiss" ${COV_MISS?"checked":""}> Show only missing words</label><span>Tap a green word to hear it in the song or dialog.</span></div>${rows}`;
  $("covMiss").onchange=e=>{COV_MISS=e.target.checked;drawCov();};}
function jumpTo(songId,t){let g=GROUPS.find(g=>g.songs.some(s=>s.id===songId));
  if(!g){const s=SONGS.find(x=>x.id===songId);if(!s)return;$("unit").value=String(s.unit);$("kind").value="all";build();g=GROUPS.find(g=>g.songs.some(x=>x.id===songId));if(!g)return;}
  g.sel="s"+songId;g.mode="read";redrawPack(g);const el=$("out").querySelector(`[data-pack="${g.id}"]`);el.scrollIntoView({behavior:"smooth",block:"start"});
  const m=$("m_"+songId);if(m){const go=()=>{m.currentTime=Math.max(0,+t-0.5);m.play().catch(()=>{});};m.readyState>0?go():m.addEventListener("loadedmetadata",go,{once:true});}}
function build(){const uv=$("unit").value, K=$("kind").value, all=uv==="all", U=all?UNITS:[+uv];GROUPS=[];
  if(K!=="dialog")U.forEach(u=>{
    const ts=TEXTS.filter(t=>t.unit===u).sort((a,b)=>a.position-b.position);
    ts.forEach(t=>GROUPS.push({id:"g"+t.id,text:t,ulabel:all?uname(u):"",songs:SONGS.filter(s=>s.text_id===t.id&&!isDlg(s)).sort((a,b)=>a.position-b.position)}));
    const loose=SONGS.filter(s=>!isDlg(s)&&s.unit===u&&!ts.some(t=>t.id===s.text_id));
    if(loose.length)GROUPS.push({id:"gloose"+u,text:null,ulabel:all?uname(u):"",songs:loose.sort((a,b)=>a.position-b.position)});});
  if(K!=="song"){const dl=SONGS.filter(s=>isDlg(s)&&inU(s,uv)).sort((a,b)=>(!all&&(b.unit===+uv)-(a.unit===+uv))||a.position-b.position||a.unit-b.unit);
    if(dl.length)GROUPS.push({id:"gdlg"+uv,text:null,dialog:true,ulabel:dl.map(s=>unitsOf(s)).flat().length?"Units "+[...new Set(dl.map(unitsOf).flat())].sort((a,b)=>a-b).join(", "):"",songs:dl});}
  drawCov();
  try{const q=new URLSearchParams(location.search);q.set("unit",uv);q.set("kind",K);history.replaceState(null,"","?"+q);}catch(e){}
  draw();}
function draw(){$("out").innerHTML=GROUPS.length?`<div style="display:flex;flex-direction:column;gap:18px">${GROUPS.map(packHTML).join("")}</div>`:`<div class="card empty-s">Nothing here for this unit yet${$("kind").value==="dialog"?" (no dialogs)":""}.</div>`;wireMedia();}
function redrawPack(g){const el=$("out").querySelector(`[data-pack="${g.id}"]`);const w=document.createElement("div");w.innerHTML=packHTML(g);el.replaceWith(w.firstElementChild);wireMedia();}
// karaoke: highlight the current line
function wireMedia(){document.querySelectorAll("#out video, #out audio").forEach(m=>{if(m.dataset.wired)return;m.dataset.wired=1;
  const id=m.id.slice(2), box=$("ly_"+id);if(!box)return;const rows=[...box.querySelectorAll(".ly[data-t]")];let curK=-1;
  m.addEventListener("timeupdate",()=>{const t=m.currentTime;let k=-1;rows.forEach((r,j)=>{if(+r.dataset.t<=t+0.05)k=j;});
    if(k===curK)return;curK=k;rows.forEach((r,j)=>{r.classList.toggle("now",j===k);r.classList.toggle("past",j<k);});
    if(k>=0&&!box.contains(document.activeElement)){const r=rows[k];box.scrollTop=r.offsetTop-box.offsetTop-box.clientHeight*0.3;}});});}
// ---------- events ----------
const groupOf=el=>GROUPS.find(g=>g.id===el.closest("[data-pack]")?.dataset.pack);
const norm=s=>String(s).trim().toLowerCase().replace(/[’']/g,"'");
$("out").addEventListener("click",e=>{
  const w=e.target.closest("mark.vw");if(w){showPop(+w.dataset.w,w);return;}
  const b=e.target.closest("button");
  if(b&&b.dataset.start){const m=$("m_"+b.dataset.start);if(m){m.currentTime=0;m.play().catch(()=>{});}return;}const ly=e.target.closest(".ly[data-t]");
  if(ly&&!e.target.closest("input")){const box=ly.closest(".lyrics"),m=$("m_"+box.id.slice(3));if(m){m.currentTime=+ly.dataset.t;m.play().catch(()=>{});}return;}
  if(!b)return;const g=groupOf(b);
  if(b.dataset.tab){g.sel=b.dataset.tab;redrawPack(g);}
  else if(b.dataset.mode){g.mode=b.dataset.mode;redrawPack(g);}
  else if(b.dataset.rate){const m=$("m_"+b.dataset.rate);if(m)m.playbackRate=+b.dataset.r;}
  else if(b.dataset.clear){const k=b.dataset.clear;delete STATE[k];delete STATE[k+"_score"];redrawPack(g);}
  else if(b.dataset.checkall){const k=b.dataset.checkall,inputs=[...b.closest(".pack").querySelectorAll("input.gap")];
    const S=STATE[k]=STATE[k]||{};inputs.forEach(i=>{S[i.dataset.g]={v:i.value,ok:norm(i.value)===norm(i.dataset.ans)};});
    const n=inputs.length,r=inputs.filter(i=>S[i.dataset.g].ok).length;STATE[k+"_score"]={r,n};redrawPack(g);
    if(n){const item=k.startsWith("t")?TEXTS.find(t=>"t"+t.id===k):SONGS.find(s=>"s"+s.id===k);
      App.saveAttempt({activity:"song-fill",detail:item?item.title.slice(0,80):"",units:[item?item.unit:+$("unit").value],score:r,total:n,
        answers:inputs.map(i=>({word:i.dataset.ans,unit:item?item.unit:0,given:S[i.dataset.g].v,correct:S[i.dataset.g].ok}))})
        .then(x=>{if(x.error)App.status("Result not saved: "+x.error.message,false);else if(x.id)App.status(`Result saved: ${r} of ${n}`,true);});}}});
$("out").addEventListener("input",e=>{const i=e.target;if(!i.classList.contains("gap"))return;const k=i.dataset.key.replace(/^([ts])/,"$1");
  const key=i.dataset.key, S=STATE[key]=STATE[key]||{};S[i.dataset.g]={v:i.value};i.classList.remove("ok","no");});
$("out").addEventListener("keydown",e=>{const i=e.target;
  if(i.classList.contains("gap")&&e.key==="Enter"){e.preventDefault();const S=STATE[i.dataset.key]=STATE[i.dataset.key]||{};const ok=norm(i.value)===norm(i.dataset.ans);S[i.dataset.g]={v:i.value,ok};
    i.classList.toggle("ok",ok);i.classList.toggle("no",!ok);const all=[...i.closest(".pack").querySelectorAll("input.gap")];const nx=all[all.indexOf(i)+1];if(nx)nx.focus();}
  if(e.target.matches("mark.vw")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();showPop(+e.target.dataset.w,e.target);}});
// ---------- word pop-up ----------
const AU={};
function hear(i){const v=D[i];if(v.au&&v.au!=="tts"){try{const a=AU[i]||(AU[i]=new Audio(v.au));a.currentTime=0;a.play();return;}catch(e){}}Sets.speak(v.w);}
function showPop(i,anchor){const v=D[i];if(!v)return;const p=$("pop");
  p.innerHTML=`${v.vid?`<video id="popClip" src="${esc(v.vid)}" autoplay muted loop playsinline style="width:100%;height:170px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--rule);cursor:pointer" title="Tap for sound"></video><button class="btn small" type="button" id="popClipSound" style="align-self:flex-start">${icon("volume-2",14)}Watch and hear the word</button>`:`<img src="${esc(v.img)}" alt="">`}<div class="t"><span>${esc(v.w)}</span><button class="round" type="button" id="popHear" aria-label="Hear ${esc(v.w)}">${icon("volume-2",18)}</button></div>${(v.syl||"").includes("-")?`<div class="psyl" aria-label="Syllables">${v.syl.split("-").map((x,j)=>`<span class="c${j%4}">${esc(j?x:x.charAt(0).toUpperCase()+x.slice(1))}</span>`).join('<span class="pdot">·</span>')}<span class="pcount">${v.syl.split("-").length} syllables</span></div>`:""}
    ${v.pron?`<div class="muted" style="font-size:.9rem">Say it: <b>${esc(v.pron.replace(/-/g,"·"))}</b></div>`:""}<div>${esc(v.d)}</div>${v.ar?`<div class="tr" dir="auto">${esc(v.ar)}</div>`:""}
    <a class="btn small" href="list.html?set=${SET.id}" style="align-self:flex-start">${icon("list-checks",14)}Open in word list</a>`;
  p.classList.add("on");const r=anchor.getBoundingClientRect(),pw=Math.min(300,innerWidth-24);
  p.style.left=Math.max(12,Math.min(r.left,innerWidth-pw-12))+"px";const below=r.bottom+8,h=p.offsetHeight;p.style.top=(below+h<innerHeight?below:Math.max(12,r.top-h-8))+"px";
  $("popHear").onclick=()=>hear(i);if($("popClipSound")){const go=()=>Sets.playClip($("popClip"),v);$("popClipSound").onclick=go;$("popClip").onclick=go;}else hear(i);$("popHear").focus({preventScroll:true});POPAT=scrollY;}
document.addEventListener("click",e=>{if(!e.target.closest("#pop,mark.vw"))$("pop").classList.remove("on");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("pop").classList.remove("on");});
let POPAT=0;window.addEventListener("scroll",()=>{if(Math.abs(scrollY-POPAT)>40)$("pop").classList.remove("on");},{passive:true});
// ---------- load ----------
(async()=>{const [a,b]=await Promise.all([C.from("set_texts").select("*").eq("set_id",SET.id).order("position",{ascending:true}),C.from("set_songs").select("*").eq("set_id",SET.id).order("position",{ascending:true})]);
  TEXTS=a.data||[];SONGS=b.data||[];
  const units=UNITS=[...new Set([...TEXTS.map(t=>t.unit),...SONGS.map(unitsOf).flat()])].sort((x,y)=>(x===0)-(y===0)||x-y);
  if(!units.length){$("unit").closest(".unitbar").hidden=true;$("out").innerHTML=`<div class="card empty-s"><b>No songs or texts in this set yet.</b><br><span class="muted">Teachers can add them in the set editor.</span></div>`;return;}
  const qs=new URLSearchParams(location.search), wantRaw=qs.get("unit"), want=wantRaw==="all"?"all":+wantRaw;
  const cnt=u=>TEXTS.filter(t=>t.unit===u).length+SONGS.filter(s=>unitsOf(s).includes(u)).length;
  window.unitOptions=(extra=[])=>{const cur=$("unit").value||String(want);const all=[...new Set([...units,...extra])].sort((x,y)=>(x===0)-(y===0)||x-y);
    $("unit").innerHTML=`<option value="all">All units · ${TEXTS.length+SONGS.length} items</option>`+all.map(u=>`<option value="${u}">${esc(uname(u))} · ${cnt(u)?cnt(u)+" items":"no songs yet"}${SONGS.some(s=>isDlg(s)&&unitsOf(s).includes(u))?" · 💬 dialog":""}</option>`).join("");
    const pick=[window.UNIT_WANT,cur].find(v=>v!=null&&[...$("unit").options].some(o=>o.value===String(v)));if(pick!=null){$("unit").value=String(pick);if(String(pick)===String(window.UNIT_WANT))window.UNIT_WANT=null;}};
  window.UNIT_WANT=wantRaw;
  unitOptions();
  if(!wantRaw&&units.length)$("unit").value=String(units[0]);
  const hasDlg=SONGS.some(isDlg);$("kind").hidden=$("kind").previousElementSibling.hidden=!hasDlg;
  if(hasDlg&&["all","song","dialog"].includes(qs.get("kind")))$("kind").value=qs.get("kind");
  $("unit").onchange=build;$("kind").onchange=build;build();
  $("cov").addEventListener("click",e=>{const b=e.target.closest(".wc.on");if(b)jumpTo(b.dataset.song,b.dataset.t);});
  const cv=await C.from("word_coverage").select("item_id,term,unit,also_units,position,songs,dialogs,sources,status").eq("set_id",SET.id);
  if(!cv.error&&cv.data&&cv.data.length){COV=cv.data;const before=$("unit").value;unitOptions(COV.flatMap(c=>[c.unit,...(c.also_units||[])]));if($("unit").value!==before)build();else drawCov();}})();
</script>
<script>Sets.boot({min:0})</script>
