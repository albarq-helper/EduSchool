<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Songs &amp; texts · Helper Academy</title><link rel="icon" href="assets/icons/brilliant.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@600&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
.unitbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pack{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.pack>header{padding:16px 18px 0;display:flex;flex-direction:column;gap:10px}
.pack h2{margin:0;font:800 1.35rem var(--f-display);display:flex;gap:10px;align-items:center}
.tabsx{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:0 18px}
.tabsx button{border:0;background:none;font:700 .92rem var(--f-body);color:var(--muted);padding:10px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabsx button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.modebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font:700 .88rem var(--f-body);color:var(--muted);padding:8px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent);border-radius:11px}
/* text */
.script{display:flex;flex-direction:column;gap:6px;font-size:1.06rem;line-height:1.55;max-width:760px}
.script h3{font:800 1.08rem var(--f-display);margin:14px 0 2px;color:var(--accent);display:flex;gap:8px;align-items:center}
.script .who{margin-top:8px;font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.script .who .nm{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.84rem}
.script .who i{font-weight:400;color:var(--muted);font-size:.9rem}
.script .ln{padding-left:14px;border-left:3px solid var(--rule)}
.cast{display:flex;gap:8px;flex-wrap:wrap}
.cast span{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:.88rem}
.r0{background:var(--sky-soft);color:var(--accent)}.r1{background:var(--coral-soft);color:var(--coral)}.r2{background:var(--teal-soft);color:var(--teal)}.r3{background:var(--sun-soft);color:#8A6100}
/* words */
mark.vw{background:var(--sun-soft);color:inherit;border-radius:6px;padding:0 3px;font-weight:700;cursor:pointer;border-bottom:2px solid var(--sun)}
mark.vw:hover,mark.vw:focus{outline:2px solid var(--accent);outline-offset:1px}
.letters{display:inline-flex;gap:2px;vertical-align:middle;flex-wrap:wrap}
.letters b{display:inline-grid;place-items:center;min-width:1.35em;height:1.5em;padding:0 2px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font:800 .86em var(--f-display)}
.letters.hide b{background:var(--paper);color:transparent;border:1px dashed var(--rule)}
input.gap{font:700 1em var(--f-body);padding:1px 6px;border:none;border-bottom:2.5px solid var(--accent);border-radius:6px 6px 0 0;background:var(--accent-soft);color:var(--ink);text-align:center;min-width:3.5em}
input.gap.ok{border-color:var(--good);background:var(--good-soft)}input.gap.no{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:.82em;color:var(--bad);font-weight:700;margin-left:2px}
/* song */
.player{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:18px;align-items:start}
@media (max-width:820px){.player{grid-template-columns:1fr}}
.vid{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px}
.vid video,.vid audio{width:100%;border-radius:16px;background:#000}
.vid audio{background:none}
.lyrics{display:flex;flex-direction:column;gap:2px;max-height:68vh;overflow:auto;padding:4px 4px 40vh;scroll-behavior:smooth;border-radius:12px}
.ly{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;font-size:1.06rem;line-height:1.45;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.ly .tm{font:600 .74rem var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);min-width:2.6rem}
.ly:hover{background:var(--paper)}
.ly.past{color:var(--ink)}
.ly.now{background:var(--accent-soft);color:var(--ink);font-weight:700;transform:scale(1.01)}
.ly.now .tm{color:var(--accent)}
.ly.stage{font-style:italic}
.nolines{color:var(--muted)}
.res{font-weight:700}.res.ok{color:var(--good)}.res.no{color:var(--bad)}
/* word pop-up */
#pop{position:fixed;z-index:50;max-width:300px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px;display:none;flex-direction:column;gap:8px}
#pop.on{display:flex}
#pop img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--rule)}
#pop .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font:800 1.2rem var(--f-display)}
#pop .tr{font-family:var(--f-ar);font-size:1.1rem}
.empty-s{padding:40px 20px;text-align:center}
</style>
<script src="js/vendor/supabase.js"></script><script src="js/config.js"></script><script src="js/icons.js"></script><script src="js/app.js"></script><script src="js/sets.js"></script>
</head><body>
<div class="wrap" style="max-width:1180px">
  <div class="head2">
    <div><span class="eyebrow" id="setEyebrow">&nbsp;</span><h1>Songs &amp; texts</h1>
      <p class="muted" style="margin:4px 0 0">Listen, sing along, read the text, then fill in the words yourself.</p></div>
    <div class="unitbar"><label class="muted" for="unit" style="font-weight:700">Unit</label><select id="unit"></select></div>
  </div>
  <div id="out"></div>
</div>
<div id="pop" role="dialog" aria-label="Word"></div>
<script type="text/x-app">
const $=id=>document.getElementById(id), esc=App.esc, D=window.WORDS, SET=window.CURRENT_SET, C=App.client;
let TEXTS=[], SONGS=[], STATE={};
const named=new Map((SET.units||[]).map(u=>[Number(u.u),u.name||""]));
const uname=u=>u?(named.get(u)?`Unit ${u} · ${named.get(u)}`:`Unit ${u}`):(named.get(0)||"General");
const fmt=s=>s==null?"":`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

// ---------- vocabulary in a line ----------
function vocabFor(unit){
  const L=D.map((v,i)=>({v,i})).filter(x=>x.v.u===unit||(x.v.also||[]).includes(unit));
  return (L.length?L:D.map((v,i)=>({v,i}))).filter(x=>/^[\p{L}' -]{3,}$/u.test(x.v.w)).sort((a,b)=>b.v.w.length-a.v.w.length);}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function vocabRegex(unit){const V=vocabFor(unit);if(!V.length)return null;
  return {re:new RegExp(`(?<![\\p{L}])(${V.map(x=>reEsc(x.v.w)).join("|")})(?![\\p{L}])`,"giu"),find:w=>V.find(x=>x.v.w.toLowerCase()===w.toLowerCase())};}
// Spelled-out letters: "R-U-S-T-L-E-D" or "R U S T L E D"
const SPELL=/\b([A-Z](?:[- ][A-Z]){2,})\b/g;
// Turn one line into HTML. fill = replace vocabulary with typing gaps.
function lineHTML(text,unit,fill,key,gapCounter){
  const VR=vocabRegex(unit);let out="",last=0;const src=String(text);
  const tokens=[];
  if(VR){src.replace(VR.re,(m,w,off)=>{tokens.push({off,len:m.length,kind:"w",m,idx:VR.find(m)?.i});return m;});}
  src.replace(SPELL,(m,g,off)=>{if(!tokens.some(t=>off<t.off+t.len&&t.off<off+m.length))tokens.push({off,len:m.length,kind:"s",m});return m;});
  tokens.sort((a,b)=>a.off-b.off);
  for(const t of tokens){out+=esc(src.slice(last,t.off));
    if(t.kind==="w"){
      if(fill){const g=gapCounter.n++;const st=(STATE[key]||{})[g]||{};
        out+=`<input class="gap ${st.ok===true?"ok":st.ok===false?"no":""}" data-key="${key}" data-g="${g}" data-ans="${esc(t.m)}" value="${esc(st.v||"")}" size="${Math.max(4,t.m.length)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Missing word, ${t.m.length} letters">${st.ok===false?`<span class="fix">${esc(t.m)}</span>`:""}`;}
      else out+=`<mark class="vw" tabindex="0" data-w="${t.idx}">${esc(t.m)}</mark>`;}
    else{const ls=t.m.split(/[- ]/);out+=`<span class="letters${fill?" hide":""}" aria-label="${fill?ls.length+" hidden letters":"spelled "+ls.join(" ")}">${ls.map(c=>`<b>${esc(c)}</b>`).join("")}</span>`;}
    last=t.off+t.len;}
  return out+esc(src.slice(last));}

// ---------- text (script) ----------
function textHTML(t,fill){const lines=t.body.split(/\r?\n/), roles=[];let html="",gc={n:0},inCast=false;
  const role=n=>{const k=n.replace(/\s*\(.*$/,"").trim();let i=roles.indexOf(k);if(i<0){roles.push(k);i=roles.length-1;}return i%4;};
  for(let raw of lines){const l=raw.trim();if(!l){if(inCast){html+="</div>";inCast=false;}continue;}
    if(/^title\s*:/i.test(l))continue;
    if(/^(characters|singers|cast)\b.*:\s*$/i.test(l)){inCast=true;html+=`<div class="muted" style="font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em">${esc(l.replace(/:$/,""))}</div><div class="cast">`;continue;}
    if(inCast&&/^[*•-]\s+/.test(l)){const n=l.replace(/^[*•-]\s+/,"");html+=`<span class="r${role(n)}">${icon("user",14)}${esc(n)}</span>`;continue;}
    if(inCast){html+="</div>";inCast=false;}
    let m;
    if((m=l.match(/^part\s*(\d+)\s*[:.-]\s*(.*)$/i))){html+=`<h3>${icon("music",18)}Part ${esc(m[1])}${m[2]?" · "+esc(m[2]):""}</h3>`;continue;}
    if((m=l.match(/^\((.+?)\)\s*:?\s*$/))){const [who,...act]=m[1].split(/\s+[-–—]\s+/);html+=`<div class="who"><span class="nm r${role(who)}">${esc(who)}</span>${act.length?`<i>${esc(act.join(" – "))}</i>`:""}</div>`;continue;}
    if((m=l.match(/^\(([^)]+)\)$/))){html+=`<div class="ln"><i class="muted">${esc(m[1])}</i></div>`;continue;}
    html+=`<div class="ln">${lineHTML(l,t.unit,fill,"t"+t.id,gc)}</div>`;}
  if(inCast)html+="</div>";
  return `<div class="script">${html}</div>`;}

// ---------- song ----------
function songHTML(s,fill){const L=Array.isArray(s.lines)?s.lines:[],gc={n:0};
  const isVideo=/\.(mp4|webm|mov)(\?|$)/i.test(s.media_url)||/video/.test(s.media_url);
  const media=s.media_url?(isVideo?`<video id="m_${s.id}" src="${esc(s.media_url)}" controls playsinline preload="metadata"></video>`:`<audio id="m_${s.id}" src="${esc(s.media_url)}" controls preload="metadata"></audio>`):`<p class="muted">No recording yet.</p>`;
  const lyr=L.length?L.map((x,k)=>`<div class="ly${/^\(.*\)$/.test(x.l)?" stage":""}" data-k="${k}" ${x.t!=null?`data-t="${x.t}"`:""}><span class="tm">${fmt(x.t)}</span><span>${lineHTML(x.l,s.unit,fill,"s"+s.id,gc)}</span></div>`).join(""):`<p class="nolines">No lyrics added yet.</p>`;
  return `<div class="player"><div class="vid">${media}
      <div class="row" style="gap:6px"><button class="btn small" type="button" data-rate="${s.id}" data-r="0.75">${icon("clock",14)}Slower</button><button class="btn small" type="button" data-rate="${s.id}" data-r="1">Normal speed</button></div>
      <p class="muted" style="margin:0;font-size:.86rem">Tap any line to jump to it. Highlighted words show their picture and meaning.</p></div>
    <div class="lyrics" id="ly_${s.id}" aria-label="Lyrics">${lyr}</div></div>`;}

// ---------- page ----------
function packHTML(group){const t=group.text, songs=group.songs, id=group.id, sel=group.sel||(songs[0]?"s"+songs[0].id:"t"+t?.id), mode=group.mode||"read";
  const tabs=[...(t?[["t"+t.id,"file-text",t.title.length>34?"Text":"Read the text"]]:[]),...songs.map(s=>["s"+s.id,"music",s.title])];
  const cur=sel.startsWith("t")?t:songs.find(s=>"s"+s.id===sel);
  const st=STATE[sel+"_score"];
  return `<section class="pack" data-pack="${id}"><header><h2>${icon(t?"book-open":"music",22)}${esc(t?t.title:"Songs")}</h2></header>
    <div class="tabsx" role="tablist">${tabs.map(([k,ic,lab])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${k===sel}">${icon(ic,15)}${esc(lab)}</button>`).join("")}</div>
    <div class="pane"><div class="modebar"><div class="seg" role="group" aria-label="Mode">
        <button type="button" data-mode="read" aria-pressed="${mode==="read"}">${icon("eye",15)}Read &amp; sing</button>
        <button type="button" data-mode="fill" aria-pressed="${mode==="fill"}">${icon("pencil",15)}Fill in the words</button></div>
      ${mode==="fill"?`<button class="btn small primary" type="button" data-checkall="${sel}">${icon("check",14)}Check my words</button><button class="btn small" type="button" data-clear="${sel}">${icon("rotate-ccw",14)}Start again</button>${st?`<span class="res ${st.r===st.n?"ok":"no"}">${st.r} of ${st.n} correct</span>`:""}`
        :`<span class="muted" style="font-size:.88rem">${cur&&sel.startsWith("s")?"Press play and follow the glowing line.":"Tap a highlighted word to see and hear it."}</span>`}</div>
      ${cur?(sel.startsWith("t")?textHTML(cur,mode==="fill"):songHTML(cur,mode==="fill")):""}</div></section>`;}
let GROUPS=[];
function build(){const u=+$("unit").value;
  const ts=TEXTS.filter(t=>t.unit===u).sort((a,b)=>a.position-b.position);
  GROUPS=ts.map(t=>({id:"g"+t.id,text:t,songs:SONGS.filter(s=>s.text_id===t.id).sort((a,b)=>a.position-b.position)}));
  const loose=SONGS.filter(s=>s.unit===u&&!ts.some(t=>t.id===s.text_id));
  if(loose.length)GROUPS.push({id:"gloose"+u,text:null,songs:loose.sort((a,b)=>a.position-b.position)});
  draw();}
function draw(){$("out").innerHTML=GROUPS.length?`<div style="display:flex;flex-direction:column;gap:18px">${GROUPS.map(packHTML).join("")}</div>`:`<div class="card empty-s">No songs or texts for this unit yet.</div>`;wireMedia();}
function redrawPack(g){const el=$("out").querySelector(`[data-pack="${g.id}"]`);const w=document.createElement("div");w.innerHTML=packHTML(g);el.replaceWith(w.firstElementChild);wireMedia();}
// karaoke: highlight the current line
function wireMedia(){document.querySelectorAll("#out video, #out audio").forEach(m=>{if(m.dataset.wired)return;m.dataset.wired=1;
  const id=m.id.slice(2), box=$("ly_"+id);if(!box)return;const rows=[...box.querySelectorAll(".ly[data-t]")];let curK=-1;
  m.addEventListener("timeupdate",()=>{const t=m.currentTime;let k=-1;rows.forEach((r,j)=>{if(+r.dataset.t<=t+0.05)k=j;});
    if(k===curK)return;curK=k;rows.forEach((r,j)=>{r.classList.toggle("now",j===k);r.classList.toggle("past",j<k);});
    if(k>=0&&!box.contains(document.activeElement)){const r=rows[k];box.scrollTop=r.offsetTop-box.offsetTop-box.clientHeight*0.3;}});});}
// ---------- events ----------
const groupOf=el=>GROUPS.find(g=>g.id===el.closest("[data-pack]")?.dataset.pack);
const norm=s=>String(s).trim().toLowerCase().replace(/[’']/g,"'");
$("out").addEventListener("click",e=>{
  const w=e.target.closest("mark.vw");if(w){showPop(+w.dataset.w,w);return;}
  const b=e.target.closest("button");const ly=e.target.closest(".ly[data-t]");
  if(ly&&!e.target.closest("input")){const box=ly.closest(".lyrics"),m=$("m_"+box.id.slice(3));if(m){m.currentTime=+ly.dataset.t;m.play().catch(()=>{});}return;}
  if(!b)return;const g=groupOf(b);
  if(b.dataset.tab){g.sel=b.dataset.tab;redrawPack(g);}
  else if(b.dataset.mode){g.mode=b.dataset.mode;redrawPack(g);}
  else if(b.dataset.rate){const m=$("m_"+b.dataset.rate);if(m)m.playbackRate=+b.dataset.r;}
  else if(b.dataset.clear){const k=b.dataset.clear;delete STATE[k];delete STATE[k+"_score"];redrawPack(g);}
  else if(b.dataset.checkall){const k=b.dataset.checkall,inputs=[...b.closest(".pack").querySelectorAll("input.gap")];
    const S=STATE[k]=STATE[k]||{};inputs.forEach(i=>{S[i.dataset.g]={v:i.value,ok:norm(i.value)===norm(i.dataset.ans)};});
    const n=inputs.length,r=inputs.filter(i=>S[i.dataset.g].ok).length;STATE[k+"_score"]={r,n};redrawPack(g);
    if(n){const item=k.startsWith("t")?TEXTS.find(t=>"t"+t.id===k):SONGS.find(s=>"s"+s.id===k);
      App.saveAttempt({activity:"song-fill",detail:item?item.title.slice(0,80):"",units:[item?item.unit:+$("unit").value],score:r,total:n,
        answers:inputs.map(i=>({word:i.dataset.ans,unit:item?item.unit:0,given:S[i.dataset.g].v,correct:S[i.dataset.g].ok}))})
        .then(x=>{if(x.error)App.status("Result not saved: "+x.error.message,false);else if(x.id)App.status(`Result saved: ${r} of ${n}`,true);});}}});
$("out").addEventListener("input",e=>{const i=e.target;if(!i.classList.contains("gap"))return;const k=i.dataset.key.replace(/^([ts])/,"$1");
  const key=i.dataset.key, S=STATE[key]=STATE[key]||{};S[i.dataset.g]={v:i.value};i.classList.remove("ok","no");});
$("out").addEventListener("keydown",e=>{const i=e.target;
  if(i.classList.contains("gap")&&e.key==="Enter"){e.preventDefault();const S=STATE[i.dataset.key]=STATE[i.dataset.key]||{};const ok=norm(i.value)===norm(i.dataset.ans);S[i.dataset.g]={v:i.value,ok};
    i.classList.toggle("ok",ok);i.classList.toggle("no",!ok);const all=[...i.closest(".pack").querySelectorAll("input.gap")];const nx=all[all.indexOf(i)+1];if(nx)nx.focus();}
  if(e.target.matches("mark.vw")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();showPop(+e.target.dataset.w,e.target);}});
// ---------- word pop-up ----------
const AU={};
function hear(i){const v=D[i];if(v.au&&v.au!=="tts"){try{const a=AU[i]||(AU[i]=new Audio(v.au));a.currentTime=0;a.play();return;}catch(e){}}Sets.speak(v.w);}
function showPop(i,anchor){const v=D[i];if(!v)return;const p=$("pop");
  p.innerHTML=`<img src="${esc(v.img)}" alt=""><div class="t"><span>${esc(v.w)}</span><button class="round" type="button" id="popHear" aria-label="Hear ${esc(v.w)}">${icon("volume-2",18)}</button></div>
    ${v.pron?`<div class="muted" style="font-size:.9rem">Say it: <b>${esc(v.pron.replace(/-/g,"·"))}</b></div>`:""}<div>${esc(v.d)}</div>${v.ar?`<div class="tr" dir="auto">${esc(v.ar)}</div>`:""}
    <a class="btn small" href="list.html?set=${SET.id}" style="align-self:flex-start">${icon("list-checks",14)}Open in word list</a>`;
  p.classList.add("on");const r=anchor.getBoundingClientRect(),pw=Math.min(300,innerWidth-24);
  p.style.left=Math.max(12,Math.min(r.left,innerWidth-pw-12))+"px";const below=r.bottom+8,h=p.offsetHeight;p.style.top=(below+h<innerHeight?below:Math.max(12,r.top-h-8))+"px";
  $("popHear").onclick=()=>hear(i);hear(i);$("popHear").focus({preventScroll:true});POPAT=scrollY;}
document.addEventListener("click",e=>{if(!e.target.closest("#pop,mark.vw"))$("pop").classList.remove("on");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("pop").classList.remove("on");});
let POPAT=0;window.addEventListener("scroll",()=>{if(Math.abs(scrollY-POPAT)>40)$("pop").classList.remove("on");},{passive:true});
// ---------- load ----------
(async()=>{const [a,b]=await Promise.all([C.from("set_texts").select("*").eq("set_id",SET.id).order("position",{ascending:true}),C.from("set_songs").select("*").eq("set_id",SET.id).order("position",{ascending:true})]);
  TEXTS=a.data||[];SONGS=b.data||[];
  const units=[...new Set([...TEXTS.map(t=>t.unit),...SONGS.map(s=>s.unit)])].sort((x,y)=>(x===0)-(y===0)||x-y);
  if(!units.length){$("unit").closest(".unitbar").hidden=true;$("out").innerHTML=`<div class="card empty-s"><b>No songs or texts in this set yet.</b><br><span class="muted">Teachers can add them in the set editor.</span></div>`;return;}
  const want=+new URLSearchParams(location.search).get("unit");
  $("unit").innerHTML=units.map(u=>`<option value="${u}" ${u===want?"selected":""}>${esc(uname(u))} · ${TEXTS.filter(t=>t.unit===u).length+SONGS.filter(s=>s.unit===u).length} items</option>`).join("");
  $("unit").onchange=build;build();})();
</script>
<script>Sets.boot({min:0})</script>
</body></html>
