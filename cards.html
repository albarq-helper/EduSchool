<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards · Albarq Education Center</title><link rel="icon" href="assets/icons/brilliant.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="js/vendor/supabase.js"></script><script src="js/config.js"></script><script src="js/icons.js"></script><script src="js/app.js"></script><script src="js/sets.js"></script>
</head><body>
<div class="wrap">
  <div class="head2">
    <div><span class="eyebrow" id="setEyebrow">&nbsp;</span><h1>Flashcards</h1></div>
    <div class="row">
      <select id="unit" aria-label="Unit"></select>
      <label class="row" style="gap:6px;font-weight:700"><input type="checkbox" id="guess"> Guess the term</label>
      <button class="btn small" id="shuffle" type="button"><i data-i="shuffle"></i>Shuffle</button>
    </div>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog" style="width:0"></i></div>
  <article class="fc" id="card" aria-live="polite"></article>
  <div class="row" style="justify-content:center">
    <button class="btn" id="prev" type="button"><i data-i="chevron-left"></i>Previous</button>
    <span class="muted" id="count" style="min-width:6rem;text-align:center;font-variant-numeric:tabular-nums"></span>
    <button class="btn primary" id="next" type="button">Next<i data-i="chevron-right"></i></button>
  </div>
  <p class="muted" style="text-align:center;margin:0;font-size:.9rem">Tip: use the ← and → keys. In “guess” mode, look at the picture (or read the meaning), say or act out the term, then reveal it.</p>
</div>
<script type="text/x-app">
const $=id=>document.getElementById(id), esc=App.esc, D=window.WORDS, U=window.UNITS_LIST;
document.querySelectorAll("[data-i]").forEach(el=>el.insertAdjacentHTML("afterbegin",icon(el.dataset.i,16)));
const uname=x=>x.u?(x.name?`Unit ${x.u} · ${x.name}`:`Unit ${x.u}`):(x.name||"General");
$("unit").innerHTML=`<option value="all">All units (${D.length})</option>`+U.map(x=>`<option value="${x.u}">${esc(uname(x))} (${x.n})</option>`).join("");
let deck=[], k=0, shown=false;
const AU={};
function hear(i){const v=D[i];if(v.au&&v.au!=="tts"){try{const a=AU[i]||(AU[i]=new Audio(v.au));a.currentTime=0;a.play();return;}catch(e){}}Sets.speak(v.w);}
function build(){const u=$("unit").value;deck=D.map((v,i)=>i).filter(i=>u==="all"||D[i].u===+u||(D[i].also||[]).includes(+u));k=0;draw();}
function draw(){
  if(!deck.length){$("card").innerHTML='<p class="empty">No terms in this unit.</p>';return;}
  const i=deck[k], v=D[i], guess=$("guess").checked&&!shown;
  const ex=esc(v.s).replace(/\[([^\]]*)\]/,"<b>$1</b>");
  $("card").innerHTML=`${guess&&!v.real?`<div style="font:700 1.25rem/1.4 var(--f-body);padding:28px 8px;max-width:30rem">${esc(v.d)}</div>`:`<img src="${esc(v.img)}" alt="${guess?"Picture to guess":esc(v.w)}">`}
    ${guess?`<button class="cover" id="reveal" type="button">${icon("eye",18)} Show the term</button>`:
    `<div class="row" style="justify-content:center"><span class="term">${esc(v.w)}</span><button class="round" type="button" id="say" aria-label="Hear ${esc(v.w)}">${icon("volume-2",18)}</button></div>
     <div>${esc(v.d)}</div>${v.s&&!/^\[[^\]]*\]$/.test(v.s)?`<div class="ex">${ex}</div>`:""}${v.ar?`<div class="tr" dir="auto">${esc(v.ar)}</div>`:""}
     ${v.photo?`<img src="${esc(v.photo)}" alt="" style="width:120px;height:120px">`:""}`}
    <span class="chip">${esc(uname(U.find(x=>x.u===v.u)||{u:v.u,name:""}))}</span>`;
  $("count").textContent=(k+1)+" / "+deck.length; $("prog").style.width=((k+1)/deck.length*100)+"%";
  if($("reveal"))$("reveal").onclick=()=>{shown=true;draw();hear(i);};
  if($("say"))$("say").onclick=()=>hear(i);
}
function go(d){if(!deck.length)return;k=(k+d+deck.length)%deck.length;shown=false;draw();}
$("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1);
$("shuffle").onclick=()=>{for(let a=deck.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[deck[a],deck[b]]=[deck[b],deck[a]];}k=0;shown=false;draw();};
$("unit").onchange=build; $("guess").onchange=()=>{shown=false;draw();};
document.addEventListener("keydown",e=>{if(e.target.closest("input,select,textarea"))return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);if(e.key===" "&&$("reveal")){e.preventDefault();$("reveal").click();}});
build();
</script>
<script>Sets.boot({min:1})</script>
</body></html>
