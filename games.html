<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Word Games · Helper Academy</title><link rel="icon" href="assets/icons/brilliant.png"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style><script src="js/vendor/supabase.js"></script><script src="js/config.js?v=20261128e"></script><script src="js/icons.js?v=20261128e"></script><script src="js/app.js?v=20261128e"></script><script src="js/sets.js?v=20261129e"></script></head><body><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@600&display=swap">
<style>
/* Layout: one column; game tabs; a board of target cards above a sticky word tray. Same ink-and-paper tokens as the exam page. */
:root{
  --paper:#F7F8FB; --sheet:#FFFFFF; --ink:#1B2333; --muted:#5E6A80; --rule:#DCE1EA;
  --accent:#2347C5; --accent-soft:#E6ECFB; --chip:#FFF3D6; --chip-edge:#E7B84A;
  --good:#1E7F4F; --good-soft:#E3F4EA; --bad:#B8322A; --bad-soft:#FBE7E5;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Geeza Pro",Arial,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141B; --sheet:#181C25; --ink:#E7EAF1; --muted:#9AA4B8; --rule:#2B3140;
  --accent:#7D9BFF; --accent-soft:#1F2846; --chip:#3A3020; --chip-edge:#B8913A;
  --good:#5FD196; --good-soft:#173326; --bad:#FF8A80; --bad-soft:#3A1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141B; --sheet:#181C25; --ink:#E7EAF1; --muted:#9AA4B8; --rule:#2B3140;
  --accent:#7D9BFF; --accent-soft:#1F2846; --chip:#3A3020; --chip-edge:#B8913A;
  --good:#5FD196; --good-soft:#173326; --bad:#FF8A80; --bad-soft:#3A1D1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:800 clamp(1.7rem,4.5vw,2.4rem)/1.1 var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
header{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:700 .95rem var(--f-body);padding:10px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--sheet)}
.bar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar .left{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%}
.btn{font:700 .95rem var(--f-body);border-radius:8px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.93rem;margin:0}

/* match boards */
.board{display:grid;gap:12px}
.board.pics{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.board.defs{grid-template-columns:1fr}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px;display:flex;gap:10px;min-width:0}
.pics .card{flex-direction:column}
.pics .card img,.card video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;max-width:100%}
.defs .card{align-items:center;flex-wrap:wrap}
.defs .card .dtext{flex:1 1 260px;min-width:0}
.dn{font:800 1rem var(--f-display);color:var(--accent);margin-right:4px}
.slot{min-height:44px;border:2px dashed var(--rule);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px;transition:border-color .12s,background .12s}
.defs .slot{flex:0 0 190px}
@media (max-width:520px){.defs .slot{flex-basis:100%}}
.slot.hot{border-color:var(--accent);background:var(--accent-soft)}
.slot.armed{border-color:var(--accent)}
.card.ok .slot{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.card.no .slot{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:.85rem;color:var(--good);font-weight:700;text-align:center}
.fix .ar{font:600 .95rem var(--f-ar);color:var(--muted);margin-left:6px}

.tray{position:sticky;bottom:0;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;z-index:3;margin-bottom:env(safe-area-inset-bottom,0px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{font:700 1rem var(--f-body);padding:9px 14px;border-radius:999px;background:var(--chip);border:1.5px solid var(--chip-edge);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chip.sel{outline:3px solid var(--accent);outline-offset:2px}
.slot .chip{cursor:pointer}
.chip.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.chip.lifted{opacity:.35}
.trayrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:14px 16px}
.score b{font:800 2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.clock{font:800 1.15rem/1 var(--f-display);font-variant-numeric:tabular-nums;background:var(--sheet);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;min-width:5.2em;text-align:center}
.clock.low{background:#FDE2E1;border-color:#C2410C;color:#9A3412;animation:tick 1s steps(2) infinite}
@keyframes tick{50%{transform:scale(1.06)}}
.score .time{font:700 1rem var(--f-body);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.clock.low{animation:none}}

/* unscramble */
.uns{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:start}
@media (max-width:560px){.uns{grid-template-columns:1fr}.uns img,.uns video{max-width:160px}}
.uns img,.uns video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.uns .body{display:flex;flex-direction:column;gap:12px;min-width:0}
.answer{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:6px;border-bottom:3px solid var(--ink)}
.letters{display:flex;flex-wrap:wrap;gap:6px}
.lt{width:44px;height:48px;border-radius:8px;border:1.5px solid var(--chip-edge);background:var(--chip);color:var(--ink);font:800 1.3rem var(--f-display);cursor:pointer;display:grid;place-items:center;text-transform:uppercase}
.lt.sp{background:transparent;border-style:dashed;width:24px}
.lt:disabled{visibility:hidden}
.answer .lt{background:var(--accent-soft);border-color:var(--accent)}
.uns.ok .answer{border-color:var(--good)} .uns.no .answer{border-color:var(--bad)}
.msg{font-weight:700} .msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
.prog{color:var(--muted);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.review .ar{font:600 1rem var(--f-ar);color:var(--muted);align-self:flex-start}
.say{font-size:.95rem;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:1px 8px;cursor:pointer;color:var(--ink)}

.unitpick{position:relative}
.unitpick summary{list-style:none;cursor:pointer;font:inherit;padding:8px 30px 8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);min-width:12rem;max-width:100%;position:relative}
.unitpick summary::-webkit-details-marker{display:none}
.unitpick summary::after{content:"\25BE";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.unitpick[open] summary{border-color:var(--accent)}
.unitpick .ubox{position:absolute;z-index:20;top:calc(100% + 4px);left:0;width:min(23rem,calc(100vw - 32px));max-height:min(60vh,26rem);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px;box-shadow:0 10px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:4px}
.unitpick .uquick{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--rule)}
.unitpick .uquick button{font:700 .82rem var(--f-body);padding:5px 10px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.unitpick label{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:.92rem;line-height:1.3}
.unitpick label:hover{background:var(--accent-soft)}
.unitpick input{width:18px;height:18px;flex:none;margin-top:1px;accent-color:var(--accent)}
.unitpick .uc{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:8px}
.unitpick .uwarn{color:var(--bad);font-size:.85rem;font-weight:700;padding:4px}

/* new games: questions with choices, meter order */
.mq{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.mqp{font-size:1.12rem;line-height:1.5}.mqp .big{font:800 1.35rem var(--f-display);display:inline-block;margin-top:6px}
.mqo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{font:700 1rem var(--f-body);text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.mqo.rtl .opt{text-align:right;font-family:var(--f-ar);font-size:1.1rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.mline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mline .end{font:800 .9rem var(--f-display);color:var(--muted)}
.mslots{flex:1;display:flex;gap:8px;min-width:0;flex-wrap:wrap;padding:8px;border-radius:12px;background:linear-gradient(90deg,var(--accent-soft),var(--chip))}
.ms{flex:1 1 90px;min-height:46px;border:2px dashed var(--rule);border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--sheet)}
.ms.ok{border-style:solid;border-color:var(--good)}.ms.no{border-style:solid;border-color:var(--bad)}
.chip:disabled{opacity:.3;cursor:default}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow" id="setEyebrow">&nbsp;</span>
    <h1>Word games</h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-g="pics" aria-selected="true">Picture match</button>
      <button class="tab" role="tab" data-g="defs" aria-selected="false">Definition match</button>
      <button class="tab" role="tab" data-g="uns" aria-selected="false">Unscramble</button>
    </div>
  </header>

  <div class="bar">
    <div class="left">
      <span class="eyebrow">Units</span>
      <details class="unitpick" id="unitPick"><summary id="unitSum">All units</summary><div class="ubox" id="unitBox"></div></details>
      <label for="wordSet" class="eyebrow">Practise</label><select id="wordSet"><option value="all">Words in the ticked units</option></select>
      <label for="timerSel" class="eyebrow">Timer</label><select id="timerSel"><option value="off">Off</option><option value="up">Stopwatch</option><option value="60">1 minute</option><option value="120">2 minutes</option><option value="180">3 minutes</option></select>
      <span class="clock" id="clock" hidden aria-live="off"></span>
    </div>
    <button class="btn" id="newRound">New round</button>
  </div>

  <main id="game"></main>
</div>

<script type="text/x-app">
const DATA = window.WORDS;
const UNITS = window.UNITS_LIST;
const AU={};function playWord(i){const v=DATA[i];if(!v)return false;if(!v.au||v.au==="tts")return window.Sets.speak(v.w);try{const a=AU[i]||(AU[i]=new Audio(v.au));a.currentTime=0;a.play();return true;}catch(e){return false;}}
const unitLabel=u=>{const x=UNITS.find(y=>y.u===u);return x?(u?(x.name?`Unit ${u} · ${x.name}`:`Unit ${u}`):(x.name||'General')):'';};
const SETS = {};
const ROUND = 6;
let game="pics", lastMissed=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
Object.entries(SETS).forEach(([k,s])=>$("#wordSet").insertAdjacentHTML("beforeend",`<option value="${k}">${esc(s.name)}</option>`));
$("#wordSet").insertAdjacentHTML("beforeend",`<option value="missed" disabled>Missed this session (0)</option>`);

function pool(){
  const v=$("#wordSet").value;
  if(String(v).startsWith("list:")){const L=(window.MY_LISTS||[]).find(x=>"list:"+x.id===v);return L?L.words.map(w=>DATA.findIndex(d=>d.w===w)).filter(i=>i>=0):[];}if(v==="missed") return lastMissed.slice();
  if(v==="all"){const x=unitIdx();return x.length?x:DATA.map((_,i)=>i);}
  if(SETS[v]) return SETS[v].words.map(w=>DATA.findIndex(d=>d.w===w)).filter(i=>i>=0);
  return DATA.map((_,i)=>i);
}
function markRight(i){const k=lastMissed.indexOf(i);if(k>=0)lastMissed.splice(k,1);addMissed([]);}
function addMissed(idxs){
  idxs.forEach(i=>{if(!lastMissed.includes(i))lastMissed.push(i)});
  const o=$('#wordSet option[value="missed"]'); o.disabled=!lastMissed.length; o.textContent=`Missed this session (${lastMissed.length})`;
}

/* ---------- Match games (pictures / definitions) ---------- */
let sel=null; // selected chip element
/* ---------- optional timer (Off / Stopwatch / countdown) ---------- */
let CUR=[], T={mode:"off",t0:0,limit:0,iv:null,end:null};
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function timerStart(){
  timerStop(); const m=$("#timerSel").value, c=$("#clock"); T.mode=m; T.end=null;
  if(m==="off"){c.hidden=true;return;}
  T.t0=Date.now(); T.limit=m==="up"?0:+m; c.hidden=false; c.classList.remove("low"); tick();
  T.iv=setInterval(tick,250);
}
function tick(){
  const el=(Date.now()-T.t0)/1000, c=$("#clock");
  if(T.mode==="up"){c.textContent="⏱ "+fmtT(el);return;}
  const left=T.limit-el; c.textContent="⏳ "+fmtT(left); c.classList.toggle("low",left<=10);
  if(left<=0) timeUp();
}
function timerStop(){ if(T.iv){clearInterval(T.iv);T.iv=null;} if(T.mode!=="off"&&T.t0&&T.end===null) T.end=(Date.now()-T.t0)/1000; }
function timeText(){
  if(T.mode==="off"||T.end===null) return "";
  if(T.mode==="up") return `Finished in ${fmtT(T.end)}`;
  return T.end>=T.limit?"Time's up!":`${fmtT(T.limit-T.end)} left on the clock`;
}
function timeUp(){
  timerStop(); T.end=T.limit; $("#clock").textContent="⏳ 0:00";
  if(game==="uns"&&U){ // the rest of the words count as missed
    if(!U.cur.done){U.missed.push(U.cur.i);U.ans.push({word:DATA[U.cur.i].w,unit:DATA[U.cur.i].u,given:"",correct:false});}
    for(let k=U.k+1;k<U.items.length;k++){const i=U.items[k];U.missed.push(i);U.ans.push({word:DATA[i].w,unit:DATA[i].u,given:"",correct:false});}
    addMissed(U.missed);saveGame("unscramble",U.right,U.items.length,U.ans);$("#game").innerHTML='<div id="result"></div>';showScore(U.right,U.items.length,U.missed);
  } else if(Q&&Q.qs&&Q.qs.length){for(let k=Q.k;k<Q.qs.length;k++){const q=Q.qs[k];if(k===Q.k&&q.done)continue;const v=DATA[q.i];Q.missed.push(q.i);Q.ans.push({word:v.w,unit:v.u,given:"",correct:false});}Q.k=Q.qs.length;finishQ();
  } else if($("#check")&&!document.querySelector("#board .card[data-done]")) checkMatch(CUR);   // unplaced words count as wrong
}
function matchRound(kind){
  const items=shuffle(pool()).slice(0,ROUND); CUR=items;
  const g=$("#game");
  g.innerHTML=`<p class="hint">${kind==="pics"?"Drag each word onto its picture.":"Drag each word onto its definition."} On a tablet or phone, tap a word, then tap where it goes.</p>
   <div class="board ${kind}" id="board">${items.map((i,k)=>kind==="pics"
     ? `<div class="card" data-i="${i}">${Sets.media(DATA[i],{alt:"Picture "+(k+1)})}<div class="slot" data-i="${i}" aria-label="Drop word for picture ${k+1}"></div></div>`
     : `<div class="card" data-i="${i}"><div class="dtext"><span class="dn">${k+1}.</span>${esc(DATA[i].d)}</div><div class="slot" data-i="${i}" aria-label="Drop word for definition ${k+1}"></div></div>`).join("")}</div>
   <div class="tray"><div class="chips" id="bank">${shuffle(items).map(i=>`<button type="button" class="chip" data-i="${i}">${esc(DATA[i].w)}</button>`).join("")}</div>
     <div class="trayrow"><span class="prog" id="placed">0 of ${items.length} placed</span><button class="btn primary" id="check" disabled>Check answers</button></div></div>
   <div id="result"></div>`;
  $("#check").onclick=()=>checkMatch(items);
}
function placedCount(){const n=[...document.querySelectorAll(".slot")].filter(s=>s.firstElementChild).length,t=document.querySelectorAll(".slot").length;
  const p=$("#placed"); if(p)p.textContent=`${n} of ${t} placed`; const c=$("#check"); if(c)c.disabled=n<t;}
function putInSlot(chip,slot){
  if(slot.closest(".card").dataset.done) return;
  const prev=slot.firstElementChild; if(prev&&prev!==chip) $("#bank").appendChild(prev);
  slot.appendChild(chip); clearSel(); placedCount();
}
function clearSel(){if(sel)sel.classList.remove("sel");sel=null;document.querySelectorAll(".slot.armed").forEach(s=>s.classList.remove("armed"));}
function checkMatch(items){
  let right=0; const missed=[]; const ANSW=[];
  document.querySelectorAll("#board .card").forEach(card=>{
    const i=+card.dataset.i, chip=card.querySelector(".slot .chip"), ok=chip&&+chip.dataset.i===i; ANSW.push({word:DATA[i].w,unit:DATA[i].u,given:chip?DATA[+chip.dataset.i].w:"",correct:!!ok});
    card.dataset.done="1"; card.classList.add(ok?"ok":"no");
    if(ok){right++;markRight(i);} else missed.push(i);
    card.insertAdjacentHTML("beforeend",`<div class="fix">${ok?"✓ ":"Answer: "}${esc(DATA[i].w)}<span class="ar" dir="auto">${esc(DATA[i].ar)}</span>${DATA[i].au?` <button type="button" class="say" data-say="${i}" aria-label="Hear ${esc(DATA[i].w)}">🔊</button>`:""}</div>`);
  });
  addMissed(missed);
  saveGame(game==="pics"?"picture-match":"definition-match",right,items.length,ANSW);
  $("#check").disabled=true;
  showScore(right,items.length,missed);
}
function showScore(right,n,missed){
  timerStop(); const tt=timeText();
  $("#result").innerHTML=`<div class="score" role="status"><b>${right} / ${n}</b><span>${right===n?"Perfect round!":right>=n-2?"Nearly there!":"Keep practising!"}</span>${tt?`<span class="time">${tt}</span>`:""}
    <button class="btn primary" id="again">Next round</button>${missed.length?`<button class="btn" id="redo">Practise missed words</button>`:""}</div>`;
  $("#again").onclick=start;
  const r=$("#redo"); if(r) r.onclick=()=>{$("#wordSet").value="missed";start();};
  $("#result").scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* pointer drag + tap */
let drag=null;
document.addEventListener("pointerdown",e=>{
  const chip=e.target.closest(".chip"); if(!chip||chip.closest(".card")?.dataset.done) return;
  drag={chip,x:e.clientX,y:e.clientY,moved:false,ghost:null,id:e.pointerId};
});
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true; clearSel();
    drag.ghost=drag.chip.cloneNode(true); drag.ghost.classList.add("ghost"); document.body.appendChild(drag.ghost);
    drag.chip.classList.add("lifted");
  }
  if(drag.moved){
    e.preventDefault();
    drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px";
    document.querySelectorAll(".slot.hot").forEach(s=>s.classList.remove("hot"));
    const t=document.elementFromPoint(e.clientX,e.clientY)?.closest(".slot"); if(t) t.classList.add("hot");
  }
},{passive:false});
document.addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const d=drag; drag=null;
  if(d.moved){
    d.ghost.remove(); d.chip.classList.remove("lifted");
    document.querySelectorAll(".slot.hot").forEach(s=>s.classList.remove("hot"));
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const slot=t?.closest(".slot"), bank=t?.closest(".tray");
    if(slot) putInSlot(d.chip,slot); else if(bank&&d.chip.closest(".slot")){$("#bank").appendChild(d.chip);placedCount();}
    return;
  }
  // tap
  if(d.chip.closest(".slot")){ $("#bank").appendChild(d.chip); clearSel(); placedCount(); return; }
  if(sel===d.chip){clearSel();return;}
  clearSel(); sel=d.chip; sel.classList.add("sel");
  document.querySelectorAll(".slot").forEach(s=>s.classList.add("armed"));
});
document.addEventListener("pointercancel",()=>{if(drag){drag.ghost?.remove();drag.chip.classList.remove("lifted");drag=null;}});
document.addEventListener("click",e=>{
  const slot=e.target.closest(".slot");
  if(slot&&sel&&!e.target.closest(".chip")) putInSlot(sel,slot);
});
document.addEventListener("keydown",e=>{ // keyboard: Enter on chip selects, Enter on slot places
  if(e.key!=="Enter"&&e.key!==" ") return;
  const chip=e.target.closest?.(".chip"); if(chip){e.preventDefault(); if(chip.closest(".slot")){$("#bank").appendChild(chip);placedCount();return;} clearSel(); sel=chip; chip.classList.add("sel"); document.querySelectorAll(".slot").forEach(s=>{s.classList.add("armed");s.tabIndex=0;}); }
  else if(e.target.classList?.contains("slot")&&sel){e.preventDefault();putInSlot(sel,e.target);}
});

/* ---------- Unscramble ---------- */
let U=null;
function unsRound(){
  const items=shuffle(pool()).slice(0,ROUND);
  U={items,k:0,right:0,missed:[],ans:[]};
  unsShow();
}
function scramble(w){
  const letters=[...w.replace(/\s*\(.*\)/,"")].filter(c=>/[A-Za-z]/.test(c)).map(c=>c.toLowerCase());
  let s; let tries=0; do{s=shuffle(letters);tries++}while(s.join("")===letters.join("")&&tries<20);
  return {target:letters.join(""),letters:s};
}
function unsShow(){
  const i=U.items[U.k], v=DATA[i], sc=scramble(v.w); U.cur={i,sc,built:[]};
  $("#game").innerHTML=`<p class="hint">Read the clue, then tap the letters in the right order to spell the word.</p>
   <div class="uns" id="unsBox">${Sets.media(v,{alt:"Picture clue"})}
    <div class="body"><span class="prog">Word ${U.k+1} of ${U.items.length} · ${sc.target.length} letters</span>
     <div><b>Clue:</b> ${esc(v.d)}</div>
     <div class="answer" id="ans" aria-live="polite"></div>
     <div class="letters" id="lts">${sc.letters.map((c,j)=>`<button type="button" class="lt" data-j="${j}">${c}</button>`).join("")}</div>
     <div class="trayrow"><div class="left" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="undo">Undo</button><button class="btn" id="clear">Clear</button><button class="btn" id="hintBtn">Hint</button></div>
       <button class="btn primary" id="ucheck" disabled>Check</button></div>
     <div id="umsg"></div></div></div><div id="result"></div>`;
  $("#lts").onclick=e=>{const b=e.target.closest(".lt");if(!b||U.cur.done)return;b.disabled=true;U.cur.built.push(+b.dataset.j);drawAns();};
  $("#undo").onclick=()=>{if(U.cur.done)return;const j=U.cur.built.pop();if(j!==undefined)$(`#lts .lt[data-j="${j}"]`).disabled=false;drawAns();};
  $("#clear").onclick=()=>{if(U.cur.done)return;U.cur.built=[];document.querySelectorAll("#lts .lt").forEach(b=>b.disabled=false);drawAns();};
  $("#hintBtn").onclick=()=>{if(U.cur.done)return;U.cur.hinted=true;$("#umsg").innerHTML=`<span class="msg">Starts with “${sc.target[0].toUpperCase()}”. Translation: <span class="ar" dir="auto" style="font-family:var(--f-ar)">${esc(v.ar)}</span></span>`;};
  $("#ucheck").onclick=unsCheck;
}
function drawAns(){
  const sc=U.cur.sc; $("#ans").innerHTML=U.cur.built.map(j=>`<span class="lt">${sc.letters[j]}</span>`).join("");
  $("#ucheck").disabled=U.cur.built.length!==sc.target.length;
}
function unsCheck(){
  const c=U.cur, word=c.built.map(j=>c.sc.letters[j]).join(""), ok=word===c.sc.target, v=DATA[c.i];
  c.done=true; $("#unsBox").classList.add(ok?"ok":"no");
  if(ok){U.right++;markRight(c.i);} else U.missed.push(c.i); U.ans.push({word:v.w,unit:v.u,given:word,correct:ok});
  $("#umsg").innerHTML=`<div class="review"><span class="msg ${ok?"ok":"no"}">${ok?"Correct!":"Not quite. The word is"} <b>${esc(v.w)}</b> ${v.au?`<button type="button" class="say" data-say="${c.i}">🔊</button>`:""}</span>
    <span class="ar" dir="auto">${esc(v.ar)}</span><span>${esc(v.s).replace(/\[([^\]]*)\]/,"<u><b>$1</b></u>")}</span>
    <div><button class="btn primary" id="unext">${U.k+1<U.items.length?"Next word":"See score"}</button></div></div>`;
  $("#ucheck").disabled=true;
  $("#unext").onclick=()=>{U.k++; if(U.k<U.items.length) unsShow(); else {addMissed(U.missed);saveGame("unscramble",U.right,U.items.length,U.ans);$("#game").innerHTML='<div id="result"></div>';showScore(U.right,U.items.length,U.missed);}};
  $("#unext").focus();
}

/* ---------- New games: meters, similar words, opposites, idioms, sayings, phrasal verbs, word partners ----------
   Each generator turns word indices into questions: {i, html, opts:[{t, ok, note}], explain}.
   The meter game is an ordering game. Tabs show only when the set has data for them. */
const NG={sim:"≈ Same meaning",opp:"⇄ Opposites",meter:"🎚️ Meter order",idiom:"💬 Idioms",saying:"📜 Sayings",phrasal:"🧩 Phrasal verbs",partner:"🔗 Word partners"};
const nm=i=>String(DATA[i].w).replace(/\s*\(.*\)/,"");
const tg=i=>DATA[i].tags||[];
const simsOf=i=>Sets.isSaying(DATA[i])?[]:tg(i).filter(t=>/^≈\s/.test(t)).map(t=>t.replace(/^≈\s*/,""));
const oppsOf=i=>Sets.isSaying(DATA[i])?[]:tg(i).filter(t=>/^⇄\s/.test(t)).map(t=>{const m=t.replace(/^⇄\s*/,"").match(/^(.*):\s*(.*)$/);return m?{g:m[1].trim(),side:m[2].trim()}:null;}).filter(Boolean);
const scalesOf=i=>tg(i).filter(t=>/^📶\s/.test(t)).map(t=>{const m=t.replace(/^📶\s*/,"").match(/^(.*):\s*([+-]?\d+)$/);return m?{g:m[1].trim(),r:+m[2]}:null;}).filter(Boolean);
const typeOf=i=>tg(i).find(t=>Sets.TAG_TYPES.some(x=>x[0]===t))||"";
const pick=(a,n)=>shuffle(a).slice(0,n);
const uniqT=a=>{const s=new Set();return a.filter(x=>{const k=String(x).toLowerCase();if(s.has(k))return false;s.add(k);return true;});};
const ALL=()=>DATA.map((_,i)=>i);
function mcq(i,html,right,wrong,explain,notes){const w=uniqT(wrong.filter(x=>x&&String(x).toLowerCase()!==String(right).toLowerCase())).slice(0,3);if(w.length<2)return null;
  return {i,html,opts:shuffle([{t:right,ok:true},...w.map(t=>({t,ok:false,note:(notes||{})[t]||""}))]),explain};}
const GEN={
  sim(P,n){const out=[];for(const i of shuffle(P)){if(out.length>=n)break;for(const g of shuffle(simsOf(i))){
      const mates=ALL().filter(j=>j!==i&&nm(j).toLowerCase()!==nm(i).toLowerCase()&&simsOf(j).includes(g));if(!mates.length)continue;
      const r=mates[Math.floor(Math.random()*mates.length)],ty=typeOf(i),mine=new Set(simsOf(i));
      const far=ALL().filter(j=>j!==i&&!simsOf(j).some(x=>mine.has(x))&&!/\s/.test(nm(j))&&(DATA[j].tags||[]).length);
      const same=far.filter(j=>typeOf(j)===ty);
      const q=mcq(i,`Which one means nearly the same as <b>${esc(nm(i))}</b>?`,nm(r),pick(same.length>=3?same:far,6).map(nm),
        `<b>${esc(nm(i))}</b> ≈ <b>${esc(nm(r))}</b>. Group ≈ ${esc(g)}: ${uniqT(ALL().filter(j=>simsOf(j).includes(g)).map(nm)).map(esc).join(", ")}.`);
      if(q){out.push(q);break;}}}return out;},
  opp(P,n){const out=[];for(const i of shuffle(P)){if(out.length>=n)break;for(const o of shuffle(oppsOf(i))){
      const other=ALL().filter(j=>oppsOf(j).some(x=>x.g===o.g&&x.side!==o.side));if(!other.length)continue;
      const r=other[Math.floor(Math.random()*other.length)];
      const traps=ALL().filter(j=>j!==i&&oppsOf(j).some(x=>x.g===o.g&&x.side===o.side)).map(nm);   // same side = similar, not opposite
      const rest=ALL().filter(j=>!oppsOf(j).some(x=>x.g===o.g)&&!/\s/.test(nm(j))).map(nm);
      const wrong=pick(traps,2).concat(pick(rest,4)),notes={};traps.forEach(t=>notes[t]="That one is on the same side: it means something similar.");
      const q=mcq(i,`What is the <b>opposite</b> of <b>${esc(nm(i))}</b>?`,nm(r),wrong,`<b>${esc(nm(i))}</b> ⇄ <b>${esc(nm(r))}</b> (${esc(o.g)}).`,notes);
      if(q){out.push(q);break;}}}return out;},
  idiom(P,n){const I=P.filter(i=>DATA[i].lit),allI=ALL().filter(i=>DATA[i].lit),out=[];let k=0;
    for(const i of shuffle(I)){if(out.length>=n)break;const v=DATA[i];k++;
      const others=allI.filter(j=>j!==i);
      if(k%2===0&&v.eq&&others.filter(j=>DATA[j].eq).length>=3){const q=mcq(i,`Which Arabic saying has the same idea as <b>“${esc(nm(i))}”</b>?`,v.eq,pick(others.filter(j=>DATA[j].eq).map(j=>DATA[j].eq),5),
          `<b>${esc(nm(i))}</b> means: ${esc(v.d)} · <span dir="rtl" lang="ar">${esc(v.ar)}</span>`);if(q){q.rtl=true;out.push(q);continue;}}
      const notes={};notes[v.lit]="That's only the word-for-word meaning, not the real one!";
      const q=mcq(i,`What does <b>“${esc(nm(i))}”</b> really mean?`,v.d,[v.lit,...pick(others.map(j=>DATA[j].d),4)],
        `Word for word: <i>${esc(v.lit)}</i> · Real meaning: <b>${esc(v.d)}</b>${v.eq?` · We say: <span dir="rtl" lang="ar">${esc(v.eq)}</span>`:""}`,notes);if(q)out.push(q);}
    return out;},
  saying(P,n){const S=P.filter(i=>DATA[i].author),allS=ALL().filter(i=>DATA[i].author),out=[];let k=0;
    const who=i=>DATA[i].author.split(" · ")[0];
    for(const i of shuffle(S)){if(out.length>=n)break;const v=DATA[i];k++;
      if(k%2===1){const q=mcq(i,`Who said it?<br><b>“${esc(v.w)}”</b>`,who(i),pick(uniqT(allS.map(who)).filter(a=>a!==who(i)),6),
          `<b>${esc(v.author)}</b>. It means: ${esc(v.d)}`);if(q){out.push(q);continue;}}
      const words=v.w.match(/[A-Za-z']{4,}/g)||[];if(!words.length)continue;const key=words.sort((a,b)=>b.length-a.length)[0];
      const pool=uniqT(allS.filter(j=>j!==i).flatMap(j=>DATA[j].w.match(/[A-Za-z']{4,}/g)||[]));
      const q=mcq(i,`Finish the saying:<br><b>“${esc(v.w).replace(new RegExp("\\b"+key+"\\b"),"_____")}”</b>`,key,pick(pool,8),`<b>“${esc(v.w)}”</b> — ${esc(v.author)}`);if(q)out.push(q);}
    return out;},
  phrasal(P,n){const PS=["up","down","out","off","on","in","away","back","over","after","for","with","into","along with","up with","out of","forward to","up to"];const out=[];
    for(const i of shuffle(P.filter(i=>tg(i).includes("Phrasal verb")))){if(out.length>=n)break;const v=DATA[i],parts=nm(i).split(/\s+/),part=parts.slice(1).join(" ").toLowerCase();if(!part)continue;
      const m=String(v.s||"").match(/\[([^\]]+)\]/);if(!m)continue;const said=m[1],re=new RegExp("\\s"+part.replace(/\s+/g,"\\s+")+"$","i");if(!re.test(said))continue;
      const shown=esc(v.s.replace(/\[([^\]]+)\]/,(x,y)=>"⟦"+y.replace(re," ____")+"⟧")).replace("⟦","<b>").replace("⟧","</b>");
      const q=mcq(i,`Which little word is missing?<br>${shown}`,part,pick(PS.filter(p=>p!==part),6),`<b>${esc(nm(i))}</b>: ${esc(v.d)}${v.ar?` · <span dir="rtl" lang="ar">${esc(v.ar)}</span>`:""}`);if(q)out.push(q);}
    return out;},
  partner(P,n){const out=[],M=window.PARTNERS_MAP;if(!M)return out;const K=["adjective","adverb","verb","noun"];
    const byKind={};M.forEach(o=>o.own.forEach(x=>{if(K.includes(x.kind)&&!x.partner.includes(" … "))(byKind[x.kind]=byKind[x.kind]||[]).push(x.partner.toLowerCase());}));
    for(const i of shuffle(P)){if(out.length>=n)break;const o=M.get(DATA[i].wid);if(!o)continue;
      const cand=o.own.filter(x=>K.includes(x.kind)&&!x.partner.includes(" … ")&&new RegExp("\\b"+x.partner.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(x.phrase));if(!cand.length)continue;
      const x=cand[Math.floor(Math.random()*cand.length)],mine=new Set(o.own.map(y=>y.partner.toLowerCase()));
      const shown=esc(x.phrase).replace(new RegExp("\\b"+esc(x.partner).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i"),"_____");
      const q=mcq(i,`Which word goes with <b>${esc(nm(i))}</b>?<br><span class="big">${shown}</span>`,x.partner,pick(uniqT((byKind[x.kind]||[]).filter(p=>!mine.has(p))),6),
        `<b>${esc(x.phrase)}</b>. Other ${esc(x.kind)}s with ${esc(nm(i))}: ${esc(o.own.filter(y=>y.kind===x.kind).map(y=>y.phrase).join(", "))}`);if(q)out.push(q);}
    return out;}
};
/* meter order: put 3–5 words from one meter in order, weakest → strongest */
function meterQs(P,n){const seen=new Set(),out=[];
  for(const i of shuffle(P))for(const s of scalesOf(i)){if(seen.has(s.g)||out.length>=n)continue;
    const byR=new Map();ALL().forEach(j=>scalesOf(j).forEach(x=>{if(x.g===s.g){if(!byR.has(x.r))byR.set(x.r,[]);byR.get(x.r).push(j);}}));
    const ranks=[...byR.keys()];if(ranks.length<3)continue;seen.add(s.g);
    const use=pick(ranks.filter(r=>r!==s.r),Math.min(4,ranks.length-1)).concat([s.r]).sort((a,b)=>a-b);
    const words=use.map(r=>r===s.r?i:byR.get(r)[Math.floor(Math.random()*byR.get(r).length)]);
    const ends=s.g.split(/\s*(?:→|⇄)\s*/);out.push({i,g:s.g,left:ends[0],right:ends[1]||"",items:words.map((j,k)=>({j,name:nm(j),emoji:DATA[j].emoji||"",r:use[k]}))});}
  // partner meters: light rain → pouring rain
  const M=window.PARTNERS_MAP;if(M)for(const i of shuffle(P)){if(out.length>=n)break;const o=M.get(DATA[i].wid);if(!o)continue;
    for(const sc of Sets.partnerScales(o.own)){if(seen.has(sc.g)||out.length>=n)continue;const byR=new Map();sc.items.forEach(x=>{if(!byR.has(x.r))byR.set(x.r,x);});
      const ranks=[...byR.keys()].sort((a,b)=>a-b);if(ranks.length<3)continue;seen.add(sc.g);const use=pick(ranks,Math.min(5,ranks.length)).sort((a,b)=>a-b);
      out.push({i,g:sc.g,left:sc.left,right:sc.right,items:use.map(r=>({j:i,name:byR.get(r).phrase,emoji:"",r}))});}}
  return shuffle(out);}
let Q=null;
function newRound(kind){
  const P=pool();if(kind==="meter"){const qs=meterQs(P,4);Q={kind,qs,k:0,right:0,missed:[],ans:[]};if(!qs.length)return noQ(kind);return meterShow();}
  const qs=GEN[kind](P,ROUND);Q={kind,qs,k:0,right:0,missed:[],ans:[]};if(!qs.length)return noQ(kind);mcqShow();}
function noQ(kind){$("#game").innerHTML=`<p class="hint">No ${esc(NG[kind])} questions for these words. Try <b>All units</b>, or another set.</p>`;timerStop();}
function mcqShow(){const q=Q.qs[Q.k],v=DATA[q.i];
  $("#game").innerHTML=`<div class="mq"><span class="prog">Question ${Q.k+1} of ${Q.qs.length}</span>
    <div class="mqp">${q.html} <button type="button" class="say" data-say="${q.i}" aria-label="Hear it">🔊</button></div>
    <div class="mqo${q.rtl?" rtl":""}">${q.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"${q.rtl?' dir="rtl" lang="ar"':""}>${esc(o.t)}</button>`).join("")}</div>
    <div id="mqmsg"></div></div><div id="result"></div>`;
  $("#game .mqo").onclick=e=>{const b=e.target.closest(".opt");if(!b||q.done)return;q.done=true;const o=q.opts[+b.dataset.k],ok=o.ok;
    document.querySelectorAll("#game .opt").forEach((x,k)=>{x.disabled=true;if(q.opts[k].ok)x.classList.add("ok");});if(!ok)b.classList.add("no");
    if(ok){Q.right++;markRight(q.i);}else Q.missed.push(q.i);Q.ans.push({word:v.w,unit:v.u,given:o.t,correct:ok});
    $("#mqmsg").innerHTML=`<div class="review"><span class="msg ${ok?"ok":"no"}">${ok?"Correct!":"Not quite."}${!ok&&o.note?` ${esc(o.note)}`:""}</span><span>${q.explain}</span>
      <div><button class="btn primary" id="mqnext">${Q.k+1<Q.qs.length?"Next question":"See score"}</button></div></div>`;
    $("#mqnext").onclick=mcqNext;$("#mqnext").focus();};}
function mcqNext(){Q.k++;if(Q.k<Q.qs.length)(Q.kind==="meter"?meterShow:mcqShow)();else finishQ();}
function finishQ(){addMissed(Q.missed);saveGame(Q.kind==="meter"?"meter order":NG[Q.kind].replace(/^\S+\s/,"").toLowerCase(),Q.right,Q.qs.length,Q.ans);$("#game").innerHTML='<div id="result"></div>';showScore(Q.right,Q.qs.length,Q.missed);}
function meterShow(){const q=Q.qs[Q.k];q.built=[];const order=shuffle(q.items.map((x,k)=>k));
  $("#game").innerHTML=`<div class="mq"><span class="prog">Meter ${Q.k+1} of ${Q.qs.length}</span>
    <div class="mqp">Put these words in order on the <b>${esc(q.g)}</b> meter, from <b>${esc(q.left)}</b> to <b>${esc(q.right)}</b>.</div>
    <div class="mline"><span class="end">${esc(q.left)}</span><div class="mslots" id="mslots">${q.items.map(()=>`<span class="ms"></span>`).join("")}</div><span class="end">${esc(q.right)}</span></div>
    <div class="chips" id="mbank">${order.map(k=>`<button type="button" class="chip" data-m="${k}">${esc(q.items[k].emoji)} ${esc(q.items[k].name)}</button>`).join("")}</div>
    <div class="trayrow"><button class="btn" id="mundo">Undo</button><button class="btn primary" id="mcheck" disabled>Check</button></div><div id="mqmsg"></div></div><div id="result"></div>`;
  const draw=()=>{const sl=[...document.querySelectorAll("#mslots .ms")];sl.forEach((s,k)=>{const m=q.built[k];s.innerHTML=m===undefined?"":`<span class="chip">${esc(q.items[m].name)}</span>`;});
    document.querySelectorAll("#mbank .chip").forEach(c=>c.disabled=q.built.includes(+c.dataset.m));$("#mcheck").disabled=q.built.length!==q.items.length;};
  $("#mbank").onclick=e=>{const c=e.target.closest(".chip");if(!c||q.done||c.disabled)return;q.built.push(+c.dataset.m);draw();};
  $("#mundo").onclick=()=>{if(q.done)return;q.built.pop();draw();};
  $("#mcheck").onclick=()=>{q.done=true;const ok=q.built.every((m,k)=>m===k),v=DATA[q.i];
    [...document.querySelectorAll("#mslots .ms")].forEach((s,k)=>s.classList.add(q.built[k]===k?"ok":"no"));
    if(ok){Q.right++;markRight(q.i);}else Q.missed.push(q.i);Q.ans.push({word:v.w,unit:v.u,given:q.built.map(m=>q.items[m].name).join(" < "),correct:ok});
    $("#mqmsg").innerHTML=`<div class="review"><span class="msg ${ok?"ok":"no"}">${ok?"Correct!":"Not quite. The right order:"}</span>
      <span>${q.items.map(x=>`<b>${esc(x.name)}</b> <small class="muted">(${x.r>0&&/⇄/.test(q.g)?"+":""}${x.r})</small>`).join(" → ")}</span>
      <div><button class="btn primary" id="mqnext">${Q.k+1<Q.qs.length?"Next meter":"See score"}</button></div></div>`;$("#mqnext").onclick=mcqNext;$("#mcheck").disabled=true;};}
/* which new tabs this set can play (after extra words and partners have loaded) */
async function setupNewGames(){
  try{await Sets.loadCompanions();}catch(e){}
  try{window.PARTNERS_MAP=await Sets.loadPartners(DATA);}catch(e){window.PARTNERS_MAP=new Map();}
  const mine=DATA.map((v,i)=>i).filter(i=>!DATA[i].companion),tabs=document.querySelector(".tabs");
  Object.keys(NG).forEach(k=>{const n=k==="meter"?meterQs(mine,2).length:GEN[k](mine,2).length;if(n<1)return;
    tabs.insertAdjacentHTML("beforeend",`<button class="tab" role="tab" data-g="${k}" aria-selected="false">${esc(NG[k])}</button>`);});
  if(mine.length>=4)tabs.insertAdjacentHTML("beforeend",`<button class="tab" role="tab" data-href="table.html" aria-selected="false">🌍 Around the table</button>`);
  if(mine.filter(i=>/\s/.test(nm(i))).length>mine.length/2){const u=document.querySelector('[data-g="uns"]');if(u)u.hidden=true;}
  const want=new URLSearchParams(location.search).get("game");const t=want&&document.querySelector(`.tab[data-g="${want}"]`);if(t)t.click();}
/* ---------- shell ---------- */
function start(){ sel=null; Q=null; if(!pool().length){$("#wordSet").value="all";} if(GEN[game]||game==="meter")newRound(game); else game==="uns"?unsRound():matchRound(game); timerStart(); }
try{const tv=localStorage.getItem("gameTimer");if(tv&&$("#timerSel").querySelector(`option[value="${tv}"]`))$("#timerSel").value=tv;}catch(e){}
$("#timerSel").onchange=()=>{try{localStorage.setItem("gameTimer",$("#timerSel").value);}catch(e){}start();};
document.querySelector(".tabs").onclick=e=>{const t=e.target.closest(".tab");if(!t)return;if(t.dataset.href){location.href=t.dataset.href+location.search;return;}game=t.dataset.g;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));start();};
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.stopPropagation();playWord(+b.dataset.say);}},true);
$("#newRound").onclick=start;

var UKEY="vocabUnitsSel";
function selUnits(){return [...document.querySelectorAll('#unitBox input[type=checkbox]:checked')].map(c=>+c.value);}
function inUnits(i,S){return S.includes(DATA[i].u)||(DATA[i].also||[]).some(u=>S.includes(u));}
function unitIdx(){const S=selUnits();return DATA.map((_,i)=>i).filter(i=>inUnits(i,S));}
function rangeText(S){const n=S.filter(u=>u>0).sort((a,b)=>a-b),out=[];for(let k=0;k<n.length;){let j=k;while(j+1<n.length&&n[j+1]===n[j]+1)j++;out.push(j>k?`${n[k]}–${n[j]}`:`${n[k]}`);k=j+1;}
  let t=out.length?(n.length>1?"Units ":"Unit ")+out.join(", "):"";if(S.includes(0))t+=(t?" + ":"")+"grammar";return t;}
function unitText(){const S=selUnits();if(!S.length)return "No units selected";if(S.length===UNITS.length)return "All units";return rangeText(S);}
function unitSummary(){const S=selUnits(),n=unitIdx().length;
  document.getElementById("unitSum").textContent=S.length?`${unitText()} (${n} words)`:"Choose at least one unit";
  const w=document.getElementById("unitWarn");if(w)w.hidden=!!S.length;
  try{localStorage.setItem(UKEY,JSON.stringify(S));}catch(e){}}
function buildUnitBox(onChange){
  let saved=null;try{saved=JSON.parse(localStorage.getItem(UKEY)||"null");}catch(e){}
  const box=document.getElementById("unitBox");
  box.innerHTML=`<div class="uquick"><button type="button" data-q="all">All</button><button type="button" data-q="none">None</button></div>`+
    UNITS.map(x=>`<label><input type="checkbox" value="${x.u}" ${!saved||saved.includes(x.u)?"checked":""}><span>${esc(x.u?(x.name?`Unit ${x.u} · ${x.name}`:`Unit ${x.u}`):(x.name||"General"))}</span><span class="uc">${x.n}</span></label>`).join("")+
    `<div class="uwarn" id="unitWarn" hidden>Tick at least one unit.</div>`;
  if(saved&&!selUnits().length) box.querySelectorAll("input").forEach(c=>c.checked=true);
  box.addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(!b)return;const q=b.dataset.q;
    box.querySelectorAll("input[type=checkbox]").forEach(c=>{const u=+c.value;c.checked=q==="all"?true:q==="none"?false:(()=>{const[a,z]=q.split("-").map(Number);return u>=a&&u<=z;})();});
    unitSummary();if(selUnits().length)onChange();});
  box.addEventListener("change",()=>{unitSummary();if(selUnits().length)onChange();});
  document.addEventListener("click",e=>{const d=document.getElementById("unitPick");if(d.open&&!d.contains(e.target))d.open=false;});
  unitSummary();
}

buildUnitBox(()=>{$("#wordSet").value="all";start();});
$("#wordSet").onchange=start;
start();
setupNewGames();
</script>
<script type="text/x-app">
async function loadMyLists(){const L=await App.myLists();window.MY_LISTS=L;const sel=document.getElementById("wordSet");
  sel.querySelectorAll('option[value^="list:"]').forEach(o=>o.remove());
  const miss=sel.querySelector('option[value="missed"]');
  L.forEach(l=>{const o=document.createElement("option");o.value="list:"+l.id;o.textContent="Practice list: "+l.name+" ("+l.words.length+")";sel.insertBefore(o,miss);});
  const want=new URLSearchParams(location.search).get("list");if(want&&L.some(l=>l.id===want)){sel.value="list:"+want;start();}}
function listName(){const v=document.getElementById("wordSet").value;const o=document.getElementById("wordSet").selectedOptions[0];return v==="all"?"":(o?o.textContent:"");}
App.requireUser().then(()=>loadMyLists()).catch(()=>{});

if(!window.HAS_PICS){const tp=document.querySelector('[data-g="pics"]');if(tp){tp.hidden=true;const td=document.querySelector('[data-g="defs"]');if(td)td.click();}}
function saveGame(activity,score,total,answers){App.saveAttempt({activity,units:selUnits(),word_list:listName(),score,total,answers})
  .then(r=>{if(r.error)App.status("Result not saved: "+r.error.message,false);else if(r.id)App.status("Result saved",true);});}
</script><script>Sets.boot({min:4})</script></body></html>
