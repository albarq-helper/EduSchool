<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Characters · Helper Academy</title><link rel="icon" href="assets/icons/brilliant.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="js/vendor/supabase.js"></script><script src="js/config.js?v=20261128a"></script><script src="js/icons.js?v=20261128a"></script><script src="js/app.js?v=20261128a"></script><script src="js/chars.js?v=20261128a"></script>
<style>
.chead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}.chead h1{margin:0}.chead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.tabs{display:flex;gap:6px;margin:0 0 12px;border-bottom:2px solid var(--rule);flex-wrap:wrap}
.tab{all:unset;cursor:pointer;padding:10px 14px;font:800 .95rem var(--f-body);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.grid .ch-card{cursor:pointer}.grid .ch-card:hover{border-color:var(--accent)}
.tcard{background:var(--sheet);border:1.5px solid var(--rule);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.tcard h3{margin:0;font:800 1.1rem var(--f-display)}.tcard .fam{font:800 .72rem var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.three{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px}.three>div{border-radius:12px;padding:8px 10px;font-size:.88rem;display:grid;gap:3px;align-content:start}
.three .lo,.three .hi{background:var(--bad-soft)}.three .mid{background:#fef9c3;border:1.5px solid #f59e0b}.three b{font:800 .95rem var(--f-body)}
@media (max-width:720px){.three{grid-template-columns:1fr}}
.note{font-size:.85rem;background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.ccard{background:var(--sheet);border:1.5px solid var(--rule);border-left:6px solid #8b5cf6;border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.ccard h3{margin:0;font:800 1.1rem var(--f-display)}.ccard ul{margin:0;padding-left:18px}.kind{font:800 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:#6d28d9}
.dlg{border:0;border-radius:18px;padding:16px 18px;max-width:min(820px,96vw);width:100%;background:var(--sheet);color:var(--ink)}.dlg::backdrop{background:rgba(15,23,42,.45)}
.dlg .meters{display:grid;gap:14px;margin-top:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.form label{display:grid;gap:3px;font:700 .75rem var(--f-body);color:var(--muted)}.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{font:600 .93rem var(--f-body);padding:7px 9px;border:1.5px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink)}
.trow{display:grid;grid-template-columns:minmax(170px,1fr) 2fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}.trow .r{display:grid;gap:4px}
.trow input[type=range]{width:100%;accent-color:#f59e0b}.trow .lv{font:700 .8rem var(--f-body);color:var(--muted)}
.plc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px}.plc label{font:700 .72rem var(--f-body);color:var(--muted)}
.grp{margin:18px 0 8px;font:800 1.15rem var(--f-display)}.grp small{font:700 .8rem var(--f-body);color:var(--muted)}
.sub{margin-left:22px;border-left-color:#c4b5fd}
.acad{background:#f1f5f9;border-radius:10px;padding:8px 10px;font-size:.9rem;display:grid;gap:4px}.acad b{font:800 .75rem var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:#334155}
.acad ol{margin:0;padding-left:18px;font-size:.8rem;color:#475569}
.sg{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:2px 9px;font:700 .8rem var(--f-body);cursor:pointer;color:var(--ink)}
.sg.w3{border-color:#dc2626;background:#fef2f2}.sg.w2{border-color:#f97316;background:#fff7ed}.sg small{color:var(--muted)}
.scard{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:8px 12px;display:grid;gap:3px}.scard b{font-size:1rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.srow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--rule)}.srow select{font:700 .82rem var(--f-body);padding:3px 6px;border-radius:8px;border:1px solid var(--rule)}
.linkb{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font:inherit;font-weight:800;text-align:left}
.why{display:grid;gap:6px}.why .w{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:7px 10px;font-size:.9rem}
.why .w b{font-size:.98rem}.why .arrow{color:var(--muted);font-weight:800}.chip{display:inline-block;border-radius:999px;padding:1px 8px;margin:2px 3px 2px 0;font:700 .8rem var(--f-body);background:#fef3c7;color:#78350f}
.chip.root{background:#dcfce7;color:#14532d}.chip.prot{background:#e0f2fe;color:#075985}.chip.cond{background:#ede9fe;color:#5b21b6}
.adv{display:grid;gap:6px}.adv blockquote{margin:0;padding:7px 12px;border-left:4px solid #f59e0b;background:#fffbeb;border-radius:0 10px 10px 0;font:700 .95rem/1.35 var(--f-display)}.adv blockquote small{display:block;font:700 .75rem var(--f-body);color:var(--muted);margin-top:2px}
.rcard{background:var(--sheet);border:1.5px solid var(--rule);border-left:6px solid #22c55e;border-radius:14px;padding:12px 14px;display:grid;gap:6px}.rcard h3{margin:0;font:800 1.1rem var(--f-display)}
.pain{display:grid;gap:3px;background:#fff1f2;border-radius:10px;padding:8px 10px;font-size:.9rem}.pain>b{font:800 .75rem var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:#9f1239}
.conds{display:flex;flex-wrap:wrap;gap:6px}.conds label{display:inline-flex;gap:5px;align-items:center;font:700 .85rem var(--f-body);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
</style>
</head><body>
<div class="wrap" style="max-width:1150px">
  <div class="chead"><div><span class="eyebrow">Story library</span><h1>🎭 Characters</h1>
    <p>Every story needs characters, and every character is made of a personality, not just a name. Each trait is a meter: the 🌟 golden middle is healthy, and too little or too much causes trouble, for them or for others. Some traits change with the place.</p></div>
    <div id="acts"></div></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="c" aria-selected="true">🎭 Characters</button><button class="tab" role="tab" data-tab="t" aria-selected="false">🧩 Personality traits</button><button class="tab" role="tab" data-tab="r" aria-selected="false">🌱 Roots</button><button class="tab" role="tab" data-tab="p" aria-selected="false">💔 Pain</button><button class="tab" role="tab" data-tab="s" aria-selected="false">🔎 Signs</button><button class="tab" role="tab" data-tab="k" aria-selected="false">🩺 Conditions, tactics &amp; ideas</button><span id="acad" style="margin-left:auto;align-self:center"></span></div>
  <div id="pane"><div class="empty">Loading…</div></div>
</div>
<dialog class="dlg" id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id),esc=App.esc;let L=null,TAB="c",F={q:"",role:"",acad:(()=>{try{return localStorage.getItem("chAcad")!=="0";}catch(x){return true;}})()},EDITOR=false;
const KIND={issue:"Issue",behaviour:"Behaviour",condition:"Condition",disorder:"Disorder",idea:"Idea",tactic:"Tactic",emotion:"Feeling"};
function drawChars(){const list=L.chars.filter(c=>(!F.role||c.role===F.role)&&(!F.q||(c.name+" "+(c.bio||"")+" "+Chars.personality(c)).toLowerCase().includes(F.q.toLowerCase())));
  return `<div class="ch-filters"><input type="search" id="q" placeholder="Search: name, or what they are like (e.g. complains, explodes)" value="${esc(F.q)}"><button type="button" data-role="" aria-pressed="${!F.role}">All (${L.chars.length})</button>${L.roles.filter(r=>L.chars.some(c=>c.role===r.key)).map(r=>`<button type="button" data-role="${r.key}" aria-pressed="${F.role===r.key}">${r.icon} ${esc(r.name)}</button>`).join("")}</div>
    <div class="grid">${list.map(c=>Chars.card(c,{tag:"button",attr:`type="button" data-open="${c.id}"`})).join("")||`<p class="muted">No characters found.</p>`}</div>`;}
function drawTraits(){return `<div style="display:grid;gap:10px">${L.traits.map(t=>`<div class="tcard"><span class="fam">${esc(t.family)}${t.varies_by_place?" · 📍 can change with the place":""}</span><h3>${esc(t.icon)} ${esc(t.name)}</h3>
    <div class="three"><div class="lo"><b>◀ Too little: ${esc(t.low_name)}</b><span>🙋 ${esc(t.low_self)}</span><span>👥 ${esc(t.low_others)}</span></div>
      <div class="mid"><b>🌟 Golden middle: ${esc(t.mid_name)}</b><span>${esc(t.mid_text)}</span></div>
      <div class="hi"><b>Too much: ${esc(t.high_name)} ▶</b><span>🙋 ${esc(t.high_self)}</span><span>👥 ${esc(t.high_others)}</span></div></div>
    ${t.place_note?`<div class="note">📍 ${esc(t.place_note)}</div>`:""}
    <div class="ch-mini">${L.chars.filter(c=>c.traits&&c.traits[t.key]!=null).slice(0,8).map(c=>`<span class="${Chars.base(c.traits[t.key])?"":"g"}">${esc(c.emoji)} ${esc(c.name)}: ${esc(Chars.levelName(t,Chars.base(c.traits[t.key])))}</span>`).join("")}</div></div>`).join("")}</div>`;}
const ACAD=()=>F.acad&&(L.age==null||L.age>=16);
const GROUPS=[["Emotions","emotion",x=>x.kind==="emotion"],["Manipulation tactics","tactic",x=>x.kind==="tactic"],["Issues & behaviours","",x=>x.kind==="issue"||x.kind==="behaviour"],
  ["Conditions","",x=>x.kind==="condition"],["Personality disorders · Cluster A (odd, eccentric)","",x=>x.kind==="disorder"&&x.cluster==="A"],["Personality disorders · Cluster B (dramatic, emotional)","",x=>x.kind==="disorder"&&x.cluster==="B"],
  ["Personality disorders · Cluster C (anxious, fearful)","",x=>x.kind==="disorder"&&x.cluster==="C"],["Ideas & dark traits","",x=>x.kind==="idea"||(x.kind==="disorder"&&!x.cluster)]];
function condCard(x,sub){const sg=(L.CS[x.key]||[]),who=L.chars.filter(c=>(c.conditions||[]).includes(x.key)),kids=L.conditions.filter(y=>y.parent===x.key);
  return `<div class="ccard${sub?" sub":""}" id="k-${x.key}"><span class="kind">${KIND[x.kind]||x.kind}${x.cluster?` · Cluster ${x.cluster}`:""}${x.min_age?` · ${x.min_age}+`:""}${x.parent&&L.C[x.parent]?` · a kind of ${esc(L.C[x.parent].name)}`:""}</span>
    <h3>${esc(x.icon)} ${esc(x.name)}${x.aliases&&x.aliases.length?` <small class="muted">(${esc(x.aliases.join(", "))})</small>`:""}</h3>
    ${x.about?`<p style="margin:0;white-space:pre-line">${esc(x.about)}</p>`:""}
    ${ACAD()&&x.academic&&(L.age==null||L.age>=(x.academic_min_age||16))?`<div class="acad"><b>🎓 Academic</b><span>${esc(x.academic)}</span>${(x.sources||[]).length?`<ol>${x.sources.map(z=>`<li>${esc(z)}</li>`).join("")}</ol>`:""}</div>`:""}
    ${sg.length?`<div><b>🔎 Signs</b> <small class="muted">how typical: 🔴 core · 🟠 often · ⚪ sometimes</small><div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px">${sg.map(z=>{const g=L.S[z.sign];return `<button type="button" class="sg w${z.weight}" data-sign="${g.key}" title="${Chars.WEIGHT[z.weight]}">${esc(g.icon)} ${esc(g.name)}</button>`;}).join("")}</div></div>`:""}
    ${painHTML(x)}
    ${x.helps?`<div>🤝 <b>What helps:</b> ${esc(x.helps)}</div>`:""}
    ${(()=>{const fr=into("condition",x.key,"raises"),pr=into("condition",x.key,"lowers"),to=outOf("condition",x.key);
      return (fr.length?`<div><b>🌱 Grows from:</b> ${fr.map(l=>chipOf(lk(l,"src"))).join(" ")}</div>`:"")+(pr.length?`<div><b>🛡️ Protected by:</b> ${pr.map(l=>chipOf(lk(l,"src"),"prot")).join(" ")}</div>`:"")+(to.length?`<div><b>➡️ Can lead to:</b> ${to.map(l=>chipOf(lk(l,"dst"))).join(" ")}</div>`:"");})()}
    ${(()=>{const a=Chars.advOf("condition",x.key);return a.length?`<div><b>📜 Advice from sayings</b>${quotes(a)}</div>`:"";})()}
    ${(x.traits||[]).length?`<div class="ch-mini">${x.traits.map(k=>L.T[k]?`<span>${esc(L.T[k].icon)} ${esc(L.T[k].name)}</span>`:"").join("")}</div>`:""}
    ${who.length?`<div class="muted" style="font-size:.85rem">🎭 In stories: ${who.map(c=>`<button type="button" class="linkb" data-open="${c.id}">${esc(c.emoji)} ${esc(c.name)} ${Chars.dots(Chars.lvl(c,x.key))}</button>`).join(" · ")}</div>`:""}</div>
    ${kids.map(y=>condCard(y,true)).join("")}`;}
function drawConds(){const top=L.conditions.filter(x=>!x.parent||!L.C[x.parent]);
  return `<p class="muted">Characters can show these with a strength (● mild · ●● clear · ●●● strong). In a story, only a 🩺 doctor character gives a diagnosis; a 🦉 wise character can explain. More open up with age${L.age!=null&&L.age<16?"":"; 🎓 academic notes are for 16+"}.</p>
    ${GROUPS.map(([g,,f])=>{const xs=top.filter(f);return xs.length?`<h2 class="grp">${esc(g)} <small>${xs.length}</small></h2><div style="display:grid;gap:10px">${xs.map(x=>condCard(x)).join("")}</div>`:"";}).join("")}`;}
const RKIND={fear:"Fear",learned:"Learned",situation:"Situation",trauma:"Something that happened",born:"From birth"};
const chipOf=(x,cls)=>`<span class="chip ${cls||(x.t==="root"?"root":x.t==="condition"?"cond":"")}">${esc(Chars.label(x.t,x.k,x.lv))}</span>`;
// Arabic sayings keep their original words under the English
const ARQ=/Arabic|Shafi|Mutanabbi|Ma'arri|Ali ibn|Zuhayr|Antara|Meri|Dostoevsky/i,orig=q=>q.translation&&ARQ.test(q.author||"")?`<span dir="rtl" lang="ar" style="display:block;font:700 1rem/1.6 var(--f-body);white-space:pre-line;margin-top:3px">${esc(q.translation.replace(/ \.\.\. /g,"  ·  "))}</span>`:"";
const quotes=qs=>qs.length?`<div class="adv">${qs.map(q=>`<blockquote>“${esc(q.headword)}”${orig(q)}${q.author?`<small>${esc(q.author)}</small>`:""}</blockquote>`).join("")}</div>`:"";
const into=(t,k,eff)=>L.links.filter(l=>l.dst_type===t&&l.dst_key===k&&l.effect===eff&&Chars.lib&&(l.src_type==="trait"?L.T[l.src_key]:l.src_type==="root"?L.RT[l.src_key]:l.src_type==="sign"?L.S[l.src_key]:L.C[l.src_key])).sort((a,b)=>b.strength-a.strength);
const outOf=(t,k)=>L.links.filter(l=>l.src_type===t&&l.src_key===k&&l.effect==="raises"&&(l.dst_type==="trait"?L.T[l.dst_key]:l.dst_type==="sign"?L.S[l.dst_key]:L.C[l.dst_key])).sort((a,b)=>b.strength-a.strength);
const lk=(l,side)=>({t:l[side+"_type"],k:l[side+"_key"],lv:l[side+"_level"]});
function drawRoots(){return `<p class="muted">Many problems grow from <b>fear and insecurity</b>; some from habits that were <b>learned</b>, hard <b>situations</b>, something terrible that <b>happened</b>, a brain that is <b>different from birth</b>, or even from <b>too little fear</b>. Being <b>secure</b> (the 🌟 golden middle, not hard) protects.</p>
  <div style="display:grid;gap:10px">${L.roots.map(r=>{const g=outOf("root",r.key),who=L.chars.filter(c=>(c.roots||{})[r.key]>0);return `<div class="rcard" id="r-${r.key}"><span class="kind" style="color:#15803d">${RKIND[r.kind]||r.kind}${r.min_age?` · ${r.min_age}+`:""}</span><h3>${esc(r.icon)} ${esc(r.name)}</h3><p style="margin:0">${esc(r.about||"")}</p>
    ${g.length?`<div><b>➡️ Can grow into:</b> ${g.map(l=>chipOf(lk(l,"dst"))+`<small>${Chars.dots(l.strength)}</small>`).join(" ")}</div>`:""}
    ${r.protects?`<div><b>🛡️ What protects:</b> ${esc(r.protects)}</div>`:""}
    ${ACAD()&&r.academic?`<div class="acad"><b>🎓 Academic</b><span>${esc(r.academic)}</span>${(r.sources||[]).length?`<ol>${r.sources.map(z=>`<li>${esc(z)}</li>`).join("")}</ol>`:""}</div>`:""}
    ${quotes(Chars.advOf("root",r.key))}
    ${who.length?`<div class="muted" style="font-size:.85rem">🎭 In stories: ${who.map(c=>`<button type="button" class="linkb" data-open="${c.id}">${esc(c.emoji)} ${esc(c.name)} ${Chars.dots(c.roots[r.key])}</button>`).join(" · ")}</div>`:""}</div>`;}).join("")}</div>`;}
// 💔 pain: the core (المحور), their own pain, what they do with other people's pain, and how to protect yourself or help
const HARM=[["self","🪞 For the ego","They hurt others for their own sake or their image; the pain is not the goal."],["goal","🎯 As a tool","Your pain doesn't stop them when they want something."],
  ["pleasure","🖤 For pleasure","The suffering itself is the reward."],["storm","🌪️ In their own storm","They don't aim to hurt, but people get hurt when their pain or fear explodes."],
  ["cold","🧊 By distance","They hurt by coldness or absence, not on purpose."],["inside","🫀 Mostly inside","The pain is mostly their own; they rarely hurt others."]];
const painHTML=x=>x.core?`<div class="pain"><b>💔 Pain</b><span>🎯 <b>Core (المحور):</b> ${esc(x.core)}${x.core_ar?` · <span dir="rtl">${esc(x.core_ar)}</span>`:""}</span>${x.own_pain?`<span>🙋 <b>Their own pain:</b> ${esc(x.own_pain)}</span>`:""}<span>👥 <b>With your pain:</b> ${esc(x.others_pain||"")}</span>${x.others_pain_ar?`<span dir="rtl" class="muted">${esc(x.others_pain_ar)}</span>`:""}${x.protect?`<span>🛡️ <b>Protect yourself / help:</b> ${esc(x.protect)}</span>`:""}</div>`:"";
function drawPain(){const xs=L.conditions.filter(x=>x.core);
  return `<p class="muted">The same word, <b>pain</b>, means very different things in different personalities. A 🩺 doctor or 🦉 wise character can use this to understand someone: what hurts them, what they do with other people's pain, and the <b>core</b> (المحور) everything turns around.</p>
    ${HARM.map(([h,t,d])=>{const g=xs.filter(x=>x.harm===h);return g.length?`<h2 class="grp">${t} <small>${esc(d)}</small></h2><div style="display:grid;gap:8px">${g.map(x=>`<div class="ccard" style="border-left-color:${h==="inside"||h==="cold"?"#38bdf8":h==="storm"?"#f59e0b":"#ef4444"}"><h3><button type="button" class="linkb" data-cond="${x.key}">${esc(x.icon)} ${esc(x.name)}</button></h3>${painHTML(x)}</div>`).join("")}</div>`:"";}).join("")}`;}
const SCAT=[["self","🪞 How they see themselves"],["feelings","💓 Feelings"],["thinking","🧠 Thinking"],["relationships","👥 With others"],["behaviour","🏃 What they do"],["tactics","🎭 Tactics"]];
function drawSigns(){const q=(F.sq||"").toLowerCase(),inC=k=>L.conditions.filter(x=>(L.CS[x.key]||[]).some(z=>z.sign===k));
  return `<div class="ch-filters"><input type="search" id="sq" placeholder="Search signs" value="${esc(F.sq||"")}"></div>
    ${SCAT.map(([c,l])=>{const xs=L.signs.filter(g=>g.category===c&&(!q||(g.name+" "+(g.about||"")+" "+(g.academic||"")).toLowerCase().includes(q)));return xs.length?`<h2 class="grp">${l} <small>${xs.length}</small></h2><div class="sgrid">${xs.map(g=>`<div class="scard" id="s-${g.key}"><b>${esc(g.icon)} ${esc(g.name)}</b>${g.about?`<span>${esc(g.about)}</span>`:""}${ACAD()&&g.academic?`<span class="muted" style="font-size:.85rem">🎓 ${esc(g.academic)}</span>`:""}
      ${(()=>{const fr=into("sign",g.key,"raises"),a=Chars.advOf("sign",g.key);return (fr.length?`<span style="font-size:.82rem">🌱 ${fr.map(l=>chipOf(lk(l,"src"))).join(" ")}</span>`:"")+quotes(a);})()}
      <span style="font-size:.8rem">${inC(g.key).map(x=>`<button type="button" class="linkb" data-cond="${x.key}">${esc(x.icon)} ${esc(x.name)}</button>`).join(" · ")}</span></div>`).join("")}</div>`:"";}).join("")}`;}
function draw(){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===TAB));
  $("pane").innerHTML=TAB==="c"?drawChars():TAB==="t"?drawTraits():TAB==="r"?drawRoots():TAB==="p"?drawPain():TAB==="s"?drawSigns():drawConds();
  $("acad").innerHTML=L.age==null||L.age>=16?`<label style="font:800 .85rem var(--f-body);display:flex;gap:6px;align-items:center"><input type="checkbox" id="acadT"${F.acad?" checked":""}> 🎓 Academic view</label>`:"";
  const sq=$("sq");if(sq)sq.oninput=()=>{F.sq=sq.value;const p=sq.selectionStart;draw();$("sq").focus();$("sq").setSelectionRange(p,p);};
  const q=$("q");if(q)q.oninput=()=>{F.q=q.value;const p=q.selectionStart;draw();$("q").focus();$("q").setSelectionRange(p,p);};}
function openChar(id){const c=L.chars.find(x=>x.id===id);if(!c)return;const d=$("dlg");
  d.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">${Chars.card(c)}<div style="display:flex;gap:6px">${EDITOR?`<button class="btn small" data-edit="${c.id}">✏️ Edit</button>`:""}<button class="btn small" data-close="1">✕</button></div></div>
    <div class="meters">${L.traits.filter(t=>c.traits&&c.traits[t.key]!=null).map(t=>Chars.meter(t,c.traits[t.key])).join("")||`<p class="muted">No personality set yet.</p>`}</div>
    ${(c.conditions||[]).filter(k=>L.C[k]).length?`<h3 style="margin:14px 0 6px">🩺 Conditions, tactics &amp; feelings</h3>${c.conditions.filter(k=>L.C[k]).map(k=>`<button type="button" class="linkb" data-cond="${k}" style="display:block;width:100%">${Chars.strengthRow(L.C[k].icon,L.C[k].name,Chars.lvl(c,k),KIND[L.C[k].kind]+(L.C[k].core?" · core: "+L.C[k].core:""))}</button>`).join("")}`:""}
    ${Object.keys(c.roots||{}).filter(k=>L.RT[k]&&c.roots[k]>0).length?`<h3 style="margin:14px 0 6px">🌱 Underneath (roots)</h3>${Object.entries(c.roots).filter(([k,n])=>L.RT[k]&&n>0).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button type="button" class="linkb" data-root="${k}" style="display:block;width:100%">${Chars.strengthRow(L.RT[k].icon,L.RT[k].name,n,RKIND[L.RT[k].kind])}</button>`).join("")}`:""}
    ${(()=>{const A=Chars.analyse(c);let h="";
      if(A.why.length)h+=`<h3 style="margin:14px 0 6px">🧭 Why are they like this?</h3><div class="why">${A.why.map(w=>`<div class="w"><b>${esc(Chars.label(w.t,w.k))}</b> <small>${Chars.dots(w.n)}</small> <span class="arrow">⬅ grows from</span> ${w.from.map(f=>chipOf(f)).join("")}${w.from.find(f=>f.note)?`<div class="muted" style="font-size:.82rem">💡 ${esc(w.from.find(f=>f.note).note)}</div>`:""}</div>`).join("")}</div>`;
      if(A.risks.length)h+=`<h3 style="margin:14px 0 6px">⚠️ Could grow into, if nothing changes</h3><div class="why">${A.risks.map(r=>`<div class="w"><b>${esc(Chars.label(r.t,r.k))}</b> <span class="arrow">⬅</span> ${r.from.map(f=>chipOf(f)).join("")}${r.against.length?`<div style="font-size:.82rem">🛡️ held back by ${r.against.map(f=>chipOf(f,"prot")).join("")}</div>`:""}</div>`).join("")}</div>`;
      if(A.protects.length||A.helps.length)h+=`<h3 style="margin:14px 0 6px">🛡️ What protects them · what would help</h3><div class="why">${A.protects.length?`<div class="w">✅ Already protecting them: ${[...new Map(A.protects.map(p=>[p.src.k+p.src.lv,p])).values()].map(p=>chipOf(p.src,"prot")+`<small>against ${esc(Chars.label(p.dst.t,p.dst.k))}</small>`).join(" ")}</div>`:""}
        ${A.helps.filter(x=>x.src).map(x=>`<div class="w">${chipOf(x.src,"prot")} would help against <b>${esc(Chars.label(x.dst.t,x.dst.k))}</b></div>`).join("")}${A.helps.filter(x=>x.root).map(x=>`<div class="w">🌱 For <b>${esc(x.root.name)}</b>: ${esc(x.root.protects||"")}</div>`).join("")}</div>`;
      if(A.advice.length)h+=`<h3 style="margin:14px 0 6px">📜 Advice a wise character could give</h3><div class="adv">${A.advice.map(a=>`<blockquote>“${esc(a.q.headword)}”${orig(a.q)}<small>${a.q.author?esc(a.q.author)+" · ":""}for ${esc(a.for)}</small></blockquote>`).join("")}</div>`;
      return h;})()}
    ${Object.keys(c.signs||{}).filter(k=>L.S[k]&&c.signs[k]>0).length?`<h3 style="margin:14px 0 6px">🔎 Signs</h3>${Object.entries(c.signs).filter(([k,n])=>L.S[k]&&n>0).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button type="button" class="linkb" data-sign="${k}" style="display:block;width:100%">${Chars.strengthRow(L.S[k].icon,L.S[k].name,n)}</button>`).join("")}`:""}`;
  d.showModal();}
// ---- parents: add and edit characters ----
function editChar(id){const c=id?L.chars.find(x=>x.id===id):{name:"",emoji:"🙂",age:10,sex:"female",education:"primary",role:"friend",bio:"",traits:{},conditions:[],min_age:0};const d=$("dlg");
  const tv=k=>c.traits&&c.traits[k]!=null?c.traits[k]:null;
  d.innerHTML=`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${id?"✏️ Edit":"＋ New"} character</h2><button class="btn small" data-close="1">✕</button></div>
  <div class="form" id="cf" style="margin-top:10px"><label>Name<input data-f="name" maxlength="40" value="${esc(c.name)}"></label><label>Emoji<input data-f="emoji" maxlength="8" value="${esc(c.emoji)}"></label>
    <label>Age<input data-f="age" type="number" min="0" max="150" value="${c.age??""}"></label><label>Sex<select data-f="sex">${["female","male","other"].map(s=>`<option${c.sex===s?" selected":""}>${s}</option>`).join("")}</select></label>
    <label>Education<select data-f="education">${["none","kindergarten","primary","middle","high","university","doctorate"].map(s=>`<option${c.education===s?" selected":""}>${s}</option>`).join("")}</select></label>
    <label>Role<select data-f="role">${L.roles.map(r=>`<option value="${r.key}"${c.role===r.key?" selected":""}>${r.icon} ${esc(r.name)}</option>`).join("")}</select></label>
    <label>Youngest age to see them<input data-f="min_age" type="number" min="0" max="21" value="${c.min_age||0}"></label>
    <label class="wide">About them<textarea data-f="bio" rows="2" maxlength="300">${esc(c.bio||"")}</textarea></label></div>
  <h3 style="margin:14px 0 4px">Personality</h3><p class="muted" style="margin:0">Leave a trait off if it doesn't matter for this character. 🌟 0 is the golden middle.</p>
  <div id="tf">${L.traits.map(t=>{const v=tv(t.key),b=v==null?0:Chars.base(v),pl=Object.fromEntries(Chars.byPlace(v));
    return `<div class="trow" data-t="${t.key}"><label style="display:flex;gap:6px;align-items:center;font-weight:800"><input type="checkbox" data-on${v!=null?" checked":""}> ${esc(t.icon)} ${esc(t.name)}</label>
      <div class="r"><input type="range" min="-2" max="2" step="1" value="${b}" data-b aria-label="${esc(t.name)}"><span class="lv" data-lv>${esc(Chars.levelName(t,b))}</span>
      ${t.varies_by_place?`<details${Object.keys(pl).length?" open":""}><summary class="lv">📍 Different in some places</summary><div class="plc">${L.places.map(p=>`<label>${esc(p.icon)} ${esc(p.name)}<select data-pl="${p.key}"><option value="">same</option>${[-2,-1,0,1,2].map(n=>`<option value="${n}"${pl[p.key]===n?" selected":""}>${esc(Chars.levelName(t,n))}</option>`).join("")}</select></label>`).join("")}</div></details>`:""}</div></div>`;}).join("")}</div>
  <h3 style="margin:14px 0 4px">🌱 Roots underneath</h3><div class="sgrid">${L.roots.map(r=>{const n=+((c.roots||{})[r.key]||0);return `<div class="srow"><span>${esc(r.icon)} ${esc(r.name)} <small class="muted">${RKIND[r.kind]}</small></span><select data-r="${r.key}">${[0,1,2,3].map(v=>`<option value="${v}"${v===n?" selected":""}>${v?Chars.dots(v):"—"}</option>`).join("")}</select></div>`;}).join("")}</div>
  <h3 style="margin:14px 0 4px">🩺 Conditions, tactics &amp; feelings</h3><p class="muted" style="margin:0">How strong for this character: ● mild · ●● clear · ●●● strong.</p>
  <div class="sgrid" id="cfc">${L.conditions.map(x=>{const n=(c.conditions||[]).includes(x.key)?Chars.lvl(c,x.key):0;return `<div class="srow"><span>${esc(x.icon)} ${esc(x.name)} <small class="muted">${KIND[x.kind]} · ${x.min_age}+</small></span><select data-c="${x.key}">${[0,1,2,3].map(v=>`<option value="${v}"${v===n?" selected":""}>${v?Chars.dots(v):"—"}</option>`).join("")}</select></div>`;}).join("")}</div>
  <button type="button" class="btn small" data-fillsigns="1" style="margin-top:8px">＋ Add the usual signs of the chosen ones</button>
  <h3 style="margin:14px 0 4px">🔎 Signs</h3>
  ${SCAT.map(([cat,l])=>`<details${L.signs.some(g=>g.category===cat&&(c.signs||{})[g.key]>0)?" open":""}><summary class="lv" style="font-weight:800;cursor:pointer">${l}</summary><div class="sgrid">${L.signs.filter(g=>g.category===cat).map(g=>{const n=+((c.signs||{})[g.key]||0);return `<div class="srow"><span>${esc(g.icon)} ${esc(g.name)} <small class="muted">${g.min_age}+</small></span><select data-s="${g.key}">${[0,1,2,3].map(v=>`<option value="${v}"${v===n?" selected":""}>${v?Chars.dots(v):"—"}</option>`).join("")}</select></div>`;}).join("")}</div></details>`).join("")}
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" data-save="${id||""}">Save</button>${id?`<button class="btn" data-del="${id}">🗑️ Remove</button>`:""}</div>`;
  d.querySelectorAll("[data-t]").forEach(r=>{const t=L.T[r.dataset.t];r.querySelector("[data-b]").oninput=e=>{r.querySelector("[data-on]").checked=true;r.querySelector("[data-lv]").textContent=Chars.levelName(t,+e.target.value);};});
  if(!d.open)d.showModal();}
async function saveChar(id){const d=$("dlg"),g=k=>d.querySelector(`[data-f="${k}"]`).value.trim(),traits={};
  d.querySelectorAll("[data-t]").forEach(r=>{if(!r.querySelector("[data-on]").checked)return;const b=+r.querySelector("[data-b]").value,pl={};
    r.querySelectorAll("[data-pl]").forEach(s=>{if(s.value!=="")pl[s.dataset.pl]=+s.value;});traits[r.dataset.t]=Object.keys(pl).length?{all:b,...pl}:b;});
  const cond_levels={},signs={},roots={};d.querySelectorAll("[data-r]").forEach(x=>{if(+x.value)roots[x.dataset.r]=+x.value;});d.querySelectorAll("[data-c]").forEach(x=>{if(+x.value)cond_levels[x.dataset.c]=+x.value;});d.querySelectorAll("[data-s]").forEach(x=>{if(+x.value)signs[x.dataset.s]=+x.value;});
  const conditions=Object.keys(cond_levels),need=Math.max(0,...conditions.map(k=>L.C[k].min_age),...Object.keys(signs).map(k=>L.S[k].min_age));
  const row={name:g("name"),emoji:g("emoji")||"🙂",age:g("age")===""?null:+g("age"),sex:g("sex"),education:g("education"),role:g("role"),bio:g("bio"),traits,conditions,cond_levels,signs,roots,min_age:Math.max(+g("min_age")||0,need)};
  if(!row.name){App.status("Give the character a name",false);return;}
  const r=id?await App.client.from("characters").update(row).eq("id",id).select().single():await App.client.from("characters").insert({...row,created_by:App.user.id}).select().single();
  if(r.error){App.status("Not saved: "+r.error.message,false);return;}
  if(row.min_age>(+g("min_age")||0))App.status(`Saved. Shown from age ${row.min_age}, because of the conditions chosen.`,true);else App.status("Saved",true);
  await Chars.load(true);L=Chars.lib;d.close();draw();}
document.addEventListener("click",async e=>{const t=e.target;
  const tb=t.closest("[data-tab]");if(tb){TAB=tb.dataset.tab;draw();return;}
  if(t.id==="acadT"){F.acad=t.checked;try{localStorage.setItem("chAcad",F.acad?"1":"0");}catch(x){}draw();return;}
  if(t.closest("[data-fillsigns]")){const d=$("dlg");d.querySelectorAll("[data-c]").forEach(x=>{const n=+x.value;if(!n)return;(L.CS[x.dataset.c]||[]).filter(z=>z.weight>=2).forEach(z=>{const s2=d.querySelector(`[data-s="${z.sign}"]`);if(s2&&!+s2.value){s2.value=String(Math.min(3,n));s2.closest("details").open=true;}});});App.status("Signs added: adjust their strength",true);return;}
  const rr=t.closest("[data-root]");if(rr){if($("dlg").open)$("dlg").close();TAB="r";draw();const el=$("r-"+rr.dataset.root);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});return;}
  const sgn=t.closest("[data-sign]");if(sgn){if($("dlg").open)$("dlg").close();TAB="s";F.sq="";draw();const el=$("s-"+sgn.dataset.sign);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.outline="3px solid var(--accent)";}return;}
  const r=t.closest("[data-role]");if(r&&!t.closest("dialog")){F.role=r.dataset.role;draw();return;}
  const o=t.closest("[data-open]");if(o){openChar(o.dataset.open);return;}
  if(t.closest("[data-close]")){$("dlg").close();return;}
  const cd=t.closest("[data-cond]");if(cd){$("dlg").close();TAB="k";draw();const el=$("k-"+cd.dataset.cond);if(el)el.scrollIntoView({behavior:"smooth"});return;}
  if(t.closest("[data-new]")){editChar(null);return;}
  const ed=t.closest("[data-edit]");if(ed){editChar(ed.dataset.edit);return;}
  const sv=t.closest("[data-save]");if(sv){saveChar(sv.dataset.save||null);return;}
  const dl=t.closest("[data-del]");if(dl){const c=L.chars.find(x=>x.id===dl.dataset.del);if(!confirm(`Remove ${c.name} from the library? Stories that already use them keep their copy.`))return;
    const {error}=await App.client.from("characters").delete().eq("id",c.id);if(error){App.status("Not removed: "+error.message,false);return;}await Chars.load(true);L=Chars.lib;$("dlg").close();draw();App.status("Removed",true);}});
App.requireUser().then(async()=>{try{L=await Chars.load();}catch(e){$("pane").innerHTML=`<div class="empty">Could not load the characters.</div>`;return;}
  EDITOR=App.profile&&(App.profile.role==="teacher"||App.profile.is_admin);
  if(EDITOR)$("acts").innerHTML=`<button class="btn primary" data-new="1">＋ New character</button>`;draw();});
</script></body></html>
