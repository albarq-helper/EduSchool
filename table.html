<style>
:root{
  --paper:#F7F8FB; --sheet:#FFFFFF; --ink:#1B2333; --muted:#5E6A80; --rule:#DCE1EA;
  --accent:#2347C5; --accent-soft:#E6ECFB; --chip:#FFF3D6; --chip-edge:#E7B84A;
  --s1:#2347C5; --s2:#B5532A; --s3:#1E7F4F; /* syllable colours */
  --good:#1E7F4F; --good-soft:#E3F4EA; --bad:#B8322A; --bad-soft:#FBE7E5;

}

  --accent:#7D9BFF; --accent-soft:#1F2846; --chip:#3A3020; --chip-edge:#B8913A;
  --s1:#8FA8FF; --s2:#F0A070; --s3:#6FD8A0;
  --good:#5FD196; --good-soft:#173326; --bad:#FF8A80; --bad-soft:#3A1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141B; --sheet:#181C25; --ink:#E7EAF1; --muted:#9AA4B8; --rule:#2B3140;
  --accent:#7D9BFF; --accent-soft:#1F2846; --chip:#3A3020; --chip-edge:#B8913A;
  --s1:#8FA8FF; --s2:#F0A070; --s3:#6FD8A0;
  --good:#5FD196; --good-soft:#173326; --bad:#FF8A80; --bad-soft:#3A1D1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
header{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:700 .95rem var(--f-body);padding:9px 13px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.tab .n{font:800 .85rem var(--f-display);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--sheet)}
.bar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar .left{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{font:700 .95rem var(--f-body);border-radius:8px;padding:9px 15px;cursor:pointer;border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--sheet)}
.btn.small{padding:6px 11px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.rt{position:relative;width:min(100%,600px);aspect-ratio:1;margin:0 auto}
.tbl{position:absolute;inset:17%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9a066,#a8693a 70%,#8d5530);box-shadow:inset 0 0 0 8px #b77a46,inset 0 0 40px #0004,0 14px 30px #0003}
.cc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36%;aspect-ratio:1;border-radius:50%;background:var(--sheet);border:3px solid var(--ink);display:grid;place-items:center;text-align:center;padding:8px;z-index:3;box-shadow:0 6px 18px #0004}
.cc .em{font-size:clamp(1.6rem,7vw,2.6rem);line-height:1}.cc .w{font:800 clamp(1rem,4.6vw,1.7rem)/1.1 var(--f-display);overflow-wrap:anywhere}
.cc .hear{all:unset;cursor:pointer;font-size:1.1rem;border-radius:50%;padding:2px 6px;background:var(--accent-soft)}
.ptr{position:absolute;left:50%;top:50%;width:41%;height:0;transform-origin:0 50%;z-index:2;transition:transform 1.9s cubic-bezier(.2,.75,.15,1)}
.ptr b{position:absolute;left:18%;right:4%;top:-7px;height:14px;border-radius:7px;background:linear-gradient(90deg,#f59e0b,#ef4444);box-shadow:0 2px 6px #0005}
.ptr b::after{content:"";position:absolute;right:-18px;top:-10px;border-left:26px solid #ef4444;border-top:17px solid transparent;border-bottom:17px solid transparent}
.seat{position:absolute;transform:translate(-50%,-50%);width:24%;display:grid;gap:2px;justify-items:center;text-align:center;z-index:4;transition:transform .4s}
.seat .av{width:clamp(46px,13vw,78px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(1.5rem,6vw,2.6rem);background:var(--sheet);border:4px solid var(--ring,#888);box-shadow:0 4px 10px #0003;transition:transform .4s,box-shadow .4s}
.seat .nm{font:800 .78rem/1.15 var(--f-display);background:var(--sheet);border-radius:999px;padding:2px 8px;border:1.5px solid var(--rule)}
.seat .say{font:800 clamp(.85rem,3.4vw,1.2rem)/1.2 var(--f-display);background:#fff;color:#111;border:2px solid var(--good);border-radius:12px;padding:3px 8px;min-height:0;max-width:160px;box-shadow:0 4px 12px #0003}
.seat .say:empty{display:none}.seat.on .av{transform:scale(1.18);box-shadow:0 0 0 6px #fbbf2499,0 6px 18px #0004}.seat.dim{opacity:.55}
.seat.on{z-index:6}
.ask{text-align:center;font:700 1.15rem/1.35 var(--f-display);min-height:3em}.ask b{font-weight:800}
.ctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.mic{font:800 1.1rem var(--f-display);border:0;border-radius:999px;padding:14px 26px;background:#dc2626;color:#fff;cursor:pointer;box-shadow:0 6px 16px #dc262655}
.mic.live{animation:pulse 1s infinite}.mic:disabled{opacity:.45;cursor:not-allowed;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 12px #dc262633}}
.fb{text-align:center;min-height:2.6em;font:700 1.05rem/1.35 var(--f-body)}.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.score{display:flex;gap:14px;justify-content:center;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.res{display:grid;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;text-align:center}
.res .big{font-size:clamp(1.6rem,6vw,2.4rem)}.mlist{display:grid;gap:6px;text-align:left}.mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;border-top:1px solid var(--rule);padding-top:6px}.mrow b{min-width:7em}.mrow span{background:var(--accent-soft);border-radius:999px;padding:1px 9px;font-weight:700}
@media (prefers-reduced-motion:reduce){.ptr{transition:none}.mic.live{animation:none}}
.rootbar{display:grid;gap:6px;margin:6px 0}.rootchk{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}.rootchk small{font-weight:500;color:var(--muted)}
.mustbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--accent-soft);border-radius:12px}.mustbox label{display:inline-flex;gap:5px;align-items:center;background:#fff;border:1.5px solid var(--rule);border-radius:999px;padding:3px 10px;font-weight:700;cursor:pointer}
.seat.out{opacity:.22;filter:grayscale(1)}
</style>
<div class="wrap">
  <header>
    <span class="eyebrow" id="setEyebrow">&nbsp;</span>
    <h1>🌍 Around the table</h1>
    <p class="sub">Friends from different countries sit around a table. An English word appears and the arrow points at one friend. Say the word in <b>their</b> language, from memory!</p>
  </header>
  <div class="bar">
    <div class="left"><label for="unitSel" class="eyebrow">Words</label><select id="unitSel"></select>
      <label for="levelSel" class="eyebrow">Level</label><select id="levelSel"><option value="easy">🌱 Easy: listen and repeat</option><option value="mid">🌿 Middle: listen to all, then you</option><option value="hard">🌳 Hard: from memory</option></select>
      <label for="roundsSel" class="eyebrow">Words</label><select id="roundsSel"><option>3</option><option>5</option><option>8</option><option>10</option><option>15</option><option>20</option></select></div>
    <button class="btn primary" id="go">Start the game</button>
  </div>
  <div class="rootbar"><label class="rootchk"><input type="checkbox" id="rootOnly"> 🌱 Only words that share a root with other languages <small>(like <i>lethargic</i> and <i>léthargique</i>)</small></label>
    <div id="mustBox" class="mustbox" hidden><span class="hint">Always invite, even when the word does not share a root:</span> <span id="mustList"></span></div></div>
  <p class="hint" id="lvlHint"></p>
  <div id="stage"></div>
</div>
<script type="text/x-app">
const DATA=window.WORDS,UNITS=window.UNITS_LIST||[];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=w=>String(w||"").replace(/\s*\(.*\)\s*$/,"");
const FACE={ar:"👩🏽",fr:"👨🏼",it:"👩🏻",es:"👦🏽",pt:"👧🏾",zh:"🧑🏻"},RING=["#2347c5","#b5532a","#1e7f4f","#a855f7","#e11d48","#0891b2","#ca8a04","#475569"];
const has=(v,c)=>{const t=v.trs&&v.trs[c];return !!(t&&t.term);};
// does this language's word come from the same root as the English word? (same rule as the look-alike lines: not a false friend, and related or at least 40% alike)
const root=(v,c)=>{const t=v.trs&&v.trs[c];return !!(t&&t.term&&t.root_en&&t.root_kind!=="false_friend"&&(t.root_kind==="related"||(t.root_sim!=null&&t.root_sim>=40)));};
let ROOTONLY=false,MUST=new Set();
const friends=v=>LANGS.filter(L=>has(v,L.code)&&(!ROOTONLY||root(v,L.code)||MUST.has(L.code)));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let LANGS=[],QUEUE=[],PLANS=[],q=0,score=0,total=0,missed=[],cur=null,angle=0,lastCode="",micOK=!!SR,busy=false,STEPS=[],si=0,LEVEL="easy",tok=0;
const HINT={easy:"🌱 Easy: each friend says the word, then it's your turn to say it back, friend by friend.",mid:"🌿 Middle: every friend says the word first. Then you say it for each friend, in the same order.",hard:"🌳 Hard: nobody helps. The arrow points at a friend and you say it from memory."};
const DEF={easy:3,mid:5,hard:10};
const seatXY=(k,n)=>{const a=(-90+360*k/n)*Math.PI/180;return[50+41*Math.cos(a),50+41*Math.sin(a),-90+360*k/n];};
function pool(){const u=$("#unitSel").value;return DATA.map((v,i)=>i).filter(i=>(u==="all"||String(DATA[i].u)===u)&&(ROOTONLY?LANGS.some(L=>root(DATA[i],L.code)):LANGS.some(L=>has(DATA[i],L.code))));}
function table(){const n=LANGS.length;
  return `<div class="rt" id="rt"><div class="tbl"></div><div class="ptr" id="ptr" style="transform:rotate(${angle}deg)"><b></b></div>
  <div class="cc" id="cc"></div>${LANGS.map((L,k)=>{const[x,y]=seatXY(k,n);return `<div class="seat" id="s-${L.code}" style="left:${x}%;top:${y}%;--ring:${RING[k%RING.length]}"><div class="av" aria-hidden="true">${FACE[L.code]||"🙂"}</div><div class="nm">${L.flag||""} ${esc(L.native_name)}</div><div class="say" lang="${L.tts_lang||L.code}" dir="${L.dir||"ltr"}"></div></div>`;}).join("")}</div>`;}
function ui(){$("#stage").innerHTML=`<div class="score" id="score"></div>${table()}<div class="ask" id="ask"></div><div class="ctl" id="ctl"></div><div class="fb" id="fb" aria-live="polite"></div>`;}
function setScore(){$("#score").innerHTML=`<span>Word ${Math.min(q+1,QUEUE.length)} / ${QUEUE.length}</span><span>⭐ ${score} / ${total}</span>`;}
function plan(v){const fr=friends(v);
  if(LEVEL==="hard"){const ok=fr.filter(L=>L.code!==lastCode),pk=ok.length?ok:fr,L=pk[Math.floor(Math.random()*pk.length)];lastCode=L.code;return[{c:L.code,m:"say"}];}
  if(LEVEL==="easy")return fr.flatMap(L=>[{c:L.code,m:"hear"},{c:L.code,m:"say"}]);
  return fr.map(L=>({c:L.code,m:"hear"})).concat(fr.map(L=>({c:L.code,m:"say"})));}
function start(list){LANGS=Lang.mine().filter(L=>DATA.filter(v=>has(v,L.code)).length>=6);
  if(LANGS.length<2){$("#stage").innerHTML=`<div class="res"><b>Not enough translations yet</b><span class="hint">This game needs a set where the words have translations in at least two languages. Open “🌍 My languages” on the Word list to choose yours.</span></div>`;return;}
  LEVEL=$("#levelSel").value;ROOTONLY=$("#rootOnly").checked;MUST=new Set([...document.querySelectorAll("#mustList input:checked")].map(x=>x.value));const base=list||shuffle(pool());QUEUE=base.slice(0,+$("#roundsSel").value);if(!QUEUE.length){$("#stage").innerHTML=`<div class="res">${ROOTONLY?"No words in this unit share a root with the languages you chose. Try another unit, or untick the root filter.":"No words with translations in this unit."}</div>`;return;}
  lastCode="";PLANS=QUEUE.map(i=>plan(DATA[i]));total=PLANS.reduce((a,p)=>a+p.filter(s=>s.m==="say").length,0);
  q=0;score=0;missed=[];ui();nextWord();}
function clearSeats(){document.querySelectorAll(".seat").forEach(s=>{s.classList.remove("on","dim");s.querySelector(".say").textContent="";});}
function nextWord(){if(q>=QUEUE.length)return finish();const v=DATA[QUEUE[q]];STEPS=PLANS[q];si=0;clearSeats();const inPlay=new Set(friends(v).map(L=>L.code));document.querySelectorAll(".seat").forEach(x=>x.classList.toggle("out",!inPlay.has(x.id.slice(2))));setScore();
  $("#cc").innerHTML=`${v.emoji?`<div class="em">${esc(v.emoji)}</div>`:""}<div class="w">${esc(clean(v.w))}</div><button class="hear" type="button" id="hearEn" aria-label="Hear the English word">🔊</button>`;
  $("#fb").textContent="";$("#fb").className="fb";try{Sets.speak(clean(v.w));}catch(e){}
  stepRun(true);}
function point(k,spin){const n=LANGS.length,target=seatXY(k,n)[2],turn=((target-angle)%360+360)%360;angle+=(spin?720:0)+turn;const p=$("#ptr");p.style.transitionDuration=spin?"1.9s":".8s";p.style.transform=`rotate(${angle}deg)`;
  return matchMedia("(prefers-reduced-motion: reduce)").matches?50:(spin?2000:900);}
function stepRun(first){if(si>=STEPS.length){q++;return nextWord();}
  const s=STEPS[si],v=DATA[QUEUE[q]],L=LANGS.find(x=>x.code===s.c),k=LANGS.findIndex(x=>x.code===s.c),my=++tok;
  cur={v,L,tries:0,done:false,k,mode:s.m};busy=true;$("#ctl").innerHTML="";$("#fb").textContent="";$("#fb").className="fb";
  const turnToYou=LEVEL==="mid"&&s.m==="say"&&si>0&&STEPS[si-1].m==="hear";
  if(turnToYou){clearSeats();$("#ask").innerHTML=`👏 Now it's <b>your</b> turn! Say it for each friend, in the same order.`;}
  else $("#ask").innerHTML=first?`Who is it for?…`:"";
  const wait=point(k,first)+(turnToYou?1500:0);
  setTimeout(()=>{if(my!==tok)return;busy=false;
    document.querySelectorAll(".seat").forEach(x=>{x.classList.toggle("dim",x.id!=="s-"+L.code);x.classList.remove("on");});$("#s-"+L.code).classList.add("on");
    if(s.m==="hear"){const t=head(v.trs[L.code].term);$("#s-"+L.code+" .say").textContent=t+(v.trs[L.code].romanization?" · "+v.trs[L.code].romanization:"");
      $("#ask").innerHTML=`🔊 ${L.flag||""} <b>${esc(L.name_en||L.native_name)}</b> says it…`;let go=false;const adv=()=>{if(go||my!==tok)return;go=true;setTimeout(()=>{if(my!==tok)return;si++;stepRun();},650);};
      try{Lang.say(v,L.code,{done:adv});}catch(e){}setTimeout(adv,5000);}
    else{$("#ask").innerHTML=`Say <b>“${esc(clean(v.w))}”</b> in ${L.flag||""} <b>${esc(L.name_en||L.native_name)}</b>`;controls();}},wait);}
function controls(){const mic=micOK?`<button class="mic" id="mic" type="button">🎤 Say it</button>`:"";
  $("#ctl").innerHTML=`${mic}<button class="btn" id="show" type="button">👀 Show me</button>`;
  if(!micOK)$("#fb").innerHTML=`<span class="hint">No microphone listening here: say it out loud, tap “Show me”, then tell me how you did. (Chrome can listen.)</span>`;}
function after(right){const last=si+1>=STEPS.length&&q+1>=QUEUE.length;setScore();
  if(right&&LEVEL!=="hard"||right&&true){const my=tok;$("#ctl").innerHTML=`<button class="btn primary" id="nx" type="button">${last?"See my score":"Next ➜"}</button>`;setTimeout(()=>{if(my===tok&&cur&&cur.done&&$("#nx"))adv();},1400);return;}
  $("#ctl").innerHTML=`<button class="btn primary" id="nx" type="button">${last?"See my score":"Next ➜"}</button>`;}
function adv(){si++;stepRun();}
function reveal(right){if(cur.done)return;cur.done=true;const t=head(cur.v.trs[cur.L.code].term);
  $("#s-"+cur.L.code+" .say").textContent=t+(cur.v.trs[cur.L.code].romanization?" · "+cur.v.trs[cur.L.code].romanization:"");
  if(right===true)score++;else if(right===false&&!missed.includes(QUEUE[q]))missed.push(QUEUE[q]);
  try{Lang.say(cur.v,cur.L.code);}catch(e){}
  if(right==null){$("#ctl").innerHTML=`<button class="btn primary" id="ok" type="button">✓ I knew it</button><button class="btn" id="no" type="button">✗ Not yet</button>`;cur.done=false;return;}
  after(right===true);}
function say(){if(busy||!cur||cur.done)return;const b=$("#mic");if(b){b.classList.add("live");b.disabled=true;b.textContent="🎤 Listening…";}
  $("#fb").className="fb";$("#fb").textContent="";
  Lang.listen(cur.v,cur.L.code,{quiet:true,onDone:r=>{const b2=$("#mic");if(b2){b2.classList.remove("live");b2.disabled=false;b2.textContent="🎤 Say it";}
    if(r.error){if(r.error==="unsupported"||r.error==="language-not-supported"){micOK=false;controls();$("#fb").innerHTML=`<span class="hint">This device can't listen in ${esc(cur.L.name_en||"this language")}. Say it out loud, tap “Show me”, then tell me how you did.</span>`;return;}
      $("#fb").className="fb no";$("#fb").textContent=r.error==="not-allowed"||r.error==="service-not-allowed"?"🎤 Please allow the microphone, then try again.":"🎤 I didn't hear anything. Try again.";return;}
    if(r.ok){$("#fb").className="fb ok";$("#fb").textContent=(r.score>=85?"🌟 Yes! ":"🙂 Good! ")+"I heard “"+r.heard+"” · "+r.score+"%";reveal(true);}
    else{cur.tries++;$("#fb").className="fb no";$("#fb").textContent=`I heard “${r.heard}” (${r.score}%). ${cur.tries>=2?"Let's look at it together.":"Try again, or tap Show me."}`;if(cur.tries>=2)reveal(false);}}});}
function finish(){const n=total;$("#stage").innerHTML=`<div class="res"><div class="big">${score>=n*.8?"🌟":score>=n*.5?"🙂":"💪"} ${score} / ${n}</div><div>${score>=n*.8?"You remembered almost everything!":score>=n*.5?"Nice memory! A few to look at again.":"Good try! Let's practise these again."}</div>
  ${missed.length?`<div class="mlist"><b>To remember</b>${missed.map(i=>{const v=DATA[i];return `<div class="mrow"><b>${esc(clean(v.w))}</b>${friends(v).map(L=>`<span lang="${L.tts_lang||L.code}" dir="${L.dir||"ltr"}">${L.flag||""} ${esc(head(v.trs[L.code].term))}</span>`).join("")}</div>`;}).join("")}</div>`:""}
  <div class="ctl"><button class="btn primary" id="again" type="button">Play again</button>${missed.length?`<button class="btn" id="redo" type="button">Practise the ones I missed</button>`:""}</div></div>`;}
const head=t=>window.Lang&&Lang.head?Lang.head(t):String(t).split(/[≈;/(]/)[0].trim();
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.id==="go"){start();return;}if(t.id==="again"){start();return;}if(t.id==="redo"){start(missed.slice());return;}
  if(t.id==="hearEn"){try{Sets.speak(clean(cur.v.w));}catch(x){}return;}
  if(t.id==="mic"){say();return;}
  if(t.id==="show"){if(cur&&!cur.done&&cur.mode==="say"){if(micOK){reveal(false);}else reveal(null);}return;}
  if(t.id==="ok"){cur.done=true;score++;after(true);return;}
  if(t.id==="no"){cur.done=true;if(!missed.includes(QUEUE[q]))missed.push(QUEUE[q]);after(false);return;}
  if(t.id==="nx"){tok++;adv();}});
