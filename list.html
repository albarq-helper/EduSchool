<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word list · Helper Academy</title><link rel="icon" href="assets/icons/brilliant.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@600&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
:root{--s1:#2347C5;--s2:#C2410C;--s3:#0F766E;--s4:#7C3AED}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#8FA8FF;--s2:#FF9F6B;--s3:#4FD1C0;--s4:#C4A5FF}}
:root[data-theme="dark"]{--s1:#8FA8FF;--s2:#FF9F6B;--s3:#4FD1C0;--s4:#C4A5FF}
.tools{display:flex;flex-direction:column;gap:10px}
.tools .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .q{position:relative;flex:1 1 260px}.tools .q .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}.tools .q input{width:100%;padding-left:36px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font:700 .9rem var(--f-body);color:var(--muted);padding:9px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button{white-space:nowrap}
@media (max-width:600px){.seg button{padding:8px 9px;font-size:.84rem}#modes svg{display:none}}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent);border-radius:11px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles label{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.86rem;padding:6px 10px;border:1px solid var(--rule);border-radius:999px;cursor:pointer;background:var(--paper)}
.toggles label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toggles input{accent-color:var(--accent)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.syl{font:800 1em var(--f-display);letter-spacing:.01em}
.c0{color:var(--s1)}.c1{color:var(--s2)}.c2{color:var(--s3)}.c3{color:var(--s4)}
.syl .dot{color:var(--muted)!important;font-weight:400;margin:0 1px}
/* shown as the whole word (one colour, no gaps); hover (or tap) opens it into coloured syllables */
.c0{--to:var(--s1)}.c1{--to:var(--s2)}.c2{--to:var(--s3)}.c3{--to:var(--s4)}
.syl.anim{display:inline-block;cursor:pointer;transition:transform .25s}
.syl.anim>span:not(.dot){color:var(--ink);transition:color .45s}
.syl.anim>.dot{display:inline-block;overflow:hidden;vertical-align:bottom;max-width:0;opacity:0;margin:0;transition:max-width .45s,opacity .45s,margin .45s}
.syl.anim:is(:hover,:focus-visible,.open)>span:not(.dot){color:var(--to)}
.syl.anim:is(:hover,:focus-visible,.open)>.dot{max-width:1em;opacity:1;margin:0 2px}
.syl.anim:is(:hover,:focus-visible,.open){animation:sylPop .5s .15s}
@keyframes sylPop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.syl.anim,.syl.anim>span{animation:none!important;transition:none!important}}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills span{font:700 .78rem var(--f-body);padding:2px 8px;border-radius:999px;border:1.5px solid currentColor}

.pic{background:#fff;border:1px solid var(--rule);border-radius:14px;object-fit:contain;display:block}
.covered{display:flex;align-items:center;justify-content:center;gap:6px;background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 8px,var(--sheet) 8px,var(--sheet) 16px);border:1.5px dashed var(--rule);border-radius:12px;color:var(--muted);font-weight:700;font-size:.85rem;cursor:pointer}
.boxes{display:inline-flex;gap:3px;flex-wrap:wrap}.boxes i{width:14px;height:20px;border-bottom:2.5px solid var(--muted);display:inline-block}.boxes i.sp{border:0;width:8px}
.ans{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ans input{flex:1 1 160px;min-width:0;font:700 1.05rem var(--f-display)}
.ans textarea{min-height:56px;flex:1 1 220px}
.res{font-weight:700;font-size:.9rem}.res.ok{color:var(--good)}.res.no{color:var(--bad)}
input.ok,textarea.ok{border-color:var(--good)!important;background:var(--good-soft)!important}input.no{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.mean{line-height:1.45}.ex{color:var(--muted);font-size:.93rem}.tr{font-family:var(--f-ar);font-size:1.12rem;align-self:flex-start;unicode-bidi:plaintext;text-align:start}
.utag{font:700 .75rem var(--f-body);padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
/* Detail */
.v-detail{display:flex;flex-direction:column;gap:12px}
.d{display:grid;grid-template-columns:150px 1fr auto;gap:18px;align-items:start;background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.d .pic,.d .covered{width:150px;height:120px}
.d .w{font-size:1.6rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.d .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.gopp .d{grid-template-columns:90px 1fr;gap:12px}.gopp .d .pic,.gopp .d .covered{width:90px;height:80px}.gopp .d .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.gopp .d .w{font-size:1.3rem}
@media (max-width:640px){.d{grid-template-columns:90px 1fr}.d .pic,.d .covered{width:90px;height:80px}.d .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.d .w{font-size:1.3rem}}
/* Grid */
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.g{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.g .pic,.g .covered{width:100%;height:140px}
.g .w{font-size:1.25rem;display:flex;justify-content:space-between;align-items:center;gap:6px}
.g .mean{font-size:.92rem}
/* List */
.v-list table{width:100%}.v-list td{vertical-align:middle}
.v-list .pic,.v-list .covered{width:48px;height:48px;border-radius:10px}
.v-list .w{font-size:1.1rem}
/* Blocks */
.v-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.b{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.b:hover{border-color:var(--accent)}
.b .pic,.b .covered{width:100%;aspect-ratio:1;height:auto}
.b .w{font-size:1.1rem}
.covers{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.cv-btn{display:inline-flex;align-items:center;gap:5px;font:700 .8rem var(--f-body);padding:5px 10px;border-radius:999px;border:1px dashed var(--rule);background:var(--paper);color:var(--muted);cursor:pointer}
.cv-btn:hover{border-color:var(--accent);color:var(--accent)}
.cv-btn[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.say{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.say .lab{font:700 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.say .resp{font:700 1rem var(--f-display);letter-spacing:.02em}
.say .resp .stress{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.say .hint{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:.84rem}
.say .hint b{color:var(--warn)}
.mine{font-size:.92rem;border-left:3px solid var(--rule);padding-left:8px}
.b .bw{cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.b .say{justify-content:center}
.vwrap{position:relative;display:block}.vwrap video{cursor:pointer;background:#fff}.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(27,35,51,.82);color:#fff;font:700 .72rem var(--f-body);padding:3px 8px;border-radius:999px;display:inline-flex;gap:4px;align-items:center;pointer-events:none}.vwrap.playing .vbadge{display:none}
.d .vwrap,.g .vwrap,.b .vwrap{width:100%}.d .vwrap video{width:150px;height:120px}
.empty-l{padding:30px;text-align:center;color:var(--muted)}
@media print{#appbar,#setbar,.tools,.no-print,button.round{display:none!important}.d,.g,.b{box-shadow:none;break-inside:avoid}body{background:#fff}}
.wgroups{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;font:700 .78rem var(--f-body)}
.wgroups .wgl{color:var(--muted);margin-right:2px}
.wgroups .wg{display:inline-flex;align-items:center;border:1.5px solid var(--rule);border-radius:999px;background:var(--paper);overflow:hidden}
.wgroups .wg button{border:0;background:transparent;font:700 .78rem var(--f-body);color:var(--ink);padding:3px 8px;cursor:pointer}
.wgroups .wg button:hover{background:var(--sheet);color:var(--accent)}
.wgroups .wg a{padding:3px 7px;border-left:1px solid var(--rule);color:var(--muted);text-decoration:none}
.wgroups .wg a:hover{color:var(--accent);background:var(--sheet)}
@keyframes wglow{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 4px var(--accent)}}
[data-i].hl{animation:wglow 1.2s ease 2;outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
@media print{.wgroups{display:none}}
.idiom{margin-top:8px;border:1.5px dashed var(--rule);border-radius:12px;padding:8px 12px;display:grid;gap:5px;background:var(--paper);font-size:.95rem}
.idiom .ir{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.idiom .il{font:800 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:7.5em}
.idiom .ar{font-size:1.05rem}
.idiom .sep{color:var(--muted)}
.partners{margin-top:8px;display:grid;gap:4px;font-size:.92rem}
.partners .ph{font:800 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.partners .pr{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.partners .pk{font:700 .78rem var(--f-body);color:var(--muted);min-width:9.5em}
.g .partners .pk{min-width:0;width:100%}
.partners .pk small{font-weight:600;opacity:.8}
.partners .pc{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);border-radius:999px;padding:2px 9px;background:var(--sheet);color:var(--ink)}
.partners .pc b{color:var(--accent)}
.partners .arr{color:var(--muted);font-weight:800}.partners .pmeter{margin:6px 0}
.partners a.pc,.partners button.pc{cursor:pointer;text-decoration:none;font:inherit}
.partners a.pc:hover,.partners button.pc:hover{border-color:var(--accent)}
@media print{.partners .pc{border:0;padding:0 4px}}
</style>

</head><body>
<div class="wrap" style="max-width:1180px">
  <div class="head2">
    <div><span class="eyebrow" id="setEyebrow">&nbsp;</span><h1>Word list</h1>
      <p class="muted" style="margin:4px 0 0">All the words together: picture, syllables, sound and meaning. Cover a part to practise.</p></div>
    <button class="btn small no-print" id="print" type="button"><i data-i="file-up"></i>Print</button>
  </div>

  <section class="card tools no-print">
    <div class="r">
      <label class="q"><i data-i="search"></i><input id="q" type="search" placeholder="Filter words or meanings…" aria-label="Filter words"></label>
      <div id="unitMount" aria-label="Units"></div>
      <div class="seg" role="group" aria-label="View" id="views">
        <button type="button" data-v="detail" aria-pressed="true">Detail</button><button type="button" data-v="grid" aria-pressed="false">Grid</button><button type="button" data-v="list" aria-pressed="false">List</button><button type="button" data-v="blocks" aria-pressed="false">Blocks</button>
      </div>
    </div>
    <div class="r"><div id="groupMount" style="width:100%"></div></div>
    <div class="r">
      <div class="toggles" id="toggles" aria-label="Show">
        <label><input type="checkbox" data-t="pic" checked>Picture</label>
        <label><input type="checkbox" data-t="syl" checked>Syllables</label>
        <label><input type="checkbox" data-t="say" checked>Say it</label>
        <label><input type="checkbox" data-t="mean" checked>Meaning</label>
        <label><input type="checkbox" data-t="ex" checked>Example</label>
        <label><input type="checkbox" data-t="tr" checked>Translation</label>
      </div>
      <button class="btn small" id="shuffle" type="button"><i data-i="shuffle"></i>Shuffle</button>
    </div>
    <div class="r muted" style="font-size:.88rem"><span>Tip: under each word, press <b>Cover word</b> to practise spelling it, or <b>Cover meaning</b> to practise explaining it.</span></div>
    <div class="r" id="practiceBar" hidden>
      <span class="score" id="score"></span>
      <button class="btn small primary" id="checkAll" type="button"><i data-i="check"></i>Check all covered words</button>
      <button class="btn small" id="reset" type="button"><i data-i="eye"></i>Uncover all</button>
    </div>
  </section>

  <div id="count" class="muted"></div>
  <div id="out"></div>
</div>
<script type="text/x-app">
const $=id=>document.getElementById(id), esc=App.esc, D=window.WORDS, U=window.UNITS_LIST;
document.querySelectorAll("[data-i]").forEach(el=>el.insertAdjacentHTML("afterbegin",icon(el.dataset.i,16)));
const store={get(k,d){try{const v=localStorage.getItem("wl_"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("wl_"+k,JSON.stringify(v));}catch(e){}}};
const uname=x=>x.u?(x.name?`Unit ${x.u} · ${x.name}`:`Unit ${x.u}`):(x.name||"General");
const UP=Sets.unitPicker($("unitMount"),()=>render());
const METER_AT={};   // where each Feeling meter was left, so re-drawing keeps it
const GP=Sets.groupPicker($("groupMount"),()=>render(),{view:"both",follow:true});
Sets.loadCompanions().then(n=>{if(n)render();}).catch(()=>{});
Sets.loadPartners(D).then(m=>{PARTNERS=m;if(m.size)render();}).catch(e=>console.warn("partners",e));   // whole-scale words for the Feeling meters
let VIEW=store.get("view","detail"), SHOW=Object.assign({pic:true,syl:true,say:true,mean:true,ex:true,tr:true},store.get("show",{}));
let ORDER=D.map((v,i)=>i), ST={};   // ST[i] = {cw, cm, typed, ok, mtyped, mrev, self}
const S=i=>ST[i]||(ST[i]={});
document.querySelectorAll("#toggles input").forEach(c=>c.checked=SHOW[c.dataset.t]!==false);
if(!D.some(v=>v.ar))document.querySelector('[data-t="tr"]').closest("label").hidden=true;
if(!D.some(v=>v.pron))document.querySelector('[data-t="say"]').closest("label").hidden=true;

// ---- syllables: split the word as written, using the stored syllable pattern ----
function parts(v){const syl=(v.syl||"").split("-").filter(Boolean),w=v.w;
  if(syl.length<2)return [w];
  const out=[];let k=0;
  for(const p of syl){let s="",n=0;while(k<w.length&&n<p.length){const c=w[k];s+=c;if(/[\p{L}\p{N}']/u.test(c))n++;k++;}out.push(s);}
  if(k<w.length)out[out.length-1]+=w.slice(k);
  return out.join("").toLowerCase()===w.toLowerCase()&&out.every(Boolean)?out:[w];}
const sylHTML=v=>{const p=parts(v);return `<span class="syl${SHOW.syl&&p.length>1?" anim":""}"${SHOW.syl&&p.length>1?' tabindex="0" title="Hover or tap to see the syllables"':""} aria-label="${esc(v.w)}">${SHOW.syl&&p.length>1?p.map((s,k)=>`<span class="c${k%4}">${esc(s)}</span>`).join('<span class="dot">·</span>'):`<span>${esc(v.w)}</span>`}</span>`;};
const pillsHTML=v=>{const p=parts(v);return SHOW.syl&&p.length>1?`<div class="pills" aria-label="${p.length} syllables">${p.map((s,k)=>`<span class="c${k%4}">${esc(s.replace(/-$/,""))}</span>`).join("")}<span style="border:0;color:var(--muted)">${p.length} syllables</span></div>`:"";};
// ---- "say it": respelling (stressed part in capitals) + sounds-like hints ----
function sayHTML(v,i){if(!SHOW.say||!v.pron||(i!==undefined&&wordHidden(i)))return "";
  const segs=v.pron.split("-").map((s,k)=>`<span class="c${k%4}${s===s.toUpperCase()&&/[A-Z]/.test(s)&&v.pron.includes("-")?" stress":""}">${esc(s)}</span>`).join('<span class="dot">·</span>');
  const hints=(v.hint||"").split("|").map(h=>h.trim()).filter(Boolean);
  return `<div class="say"><span class="lab">Say it</span><span class="resp">${segs}</span>${hints.map(h=>{const sl=h.split("~"),rh=h.split("≈");
    if(sl.length===2)return `<span class="hint"><b>${esc(sl[0].trim())}</b> sounds like <i>${esc(sl[1].trim())}</i></span>`;
    if(rh.length===2)return `<span class="hint"><b>${esc(rh[0].trim())}</b> rhymes with <i>${esc(rh[1].trim())}</i></span>`;
    return `<span class="hint">${esc(h)}</span>`;}).join("")}</div>`;}
// ---- audio ----
const AU={};
function hear(i){const v=D[i];if(v.au&&v.au!=="tts"){try{const a=AU[i]||(AU[i]=new Audio(v.au));a.currentTime=0;a.play();return;}catch(e){}}Sets.speak(v.w);}
const hearBtn=(i,v)=>`<button class="round" type="button" data-hear="${i}" aria-label="Hear ${S(i).cw?"the word":esc(v.w)}">${icon("volume-2",18)}</button>`;
// ---- per-word cover buttons ----
const coverBtns=i=>{const s=S(i);return `<div class="covers no-print">
  <button type="button" class="cv-btn" data-cw="${i}" aria-pressed="${!!s.cw}">${icon(s.cw?"eye":"eye-off",14)}${s.cw?"Show word":"Cover word"}</button>
  ${SHOW.mean||s.cm?`<button type="button" class="cv-btn" data-cm="${i}" aria-pressed="${!!s.cm}">${icon(s.cm?"eye":"eye-off",14)}${s.cm?"Show meaning":"Cover meaning"}</button>`:""}</div>`;};
// ---- pieces ----
const picHTML=(i,v)=>!SHOW.pic?"":v.vid?`<div class="vwrap">${Sets.media(v,{cls:"pic",alt:S(i).cw?"":v.w,attrs:` data-clip data-i="${i}"`})}<span class="vbadge">${icon("volume-2",12)} Tap to hear</span></div>`:`<img class="pic" src="${esc(v.img)}" alt="${S(i).cw?"":esc(v.w)}" loading="lazy">`;
const exHTML=(i,v)=>{if(!SHOW.ex||!v.s||/^\[[^\]]*\]$/.test(v.s))return "";
  const t=S(i).cw&&S(i).ok===undefined?esc(v.s).replace(/\[([^\]]*)\]/,(m,x)=>"_".repeat(Math.max(4,x.length))):esc(v.s).replace(/\[([^\]]*)\]/,"<b>$1</b>");return `<div class="ex">${t}</div>`;};
// idioms: the word-for-word meaning, the Arabic saying with the same idea, and the real meaning in Arabic
const idiomHTML=(i,v)=>{if(!(v.lit||v.eq||v.author)||(S(i).cm&&!S(i).mrev))return "";const rows=[];
  if(v.author)rows.push(`<div class="ir"><span class="il">✍️ Said by</span><span>${esc(v.author)}</span></div>`);
  if(v.author&&SHOW.tr&&v.ar)rows.push(`<div class="ir"><span class="il">🌍 In Arabic</span><span class="ar" dir="rtl" lang="ar">${esc(v.ar)}</span></div>`);
  if(v.author&&SHOW.tr&&v.eq&&v.eq!==v.ar.replace(/[.،]$/,""))rows.push(`<div class="ir"><span class="il">🗣️ We say</span><span class="ar" dir="rtl" lang="ar">${esc(v.eq)}</span></div>`);
  if(v.author)return `<div class="idiom">${rows.join("")}</div>`;
  if(SHOW.mean&&(v.lit||v.litAr))rows.push(`<div class="ir"><span class="il">🔤 Word for word</span><span>${esc(v.lit)}</span>${SHOW.tr&&v.litAr?`<span class="sep">·</span><span class="ar" dir="rtl" lang="ar">${esc(v.litAr)}</span>`:""}</div>`);
  if(SHOW.tr&&v.eq)rows.push(`<div class="ir"><span class="il">🌍 We say</span><span class="ar" dir="rtl" lang="ar">${esc(v.eq)}</span></div>`);
  if(SHOW.tr&&v.ar)rows.push(`<div class="ir"><span class="il">💡 It means</span><span class="ar" dir="rtl" lang="ar">${esc(v.ar)}</span></div>`);
  return rows.length?`<div class="idiom">${rows.join("")}</div>`:"";};
const trHTML=(i,v)=>SHOW.tr&&v.ar&&!(v.lit||v.eq||v.author)&&!(S(i).cm&&!S(i).mrev)?`<div class="tr" dir="auto">${esc(v.ar)}</div>`:"";
const wordHidden=i=>S(i).cw&&S(i).ok===undefined;
function wordHTML(i,v){
  if(!wordHidden(i))return sylHTML(v);
  return `<span class="boxes" aria-label="${v.w.length} letters">${[...v.w].map(c=>c===" "?'<i class="sp"></i>':"<i></i>").join("")}</span>`;}
function spellHTML(i,v){const s=S(i);if(!s.cw)return "";
  return `<div class="ans"><input type="text" data-spell="${i}" value="${esc(s.typed||"")}" placeholder="Type the word" autocomplete="off" autocapitalize="off" spellcheck="false" class="${s.ok===true?"ok":s.ok===false?"no":""}" aria-label="Spell the word">
    ${s.ok===undefined?`<button class="btn small" type="button" data-check="${i}">Check</button><button class="btn small" type="button" data-giveup="${i}">Show</button>`:`<button class="btn small" type="button" data-again="${i}">${icon("rotate-ccw",14)}Try again</button>`}
    ${s.ok===true?`<span class="res ok">${icon("check",15)} Correct</span>`:s.ok===false?`<span class="res no">${icon("x",15)} It's “${esc(v.w)}”</span>`:""}</div>`;}
function meanHTML(i,v){const s=S(i);
  if(!s.cm)return SHOW.mean?`<div class="mean">${esc(v.d)}</div>`:"";
  if(!s.mrev)return `<div class="ans"><textarea data-mean="${i}" placeholder="Write what it means, in your own words" aria-label="Write the meaning">${esc(s.mtyped||"")}</textarea><button class="btn small" type="button" data-mshow="${i}">${icon("eye",14)}Check meaning</button></div>`;
  return `${s.mtyped?`<div class="mine"><span class="muted">You wrote:</span> ${esc(s.mtyped)}</div>`:""}<div class="mean"><b>Meaning:</b> ${esc(v.d)}</div>
    <div class="ans">${s.self===undefined?`<span class="muted" style="font-size:.88rem">Did you get it?</span><button class="btn small" type="button" data-self="${i}" data-val="1">${icon("check",14)}I got it</button><button class="btn small" type="button" data-self="${i}" data-val="0">${icon("x",14)}Not yet</button>`
      :s.self?`<span class="res ok">${icon("check",15)} Got it</span>`:`<span class="res no">${icon("rotate-ccw",15)} Practise again</span>`}</div>`;}
const unitTag=v=>{if(v.companion)return `<span class="utag" title="Not in this set: shown so you can see the whole scale">Extra word</span>`;const x=U.find(u=>u.u===v.u);return `<span class="utag">${esc(x?uname(x):"")}</span>`;};

// ---- groups this word belongs to: Feeling meters, opposites, themes (similar words) ----
function groupURL(k,t,w){const q=new URLSearchParams(location.search);q.set("g",k+"|"+t);q.set("w",w);return location.pathname+"?"+q.toString();}
function groupsHTML(i,v){if(wordHidden(i))return "";
  const gs=Sets.wordGroups(v).filter(g=>GP.has(g.kind,g.tag));if(!gs.length)return "";
  return `<div class="wgroups no-print"><span class="wgl">Groups:</span>${gs.map(g=>`<span class="wg"><button type="button" data-gk="${g.kind}" data-gt="${esc(g.tag)}" data-gi="${i}" title="${g.kind==="scale"?"Show it on the meter":g.kind==="opp"?"Show it with its opposites":"Show the similar words"}">${esc(g.label)}</button><a href="${esc(groupURL(g.kind,g.tag,v.w))}" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open ${esc(g.label)} in a new tab">↗</a></span>`).join("")}</div>`;}
// jump to a group on this page, with the meter set to the word and its card highlighted
function jumpTo(kind,tag,i){const v=D[i];
  if(kind==="scale"){const x=Sets.scaleOfWord(v,tag);if(x)METER_AT[tag]=x.r;}
  $("q").value="";
  GP.set(kind,tag);
  requestAnimationFrame(()=>{const el=$("out").querySelector(`[data-i="${i}"]`);
    if(!el){const sec=$("out").querySelector(".gsec");if(sec)sec.scrollIntoView({behavior:"smooth",block:"start"});return;}
    el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("hl");void el.offsetWidth;el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),2600);});}
function showWord(i){const v=D[i];if(!v)return;if(!visible().includes(i)){$("q").value="";if(!visible().includes(i))GP.set("all","");}
  requestAnimationFrame(()=>{let el=$("out").querySelector(`[data-i="${i}"]`);if(!el){$("q").value=v.w;render();el=$("out").querySelector(`[data-i="${i}"]`);}
    if(!el)return;el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("hl");void el.offsetWidth;el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),2600);});}
function wordIndex(w){const t=String(w||"").toLowerCase();let k=D.findIndex(v=>!v.companion&&String(v.w).toLowerCase()===t);if(k<0)k=D.findIndex(v=>String(v.w).toLowerCase()===t);return k;}
// ---- word partners: the words that go with this word (heavy rain, rain heavily, make a mistake…) ----
var PARTNERS=PARTNERS||new Map();   // var: the loader above may finish before this line runs
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function boldPartner(phrase,partner){let h=esc(phrase);String(partner||"").split(" … ").filter(Boolean).forEach(x=>{h=h.replace(new RegExp("("+reEsc(esc(x))+")","i"),"<b>$1</b>");});return h;}
function partnerChip(x,mode){const inner=mode==="word"?`<b>${esc(x.link?x.link.w:x.partner)}</b>`:x.kind==="idiom"?`💬 <b>${esc(x.phrase)}</b>`:x.kind==="saying"?`📜 “${esc(x.phrase)}”`:boldPartner(x.phrase,x.partner);
  if(!x.link)return `<span class="pc">${inner}</span>`;
  if(!x.link.set){const k=wordIndex(x.link.w);return k>=0?`<button type="button" class="pc" data-pw="${k}" title="Go to ${esc(x.link.w)}">${inner} ↓</button>`:`<span class="pc">${inner}</span>`;}
  const q=new URLSearchParams({set:x.link.set,w:x.link.w});return `<a class="pc" href="list.html?${q}" target="_blank" rel="noopener" title="Open ${esc(x.link.w)} in a new tab">${inner} ↗</a>`;}
function partnersHTML(i,v){if(wordHidden(i)||!v.wid)return "";const P=PARTNERS.get(v.wid);if(!P||!(P.own.length||P.also.length))return "";
  const SC=Sets.partnerScales(P.own),onMeter=new Set(SC.filter(s=>s.items.length>1).flatMap(s=>s.items.map(x=>x.phrase)));
  const KL={adjective:"adjectives",adverb:"adverbs",idiom:"idioms",verb:"verbs",noun:"nouns",preposition:"little words"};
  const meters=SC.filter(s=>s.items.length>1).map((s,n)=>`<div class="pr"><span class="pk">🎚️ ${esc(s.g.split(" · ")[0])} · ${KL[s.kind]||s.kind}</span>${s.items.map(x=>`<span class="pc">${x.kind==="idiom"?"💬 "+esc(x.phrase):boldPartner(x.phrase,x.partner)}</span>`).join('<span class="arr">→</span>')}<button type="button" class="pc pmb" data-pm="${i}|${n}">🎚️ Open meter</button></div><div class="pmeter" id="pm-${i}-${n}" hidden></div>`).join("");
  const rows=meters+Sets.PARTNER_KINDS.map(([k,lab,hint])=>{const xs=P.own.filter(x=>x.kind===k&&!onMeter.has(x.phrase));return xs.length?`<div class="pr"><span class="pk">${lab}${hint?` <small>${hint}</small>`:""}</span>${xs.map(x=>partnerChip(x)).join("")}</div>`:"";}).join("");
  const also=P.also.length?(v.author?`<div class="pr"><span class="pk">📖 Words in this saying</span>${P.also.map(x=>partnerChip(x,"word")).join("")}</div>`:`<div class="pr"><span class="pk">🔁 Also used in</span>${P.also.map(x=>partnerChip(x)).join("")}</div>`):"";
  return `<div class="partners"><span class="ph">${v.author?"🔗 Linked words":"🔗 Goes with"}</span>${rows}${also}</div>`;}
// ---- views ----
function card(i,view){const v=D[i], hid=wordHidden(i);
  if(view==="detail")return `<article class="d" data-i="${i}">${SHOW.pic?picHTML(i,v):"<span></span>"}
    <div class="body"><div class="w">${wordHTML(i,v)}</div>${hid?"":pillsHTML(v)}${sayHTML(v,i)}${spellHTML(i,v)}${meanHTML(i,v)}${idiomHTML(i,v)}${exHTML(i,v)}${trHTML(i,v)}${partnersHTML(i,v)}${groupsHTML(i,v)}${coverBtns(i)}</div>
    <div class="side">${unitTag(v)}${hearBtn(i,v)}</div></article>`;
  if(view==="grid")return `<article class="g" data-i="${i}">${picHTML(i,v)}<div class="w">${wordHTML(i,v)}${hearBtn(i,v)}</div>${hid?"":pillsHTML(v)}${sayHTML(v,i)}${spellHTML(i,v)}${meanHTML(i,v)}${idiomHTML(i,v)}${trHTML(i,v)}${partnersHTML(i,v)}${groupsHTML(i,v)}${coverBtns(i)}</article>`;
  if(view==="blocks")return `<article class="b" data-i="${i}">${picHTML(i,v)}<div class="w bw" data-hear="${i}" role="button" tabindex="0" aria-label="Hear the word">${wordHTML(i,v)} ${icon("volume-2",15)}</div>${sayHTML(v,i)}${spellHTML(i,v)}${S(i).cm?meanHTML(i,v):""}${groupsHTML(i,v)}${coverBtns(i)}</article>`;
  return `<tr data-i="${i}">${SHOW.pic?`<td>${picHTML(i,v)}</td>`:""}<td><div class="w">${wordHTML(i,v)}</div>${sayHTML(v,i)}${spellHTML(i,v)}</td><td>${hearBtn(i,v)}</td>
    <td>${meanHTML(i,v)}${idiomHTML(i,v)}${partnersHTML(i,v)}${groupsHTML(i,v)}${coverBtns(i)}</td>${SHOW.tr&&D.some(x=>x.ar)?`<td class="tr" dir="auto">${S(i).cm&&!S(i).mrev?"":esc(v.ar)}</td>`:""}<td>${unitTag(v)}</td></tr>`;}
function visible(){const q=$("q").value.trim().toLowerCase();
  return ORDER.filter(i=>{const v=D[i];return UP.match(v)&&GP.match(v)&&(!q||(v.w+" "+v.d+" "+v.ar+" "+(v.lit||"")+" "+(v.eq||"")).toLowerCase().includes(q));});}
function render(){const L=visible();
  $("count").textContent=L.length+(L.length===1?" word":" words");
  if(!L.length){$("out").innerHTML='<div class="card empty-l">No words match.</div>';score();return;}
  const view=M=>VIEW==="list"?`<div class="card v-list" style="padding:0"><div class="tablewrap"><table><thead><tr>${SHOW.pic?"<th></th>":""}<th>Word</th><th></th><th>Meaning</th>${SHOW.tr&&D.some(x=>x.ar)?`<th>${esc(window.TL_NAME||"Translation")}</th>`:""}<th>Unit</th></tr></thead><tbody>${M.map(i=>card(i,"list")).join("")}</tbody></table></div></div>`
    :`<div class="v-${VIEW}">${M.map(i=>card(i,VIEW)).join("")}</div>`;
  // grouped by word type / theme / opposites (or one plain list)
  const secs=GP.sections(L),vo=GP.view();$("out").innerHTML=Sets.sectionsHTML(secs,view,vo);
  Sets.mountMeters($("out"),secs,{follow:vo.follow,start:METER_AT,onLevel:(t,r)=>{METER_AT[t]=r;}});
  score();}
function rerender(i,focus){const all=$("out").querySelectorAll(`[data-i="${i}"]`),el=all[0];if(!el||all.length>1){render();return;}
  const t=document.createElement(VIEW==="list"?"tbody":"div");t.innerHTML=card(i,VIEW);const n=t.firstElementChild;el.replaceWith(n);score();
  if(focus){const f=n.querySelector(focus);if(f)f.focus();}}
function score(){const L=visible(),cw=L.filter(i=>S(i).cw),cm=L.filter(i=>S(i).cm);
  $("practiceBar").hidden=!cw.length&&!cm.length;$("checkAll").hidden=!cw.length;
  const parts=[];
  if(cw.length){const done=cw.filter(i=>S(i).ok!==undefined);parts.push(`Spelling: ${done.filter(i=>S(i).ok).length} correct of ${done.length} checked (${cw.length} covered)`);}
  if(cm.length){const done=cm.filter(i=>S(i).self!==undefined);parts.push(`Meanings: ${done.filter(i=>S(i).self).length} got it of ${done.length} marked (${cm.length} covered)`);}
  $("score").textContent=parts.join(" · ");}
// ---- events ----
const norm=s=>String(s).trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ");
function check(i){const inp=$("out").querySelector(`[data-spell="${i}"]`);const typed=inp?inp.value:"";if(!typed.trim())return false;
  Object.assign(S(i),{typed,ok:norm(typed)===norm(D[i].w)});rerender(i);return true;}
$("out").addEventListener("click",e=>{const b=e.target.closest("[data-gk]");if(!b)return;jumpTo(b.dataset.gk,b.dataset.gt,+b.dataset.gi);});
$("out").addEventListener("click",e=>{const b=e.target.closest("[data-pw]");if(!b)return;showWord(+b.dataset.pw);});
$("out").addEventListener("click",e=>{const b=e.target.closest("[data-pm]");if(!b)return;const [i,n]=b.dataset.pm.split("|").map(Number),el=$(`pm-${i}-${n}`);if(!el)return;
  el.hidden=!el.hidden;b.textContent=el.hidden?"🎚️ Open meter":"✕ Close meter";if(!el.hidden&&!el.dataset.on){el.dataset.on=1;const v=D[i],sc=Sets.partnerScales(PARTNERS.get(v.wid).own).filter(s=>s.items.length>1)[n];Sets.mountPartnerMeter(el,sc,{emoji:v.emoji});}});
$("out").addEventListener("click",e=>{const b=e.target.closest("[data-hear],[data-check],[data-giveup],[data-again],[data-mshow],[data-self],[data-cw],[data-cm]");if(!b)return;
  if(b.dataset.hear!==undefined){hear(+b.dataset.hear);return;}
  if(b.dataset.cw!==undefined){const i=+b.dataset.cw,s=S(i);if(s.cw){delete s.cw;delete s.typed;delete s.ok;rerender(i);}else{s.cw=true;rerender(i,"[data-spell]");}return;}
  if(b.dataset.cm!==undefined){const i=+b.dataset.cm,s=S(i);if(s.cm){delete s.cm;delete s.mtyped;delete s.mrev;delete s.self;rerender(i);}else{s.cm=true;rerender(i,"[data-mean]");}return;}
  if(b.dataset.check!==undefined)check(+b.dataset.check);
  if(b.dataset.giveup!==undefined){const i=+b.dataset.giveup;Object.assign(S(i),{ok:false,typed:S(i).typed||""});rerender(i);}
  if(b.dataset.again!==undefined){const i=+b.dataset.again;delete S(i).ok;S(i).typed="";rerender(i,"[data-spell]");}
  if(b.dataset.mshow!==undefined){const i=+b.dataset.mshow,t=$("out").querySelector(`[data-mean="${i}"]`);Object.assign(S(i),{mtyped:t?t.value.trim():"",mrev:true});rerender(i);}
  if(b.dataset.self!==undefined){const i=+b.dataset.self;S(i).self=b.dataset.val==="1";rerender(i);}});
$("out").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset.spell!==undefined){e.preventDefault();const i=+e.target.dataset.spell;if(check(i)){const nx=[...$("out").querySelectorAll("[data-spell]")].find(x=>S(+x.dataset.spell).ok===undefined);if(nx)nx.focus();}}
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset.hear!==undefined&&e.target.getAttribute("role")==="button"){e.preventDefault();hear(+e.target.dataset.hear);}});
$("out").addEventListener("click",e=>{const v=e.target.closest("video[data-clip]");if(!v)return;
  // A tap says the word ONCE and plays the clip once with its own sounds; then it loops silently. A second tap stops it.
  if(!v.dataset.stick){document.querySelectorAll("video[data-clip]").forEach(o=>{if(o!==v){Sets.stopClip(o);delete o.dataset.stick;o.parentNode.classList.remove("playing");}});
    Sets.playClip(v,D[+v.dataset.i]);v.dataset.stick=1;v.parentNode.classList.add("playing");}
  else{Sets.stopClip(v);delete v.dataset.stick;v.parentNode.classList.remove("playing");}});
// clips already play silently while on screen (Sets.watchClips); no hover preview needed
$("out").addEventListener("input",e=>{const t=e.target;if(t.dataset.spell!==undefined)S(+t.dataset.spell).typed=t.value;if(t.dataset.mean!==undefined)S(+t.dataset.mean).mtyped=t.value;});
const press=(grp,attr,val)=>document.querySelectorAll(`#${grp} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset[attr]===val));
$("views").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;VIEW=b.dataset.v;store.set("view",VIEW);press("views","v",VIEW);render();};
$("toggles").onchange=e=>{SHOW[e.target.dataset.t]=e.target.checked;store.set("show",SHOW);render();};
$("q").oninput=render;
$("shuffle").onclick=()=>{for(let a=ORDER.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[ORDER[a],ORDER[b]]=[ORDER[b],ORDER[a]];}render();};
$("reset").onclick=()=>{ST={};render();};
$("print").onclick=()=>window.print();
$("checkAll").onclick=()=>{const L=visible().filter(i=>S(i).cw);L.forEach(i=>{const inp=$("out").querySelector(`[data-spell="${i}"]`);const typed=inp?inp.value:S(i).typed||"";Object.assign(S(i),{typed,ok:norm(typed)===norm(D[i].w)});});render();
  const n=L.length,r=L.filter(i=>S(i).ok).length;if(!n)return;
  App.saveAttempt({activity:"spell-test",detail:"Word list",units:[...new Set(L.map(i=>D[i].u))],score:r,total:n,answers:L.map(i=>({word:D[i].w,unit:D[i].u,given:S(i).typed,correct:S(i).ok}))})
    .then(x=>{if(x.error)App.status("Result not saved: "+x.error.message,false);else if(x.id)App.status(`Result saved: ${r} of ${n}`,true);});};
press("views","v",VIEW);render();
// opened from a ↗ link: ?g=<kind>|<group>&w=<word>
(function(){const q=new URLSearchParams(location.search),g=q.get("g");if(!g){const w=q.get("w");if(w){const i=wordIndex(w);if(i>=0)showWord(i);}return;}const k=g.indexOf("|"),kind=g.slice(0,k),tag=g.slice(k+1);
  const go=()=>{const i=wordIndex(q.get("w"));if(i>=0){jumpTo(kind,tag,i);return true;}if(GP.has(kind,tag))GP.set(kind,tag);return false;};
  if(!go())Sets.loadCompanions().then(()=>go()).catch(()=>{});})();
// touch screens have no hover: a tap on the word opens / closes its syllables
document.addEventListener("click",e=>{const s=e.target.closest(".syl.anim");if(s)s.classList.toggle("open");});
document.addEventListener("keydown",e=>{const s=e.target.closest&&e.target.closest(".syl.anim");if(s&&(e.key==="Enter"||e.key===" ")){e.preventDefault();s.classList.toggle("open");}});
</script>
<script>Sets.boot({min:1})</script>
</body></html>
